# Publish to npm from GitHub Actions with OIDC: no npm token, and every
# package gets Sigstore provenance.
#
# Once, before the first run, tell npm this workflow may publish:
#
#   pantry login
#   pantry publisher:add --repository owner/repo --workflow npm-publish.yml
#
# Without --package, publisher:add sets up every publishable package of the
# monorepo it's run in. See docs/NPM_OIDC_PUBLISHING.md.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Run by hand to publish what a release left out

jobs:
  npm:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # npm exchanges the workflow's OIDC token for a publish token
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pantry-pm/pantry/packages/action@main
        with:
          install: 'false'

      - name: Install and build
        run: |
          bun install
          bun run build

      # From the repo root, every non-private package in packages/ goes up
      # in dependency order, `workspace:` ranges pinned to real versions.
      # Versions already on npm are skipped, so a rerun only publishes what's
      # missing. Built above, so packages don't rebuild themselves.
      - name: Publish
        run: pantry publish --npm --access public --ignore-scripts
