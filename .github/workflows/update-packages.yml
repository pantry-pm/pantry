name: Update Packages

# Hourly, and that is the only clock in the system.
#
# A project that publishes tells the registry — `POST /api/rebuild` with a
# token it can mint itself by signing up at pantry.dev, no arrangement with us
# needed — and the domain waits in the registry's queue until this run claims
# it. That is a bound of an hour, not a minute, and it is deliberate: the
# registry starting a run the moment it was told would mean holding a
# credential that can write to this repository, and a standing write credential
# on an internet-facing service is a poor trade for the other fifty-nine
# minutes.
#
# The sweep covers everyone who cannot tell us anything, which today is nearly
# everyone: curl, php, postgres and several hundred others have never heard of
# us. Dropping it would freeze every one of them at whatever version they
# happened to be on.
#
# What did change is the cadence. At `*/20` this re-derived every recipe's
# version list from the GitHub API — 600+ requests — three times an hour, to
# rediscover what any publisher on the API path had already told us. Hourly is
# a third of those requests and, because GitHub throttles scheduled workflows
# on a busy account and was firing this every two or three hours regardless,
# is not actually less often than what was happening. The cron is a floor on
# freshness, not a promise of it; anything needing better than that has the
# API.
on:
  schedule:
    # The fallback for packages that cannot notify us. Not the fast path —
    # `drain-release-queue.yml` dispatches this workflow within minutes of a
    # release, because a dispatch is not subject to the throttling below.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Package domain(s) to refresh, space-separated (empty = every recipe)'
        required: false
        type: string
      claimed-only:
        description: 'Refresh only what the registry queue hands us — no sweep. Used by drain-release-queue.'
        required: false
        default: false
        type: boolean

concurrency:
  group: update-packages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-packages:
    name: Update packages and index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Before `bun install`, never between it and the steps that need
      # node_modules. This action installs the released pantry binary and runs
      # `pantry install`, which lays out node_modules itself — when it ran in
      # the middle of the job it relaid an already-hoisted tree as isolated and
      # every `bun ...` step after it failed to resolve its imports. Every
      # other workflow here already sets pantry up first; this one didn't, and
      # it is the only one that broke.
      - name: Setup Pantry & Zig (zig is needed to format generated.zig)
        uses: ./packages/action

      # Last word on node_modules. Any step below can rely on the hoisted
      # layout that bunfig.toml (and pantry.toml) ask for.
      - name: Install dependencies
        run: bun install

      # Take what publishers reported since the last run. This is the only
      # thing that consumes those notifications, so a release sits in the queue
      # for at most one sweep. Claim empties the queue in the same request, so
      # two runs cannot both take the same domains and the queue cannot grow
      # without bound.
      #
      # Best-effort by construction: if the registry is unreachable, the sweep
      # below still refreshes every recipe, this one included.
      - name: Claim released packages from the registry
        id: claimed
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          domains=""
          if [ -n "${PANTRY_TOKEN:-}" ]; then
            body="$(curl -sS --max-time 20 -X POST https://registry.pantry.dev/api/rebuild-queue/claim \
              -H "Authorization: Bearer $PANTRY_TOKEN" || echo '')"
            domains="$(printf '%s' "$body" | jq -r '(.claimed // []) | join(" ")' 2>/dev/null || echo '')"
          else
            echo "::warning::No PANTRY_TOKEN — release notifications will not be claimed this run."
          fi

          if [ -n "$domains" ]; then
            echo "Claimed from the registry: $domains"
          else
            echo "Nothing claimed."
          fi
          echo "domains=$domains" >> "$GITHUB_OUTPUT"

      - name: Fetch versions from recipes (GitHub API)
        env:
          # PAT first. `secrets.GITHUB_TOKEN` is capped per repository per hour
          # and this sweep spends 600+ requests of it in one run, several times
          # an hour, alongside every other workflow here.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          # A manual run may name one domain; the cron sweeps everything.
          TARGET_DOMAIN: ${{ inputs.domain }}
          CLAIMED_DOMAINS: ${{ steps.claimed.outputs.domains }}
          CLAIMED_ONLY: ${{ inputs.claimed-only }}
        run: |
          cd packages/ts-pantry
          # No `|| true`. It hid every failure this script can have — including a
          # rate-limited sweep, which reports "no versions found" for hundreds of
          # packages and then commits that as though it had checked them.
          # What this run does is decided by why it started, NOT by what is in
          # the queue. Branching on the queue meant a scheduled run that found
          # anything claimed refreshed only those domains and skipped its
          # sweep — and since notifications arrive continuously, a steady
          # trickle of them would have starved the sweep indefinitely, freezing
          # every package that has no way to notify us. Which is most of them.
          #
          # `claimed-only` does not reintroduce that. It is set by the trigger,
          # by a run that exists solely to drain the queue; a scheduled run
          # never sets it and always sweeps. Reading the queue to decide is
          # still the thing we do not do.
          #
          # Something dispatches this workflow again now — see
          # `drain-release-queue.yml`. A scheduled run remains the fallback, and
          # still sweeps everything.
          if [[ -n "$TARGET_DOMAIN" || "$CLAIMED_ONLY" == "true" ]]; then
            # Targeted: this domain, plus anything queued that we are now the
            # run for. No sweep — refreshing one package should not cost 600
            # requests.
            for domain in $TARGET_DOMAIN $CLAIMED_DOMAINS; do
              case " $seen " in *" $domain "*) continue ;; esac
              seen="$seen $domain"
              echo "Refreshing $domain..."
              bun scripts/version-fetcher.ts --domain "$domain"
            done
          else
            # Scheduled, or a manual run with no domain. The sweep covers every
            # recipe, claimed ones included, so they need nothing extra here —
            # claiming them still matters, because it stops the queue growing
            # without bound.
            echo "Fetching versions from native TS recipes..."
            bun scripts/version-fetcher.ts
          fi
        timeout-minutes: 15

      - name: Generate index
        run: cd packages/ts-pantry && bun bin/cli.ts generate-index
        timeout-minutes: 5

      - name: Generate aliases
        run: cd packages/ts-pantry && bun bin/cli.ts generate-aliases
        timeout-minutes: 5

      # PantryConfig uses this generated map for version autocomplete. Updating
      # package metadata without refreshing it leaves newly discovered runtime
      # versions installable but rejected by TypeScript consumers.
      - name: Generate package version types
        run: cd packages/ts-pantry && bun scripts/generate-package-types.ts
        timeout-minutes: 5

      # The Zig CLI reads its package catalog from a committed, generated file
      # (packages/zig/src/packages/generated.zig). Regenerate it from the freshly
      # fetched recipe versions so the binary always sees current versions — this
      # used to be skipped, leaving the catalog months stale.
      - name: Regenerate Zig package catalog
        run: |
          cd packages/ts-pantry
          bun bin/cli.ts generate-zig --packages-dir src/packages \
            --output ../zig/src/packages/generated.zig
          # generate-zig runs `zig fmt` itself when zig is on PATH (set up above).
        timeout-minutes: 5

      - name: Check for changes
        id: git-check
        run: |
          CHANGES=$(git status --porcelain packages/ts-pantry/src/packages/ packages/ts-pantry/src/generated-package-names.ts packages/zig/src/packages/generated.zig 2>/dev/null || echo "")
          if [[ -z "$CHANGES" ]]; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No version changes detected"
          else
            echo "Changes detected:"
            echo "$CHANGES"
            echo "changes=true" >> $GITHUB_OUTPUT

            # Count changed packages
            TOTAL=$(echo "$CHANGES" | wc -l | tr -d ' ')
            echo "total_updated=$TOTAL" >> $GITHUB_OUTPUT
          fi

      - name: Generate commit message
        id: commit-message
        if: steps.git-check.outputs.changes == 'true'
        run: |
          bun packages/ts-pantry/scripts/generate-update-commit-message.ts \
            --message-file /tmp/pantry-update-commit-message.txt

      - name: Safeguard
        id: deletion-check
        if: steps.git-check.outputs.changes == 'true'
        run: |
          DELETED=$(git diff --diff-filter=D --name-only HEAD -- packages/ts-pantry/src/packages/ | wc -l | tr -d ' ')
          if [ "$DELETED" -gt 50 ]; then
            echo "ERROR: $DELETED files deleted, exceeds threshold"
            echo "safe_to_commit=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "safe_to_commit=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        id: commit
        if: steps.git-check.outputs.changes == 'true' && steps.deletion-check.outputs.safe_to_commit == 'true'
        run: |
          # Use github-actions[bot] for automated commits regardless of token source
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          fi

          git add packages/ts-pantry/src/packages/ packages/zig/src/packages/generated.zig
          git commit -F /tmp/pantry-update-commit-message.txt
          git stash --include-untracked
          if ! git pull --rebase origin refs/heads/main; then
            echo "::warning::Rebase failed, aborting rebase and retrying with merge"
            git rebase --abort
            git pull origin refs/heads/main
          fi
          git stash pop || true
          git push origin HEAD:refs/heads/main

          echo "committed=true" >> $GITHUB_OUTPUT

      - name: Publish updated packages to the registry
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Publish version bumps to the registry AS THEY LAND — on the cheap
          # ubuntu runners ONLY. publish-changed-packages builds linux-x86-64 +
          # linux-arm64 from source and produces darwin-arm64 via the download
          # fanout; it never spins up a macOS runner (which bill 10x). This
          # replaces the old dispatch to `build.yml -f platform=unix`, which
          # source-compiled every bump on a macOS-15 runner unsupervised.
          #
          # We dispatch explicitly rather than rely on publish-changed's `push`
          # trigger: this bot commit is pushed with GITHUB_TOKEN (no PAT_TOKEN
          # secret is set), and GITHUB_TOKEN pushes do NOT fire other workflows'
          # push triggers — which is exactly why updates never published before.
          CHANGED=$(git diff --name-only HEAD~1 -- packages/ts-pantry/src/packages/ 2>/dev/null)
          [ -z "$CHANGED" ] && exit 0

          DOMAINS=""
          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            [ -f "$filepath" ] || continue
            # Skip index/alias artifacts, and — crucially — desktop apps + fonts:
            # those include macOS/DMG packages that publish-changed cannot build on
            # its ubuntu legs. check-desktop-updates.yml routes them to the correct
            # native host instead; routing them here would fail the run.
            case "$filepath" in
              */aliases.ts|*/generated-*|*/index.ts|*/packages/apps/*|*/packages/fonts/*) continue ;;
            esac
            DOMAIN=$(grep -m 1 "domain:" "$filepath" 2>/dev/null | sed "s/.*domain: '//" | sed "s/' as const.*//" | tr -d ' \n\r')
            [ -z "$DOMAIN" ] && continue
            DOMAINS="${DOMAINS:+$DOMAINS,}$DOMAIN"
          done <<< "$CHANGED"

          [ -z "$DOMAINS" ] && exit 0
          # rebuild-existing=false: this workflow commits src/packages/ and
          # nothing else, so every domain here is a pure version bump. The new
          # version is missing from S3 and gets built regardless; --force would
          # only re-upload the entire back catalogue alongside it (one cmake.org
          # bump had each leg re-upload 20 versions to publish 3).
          echo "Dispatching publish-changed-packages (ubuntu-only) for: $DOMAINS"
          gh workflow run publish-changed-packages.yml -f packages="$DOMAINS" -f rebuild-existing=false
        timeout-minutes: 2

      - name: discord-failure-alert
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          title: Update Packages — Failed
          description: Version update workflow failed
          status: failure
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
