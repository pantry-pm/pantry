name: Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check registry health
        id: registry
        run: |
          # The gateway can briefly return 502 while the registry is restarting.
          # Require a sustained failure rather than paging on one transient sample.
          HTTP_CODE=000
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o /tmp/health-response -w '%{http_code}' \
              --max-time 15 \
              'https://registry.pantry.dev/health' 2>/dev/null) || true
            HTTP_CODE="${HTTP_CODE: -3}"
            [ "$HTTP_CODE" = "200" ] && break
            echo "Registry health attempt $attempt returned HTTP $HTTP_CODE"
            [ "$attempt" -lt 5 ] && sleep 3
          done
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          else
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture pre-recovery service diagnostics
        if: steps.registry.outputs.status == 'unhealthy'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGISTRY_SSH_KEY }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry.pantry.dev' }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || 'root' }}
          REGISTRY_SERVICE: ${{ vars.REGISTRY_SERVICE || 'pantry-registry' }}
        run: |
          mkdir -p ~/.ssh
          (umask 077 && cat > ~/.ssh/id_rsa <<< "$SSH_PRIVATE_KEY")
          ssh-keyscan -H "$REGISTRY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectionAttempts=3 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "${REGISTRY_USER}@${REGISTRY_HOST}" \
            "bash -s -- '${REGISTRY_SERVICE}'" << 'EOF'
            set -u
            SERVICE="$1"
            for unit in "$SERVICE" clamav-daemon rpx-gateway apt-daily-upgrade; do
              echo "[$unit]"
              systemctl show "$unit" --no-pager \
                --property=Id \
                --property=ActiveState \
                --property=SubState \
                --property=Result \
                --property=NRestarts \
                --property=ExecMainCode \
                --property=ExecMainStatus \
                --property=ExecMainStartTimestamp \
                --property=ExecMainExitTimestamp \
                --property=MemoryCurrent \
                --property=MemoryPeak \
                --property=MemoryMax \
                --property=TasksCurrent \
                2>/dev/null || true
            done
            echo "[failed-units]"
            systemctl list-units --failed --no-legend --no-pager || true
            echo "[kernel-memory-events]"
            journalctl -k --since '-30 minutes' --no-pager -o short-iso \
              | grep -Ei 'out of memory|oom-kill|killed process|memory cgroup' \
              | tail -n 50 || true
            echo "[relevant-timers]"
            systemctl list-timers --all --no-pager \
              | grep -Ei 'apt|clam|pantry' || true
          EOF

      - name: Recover registry through Hetzner deploy
        id: recovery
        if: steps.registry.outputs.status == 'unhealthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Registry remained unhealthy; dispatching the canonical Hetzner deploy workflow"
          gh workflow run deploy-registry.yml -R "${{ github.repository }}" --ref main

          HTTP_CODE=000
          for attempt in $(seq 1 18); do
            HTTP_CODE=$(curl -sS -o /tmp/recovery-response -w '%{http_code}' \
              --max-time 15 \
              'https://registry.pantry.dev/health' 2>/dev/null) || true
            HTTP_CODE="${HTTP_CODE: -3}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Registry recovered after deploy dispatch"
              break
            fi
            echo "Recovery attempt $attempt returned HTTP $HTTP_CODE"
            [ "$attempt" -lt 18 ] && sleep 10
          done

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          else
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          fi

      - name: Check object storage accessibility
        id: s3
        env:
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'hetzner' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
          S3_REGION: ${{ vars.S3_REGION || 'fsn1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          # The AWS CLI requires AWS_* names even for S3-compatible providers.
          # Pantry uses only the Hetzner object-storage credentials.
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.S3_REGION || 'fsn1' }}
        run: |
          ENDPOINT_ARGS=()
          if [ -n "$S3_ENDPOINT" ]; then
            case "$S3_ENDPOINT" in
              http://*|https://*) ENDPOINT_URL="$S3_ENDPOINT" ;;
              *) ENDPOINT_URL="https://$S3_ENDPOINT" ;;
            esac
            ENDPOINT_ARGS=(--endpoint-url "$ENDPOINT_URL")
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Object-storage credentials are not configured for $STORAGE_PROVIDER"
            echo "status=misconfigured" >> "$GITHUB_OUTPUT"
          elif aws s3api head-bucket --bucket "$S3_BUCKET" "${ENDPOINT_ARGS[@]}" 2>/dev/null; then
            echo "status=accessible" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cannot access $STORAGE_PROVIDER bucket $S3_BUCKET"
            echo "status=inaccessible" >> "$GITHUB_OUTPUT"
          fi
          echo "provider=$STORAGE_PROVIDER" >> "$GITHUB_OUTPUT"
          echo "bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Check recent workflow failures
        id: failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TWO_HOURS_AGO=$(date -u -d '2 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          # Use -i to capture headers so we can distinguish a real 0-failure
          # response from a 403 rate-limit masquerading as "all green".
          RESP=$(gh api -i \
            "repos/${{ github.repository }}/actions/runs?status=failure&created=>=$TWO_HOURS_AGO&per_page=100" 2>/dev/null || true)
          STATUS=$(printf '%s' "$RESP" | head -n1 | awk '{print $2}')
          REMAINING=$(printf '%s' "$RESP" | awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {print $2}' | tr -d '\r')

          if [ "$STATUS" != "200" ]; then
            echo "::warning::GitHub API returned $STATUS (remaining=$REMAINING) while checking failures — skipping this check"
            echo "count=-1" >> "$GITHUB_OUTPUT"
            echo "status=unknown" >> "$GITHUB_OUTPUT"
          else
            BODY=$(printf '%s' "$RESP" | awk 'f;/^\r?$/{f=1}')
            FAIL_COUNT=$(printf '%s' "$BODY" | jq '[.workflow_runs[] | select(.name != "Health Monitor")] | length' 2>/dev/null || echo "0")
            echo "count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_COUNT" -gt 10 ]; then
              echo "status=elevated" >> "$GITHUB_OUTPUT"
            else
              echo "status=normal" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check registry update pipelines
        id: pipelines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=""
          NOW=$(date -u +%s)

          add_issue() {
            if [ -n "$ISSUES" ]; then
              ISSUES="$ISSUES; $1"
            else
              ISSUES="$1"
            fi
          }

          check_pipeline() {
            WORKFLOW="$1"
            LABEL="$2"
            MAX_AGE_HOURS="$3"

            RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/$WORKFLOW/runs?per_page=1" \
              --jq '.workflow_runs[0] | [.updated_at, .status, (.conclusion // "")] | @tsv' \
              2>/dev/null || true)

            if [ -z "$RUN" ]; then
              add_issue "$LABEL status unavailable"
              return
            fi

            IFS=$'\t' read -r UPDATED STATUS CONCLUSION <<< "$RUN"
            UPDATED_TS=$(date -u -d "$UPDATED" +%s 2>/dev/null || true)
            if [ -z "$UPDATED_TS" ]; then
              add_issue "$LABEL has invalid timestamp"
              return
            fi

            AGE_HOURS=$(( (NOW - UPDATED_TS) / 3600 ))
            if [ "$MAX_AGE_HOURS" -gt 0 ] && [ "$AGE_HOURS" -gt "$MAX_AGE_HOURS" ]; then
              add_issue "$LABEL stale (${AGE_HOURS}h ago)"
            elif [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              add_issue "$LABEL $CONCLUSION (${AGE_HOURS}h ago)"
            fi
          }

          # Monitor the workflows that actually keep the registry current. The old
          # sync-binaries workflow is intentionally manual-only and is not a health
          # signal anymore.
          check_pipeline update-packages.yml "Package discovery" 3
          # Publishing is event-driven, so only its latest conclusion matters;
          # there is no meaningful staleness threshold when no versions changed.
          check_pipeline publish-changed-packages.yml "Package publishing" 0
          check_pipeline mirror.yml "Binary mirror" 10
          check_pipeline registry-integrity.yml "Metadata integrity" 36
          check_pipeline check-desktop-updates.yml "Desktop updates" 6

          if [ -n "$ISSUES" ]; then
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "items=$ISSUES" >> "$GITHUB_OUTPUT"
          else
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "items=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine overall health
        id: overall
        run: |
          ISSUES=""
          REGISTRY_STATUS="${{ steps.recovery.outputs.status || steps.registry.outputs.status }}"
          REGISTRY_CODE="${{ steps.recovery.outputs.http_code || steps.registry.outputs.http_code }}"
          if [ "$REGISTRY_STATUS" != "healthy" ]; then
            ISSUES="Registry unhealthy (HTTP $REGISTRY_CODE)"
          fi
          if [ "${{ steps.s3.outputs.status }}" != "accessible" ]; then
            [ -n "$ISSUES" ] && ISSUES="$ISSUES; "
            ISSUES="${ISSUES}Object storage ${{ steps.s3.outputs.status }}"
          fi
          if [ "${{ steps.failures.outputs.status }}" = "unknown" ]; then
            [ -n "$ISSUES" ] && ISSUES="$ISSUES; "
            ISSUES="${ISSUES}Workflow failure status unavailable"
          fi
          if [ "${{ steps.failures.outputs.status }}" = "elevated" ]; then
            [ -n "$ISSUES" ] && ISSUES="$ISSUES; "
            ISSUES="${ISSUES}${{ steps.failures.outputs.count }} workflow failures in last 2h"
          fi
          if [ "${{ steps.pipelines.outputs.status }}" != "healthy" ]; then
            [ -n "$ISSUES" ] && ISSUES="$ISSUES; "
            ISSUES="${ISSUES}${{ steps.pipelines.outputs.items }}"
          fi

          if [ -n "$ISSUES" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rate-limit failure alerts
        id: ratelimit
        if: steps.overall.outputs.healthy == 'false'
        run: |
          # The workflow intentionally completes successfully after reporting an
          # incident, so previous run conclusions cannot distinguish healthy runs
          # from alerts. Emit once every 24 scheduled checks (~2h) instead of
          # incorrectly treating every check as a new incident.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ $(( ${{ github.run_number }} % 24 )) -eq 0 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Sending scheduled incident reminder"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Suppressing duplicate incident reminder"
          fi

      - name: Send failure alert
        if: steps.overall.outputs.healthy == 'false' && steps.ratelimit.outputs.send == 'true'
        uses: ./.github/actions/discord-notify
        with:
          title: Pantry Health Alert
          description: Infrastructure issues detected
          status: failure
          fields: |
            [
              {"name": "Registry", "value": "${{ steps.recovery.outputs.status || steps.registry.outputs.status || 'unknown' }} (HTTP ${{ steps.recovery.outputs.http_code || steps.registry.outputs.http_code || '?' }})", "inline": true},
              {"name": "Object Storage", "value": "${{ steps.s3.outputs.provider || 'unknown' }} / ${{ steps.s3.outputs.bucket || 'unknown' }}: ${{ steps.s3.outputs.status || 'unknown' }}", "inline": true},
              {"name": "Failures (2h)", "value": "${{ steps.failures.outputs.count || '?' }}", "inline": true},
              {"name": "Update Pipelines", "value": "${{ steps.pipelines.outputs.items || 'healthy' }}", "inline": false}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Check if all-clear window
        if: steps.overall.outputs.healthy == 'true'
        id: allclear
        run: |
          HOUR=$(date -u +%-H)
          MIN=$(date -u +%-M)
          # Send all-clear at 00:00, 06:00, 12:00, 18:00 UTC (within first 30min window)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             ([ "$MIN" -lt 30 ] && ([ "$HOUR" = "0" ] || [ "$HOUR" = "6" ] || [ "$HOUR" = "12" ] || [ "$HOUR" = "18" ])); then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send all-clear (4x daily)
        if: steps.allclear.outputs.send == 'true'
        uses: ./.github/actions/discord-notify
        with:
          title: Pantry Health — All Clear
          description: All systems operating normally
          status: success
          fields: |
            [
              {"name": "Registry", "value": "${{ steps.recovery.outputs.status || steps.registry.outputs.status || 'unknown' }}", "inline": true},
              {"name": "Object Storage", "value": "${{ steps.s3.outputs.status || 'unknown' }}", "inline": true},
              {"name": "Failures (2h)", "value": "${{ steps.failures.outputs.count || '0' }}", "inline": true},
              {"name": "Update Pipelines", "value": "${{ steps.pipelines.outputs.status || 'unknown' }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
