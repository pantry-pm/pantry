name: Build Package Binaries

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package domain to build (e.g., php.net, postgresql.org, redis.io)'
        required: true
        type: string
      version:
        description: 'Version to build (leave empty for latest from pantry)'
        required: false
        type: string
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - darwin-arm64
          - linux-x86-64

env:
  # Share verified dependency archives across packages, stripes, and CI runs.
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
  # Build-status dashboard reporting is authenticated; without this token every
  # report-build POST 401s and the build is invisible on pantry.dev/packages.
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  REQUESTED_PACKAGE: ${{ inputs.package }}
  REQUESTED_VERSION: ${{ inputs.version }}
  REQUESTED_PLATFORMS: ${{ inputs.platforms }}
  # Object storage settings remain available to build-time dependency reads.
  # Publication itself uses PANTRY_REGISTRY_TOKEN and the registry-owned
  # scan-before-promote API; builders do not write installable bucket keys.
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  # Provider-agnostic S3-compatible credentials (Hetzner Object Storage,
  # Backblaze B2, etc.). Used for any non-AWS provider; unset ⇒ AWS path unaffected.
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

concurrency:
  # Keyed on the PACKAGE, not just the ref. With only the ref in the key,
  # starting a build for one package cancelled an in-flight build of a
  # completely unrelated one, because `cancel-in-progress` treats them as the
  # same work. Two packages have no reason to contend.
  group: build-registry-${{ github.ref }}-${{ github.event.inputs.package }}-${{ github.event.inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision managed producer tools through Pantry
        uses: ./packages/action
        with:
          version: '0.11.93'
          install: 'false'
          packages: >-
            bun.com@1.4.1 git-scm.org@2.53.0 darwinsys.com/file@5.47.0
            curl.se@8.23.0 gnu.org/tar@1.35.0 gnu.org/coreutils@9.10.0
            ${{ runner.os == 'Linux' && 'nixos.org/patchelf@0.18.0' || '' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        id: version
        run: bun packages/ts-pantry/scripts/resolve-build-version.ts

      - name: Set build matrix
        id: matrix
        run: |
          PLATFORMS="$REQUESTED_PLATFORMS"

          if [ "$PLATFORMS" = "all" ]; then
            MATRIX='{"include":[{"os":"macos-14","platform":"darwin-arm64"},{"os":"ubuntu-latest","platform":"linux-x86-64"}]}'
          elif [ "$PLATFORMS" = "darwin-arm64" ]; then
            MATRIX='{"include":[{"os":"macos-14","platform":"darwin-arm64"}]}'
          elif [ "$PLATFORMS" = "linux-x86-64" ]; then
            MATRIX='{"include":[{"os":"ubuntu-latest","platform":"linux-x86-64"}]}'
          else
            echo "::error::Unsupported target platform: $PLATFORMS"
            exit 1
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ github.event.inputs.package }} (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision managed producer tools through Pantry
        uses: ./packages/action
        with:
          version: '0.11.93'
          install: 'false'
          packages: >-
            bun.com@1.4.1 git-scm.org@2.53.0 darwinsys.com/file@5.47.0
            curl.se@8.23.0 gnu.org/tar@1.35.0 gnu.org/coreutils@9.10.0
            ${{ runner.os == 'Linux' && 'nixos.org/patchelf@0.18.0' || '' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile


      # build-package.ts installs the selected recipe's declared runtime and
      # build dependencies through Pantry. Missing recipe declarations fail the
      # build rather than borrowing an undeclared apt or Homebrew dependency.
      - name: Build package
        id: build
        run: |
          PACKAGE="$REQUESTED_PACKAGE"
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          BUILD_DIR="${{ runner.temp }}/build-${PACKAGE}-${VERSION}"
          INSTALL_PREFIX="${{ runner.temp }}/install-${PACKAGE}-${VERSION}"
          mkdir -p "$BUILD_DIR" "$INSTALL_PREFIX"

          echo "Building $PACKAGE $VERSION for $PLATFORM"

          # --deps-dir/--bucket/--region are REQUIRED, not optional:
          # build-package.ts only downloads dependencies (and therefore only
          # populates the `{{deps.<domain>.prefix}}` template variables) when
          # all three are present. Without them every such placeholder reached
          # the build verbatim, so mysql.com died on
          # "Wrong option or path for WITH_SSL={{deps.openssl.org.prefix}}"
          # and any other recipe pointing a configure flag at a dependency
          # failed the same way.
          DEPS_DIR="${{ runner.temp }}/deps-${PACKAGE}-${VERSION}"
          mkdir -p "$DEPS_DIR"

          cd packages/ts-pantry
          bun scripts/build-package.ts \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --build-dir "$BUILD_DIR" \
            --prefix "$INSTALL_PREFIX" \
            --deps-dir "$DEPS_DIR" \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION"

          echo "install_prefix=$INSTALL_PREFIX" >> $GITHUB_OUTPUT

      - name: Package artifacts
        id: package
        run: |
          PACKAGE="$REQUESTED_PACKAGE"
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          INSTALL_PREFIX="${{ steps.build.outputs.install_prefix }}"

          SAFE_NAME="${PACKAGE//\//-}"
          SAFE_NAME="${SAFE_NAME//./-}"
          ARTIFACT_NAME="${SAFE_NAME}-${VERSION}-${PLATFORM}"
          ARTIFACT_PATH="${{ runner.temp }}/${ARTIFACT_NAME}.tar.gz"

          cd "$INSTALL_PREFIX"
          tar -czvf "$ARTIFACT_PATH" .

          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            shasum -a 256 "$ARTIFACT_PATH" > "${ARTIFACT_PATH}.sha256"
          else
            sha256sum "$ARTIFACT_PATH" > "${ARTIFACT_PATH}.sha256"
          fi

          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.artifact_path }}.sha256
          retention-days: 7

  upload-to-s3:
    name: Publish scanned binaries
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Publication downloads every platform artifact, uploads it to object
    # storage, and scans it. The upload is the long pole, not the scan: a
    # 275MB artifact was still staging 45 minutes in, and curl retries up to
    # three times, so a slow transfer multiplies. A timed-out job reports as
    # "cancelled", which reads as somebody aborting the run rather than the
    # budget being too small - it took two rounds to see that.
    #
    # The build itself takes ~5 minutes. Sized for the transfer.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Provision managed producer tools through Pantry
        uses: ./packages/action
        with:
          version: '0.11.93'
          install: 'false'
          packages: >-
            bun.com@1.4.1 git-scm.org@2.53.0 darwinsys.com/file@5.47.0
            curl.se@8.23.0 gnu.org/tar@1.35.0 gnu.org/coreutils@9.10.0
            ${{ runner.os == 'Linux' && 'nixos.org/patchelf@0.18.0' || '' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish through registry scan gate
        run: |
          PACKAGE="$REQUESTED_PACKAGE"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "Staging, scanning, and publishing $PACKAGE $VERSION"

          cd packages/ts-pantry
          bun scripts/upload-to-s3.ts \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --artifacts-dir "${{ github.workspace }}/artifacts" \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION"

      - name: Summary
        run: |
          PACKAGE="$REQUESTED_PACKAGE"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** $PACKAGE" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published through registry malware scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for artifact_dir in artifacts/*/; do
            artifact_name=$(basename "$artifact_dir")
            echo "- \`$artifact_name\`" >> $GITHUB_STEP_SUMMARY
          done

  notify:
    name: discord-notification
    needs: [prepare, build, upload-to-s3]
    # A build that fails is otherwise silent. Every failure so far was found
    # by someone happening to watch the run, and a publish that exceeded its
    # timeout reported as "cancelled" - which reads as a human aborting it
    # rather than a budget being too small. Both now say so out loud.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: >-
            Package Build - ${{ github.event.inputs.package }}
            ${{ (needs.build.result == 'success' && needs.upload-to-s3.result == 'success') && 'Published'
              || (contains(fromJSON('["cancelled","skipped"]'), needs.upload-to-s3.result) || contains(fromJSON('["cancelled","skipped"]'), needs.build.result)) && 'Timed out or cancelled'
              || 'Failed' }}
          description: >-
            ${{ (needs.build.result == 'success' && needs.upload-to-s3.result == 'success')
              && 'Built and published through the registry scan gate'
              || 'Check the run: a cancelled job is usually the step timeout, not a human' }}
          status: >-
            ${{ (needs.build.result == 'success' && needs.upload-to-s3.result == 'success') && 'success'
              || (contains(fromJSON('["cancelled","skipped"]'), needs.upload-to-s3.result) || contains(fromJSON('["cancelled","skipped"]'), needs.build.result)) && 'warning'
              || 'failure' }}
          fields: |
            [
              {"name": "Package", "value": "${{ github.event.inputs.package || 'scheduled' }}", "inline": true},
              {"name": "Version", "value": "${{ needs.prepare.outputs.version || github.event.inputs.version || 'latest' }}", "inline": true},
              {"name": "Build", "value": "${{ needs.build.result }}", "inline": true},
              {"name": "Publish", "value": "${{ needs.upload-to-s3.result }}", "inline": true},
              {"name": "Run", "value": "[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
