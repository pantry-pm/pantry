name: Build Package Binaries

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package domain to build (e.g., php.net, postgresql.org, redis.io)'
        required: true
        type: string
      version:
        description: 'Version to build (leave empty for latest from pantry)'
        required: false
        type: string
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - darwin-arm64
          - linux-x86-64

env:
  # Build-status dashboard reporting is authenticated; without this token every
  # report-build POST 401s and the build is invisible on pantry.dev/packages.
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage provider. Set the repo variable STORAGE_PROVIDER=hetzner (or
  # backblaze) plus the S3_* vars and the S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
  # secrets below to publish binaries there. Defaults to AWS S3 (unchanged).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  # Provider-agnostic S3-compatible credentials (Hetzner Object Storage,
  # Backblaze B2, etc.). Used for any non-AWS provider; unset ⇒ AWS path unaffected.
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

concurrency:
  group: build-registry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Determine version
        id: version
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Try various filename conversion patterns for package domain
            # e.g., "php.net" might be phpnet.ts, php-net.ts, or php.net.ts
            PACKAGE_FILE=""
            for candidate in \
              "packages/ts-pantry/src/packages/${PACKAGE//./}.ts" \
              "packages/ts-pantry/src/packages/${PACKAGE//./-}.ts" \
              "packages/ts-pantry/src/packages/${PACKAGE}.ts"; do
              if [ -f "$candidate" ]; then
                PACKAGE_FILE="$candidate"
                break
              fi
            done

            if [ -z "$PACKAGE_FILE" ]; then
              echo "Could not find package file for $PACKAGE. Please specify version manually."
              exit 1
            fi

            VERSION=$(grep -A1 "versions:" "$PACKAGE_FILE" | grep -oE "'[0-9]+\.[0-9]+\.[0-9]+'" | head -1 | tr -d "'")

            if [ -z "$VERSION" ]; then
              echo "Could not determine version from $PACKAGE_FILE, please specify manually"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building $PACKAGE version $VERSION"

      - name: Set build matrix
        id: matrix
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"

          if [ "$PLATFORMS" = "all" ]; then
            MATRIX='{"include":[{"os":"macos-14","platform":"darwin-arm64"},{"os":"ubuntu-latest","platform":"linux-x86-64"}]}'
          elif [ "$PLATFORMS" = "darwin-arm64" ]; then
            MATRIX='{"include":[{"os":"macos-14","platform":"darwin-arm64"}]}'
          elif [ "$PLATFORMS" = "linux-x86-64" ]; then
            MATRIX='{"include":[{"os":"ubuntu-latest","platform":"linux-x86-64"}]}'
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ github.event.inputs.package }} (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install


      - name: Install build tools (macOS)
        if: contains(matrix.platform, 'darwin')
        run: |
          brew install autoconf automake libtool pkg-config bison re2c

          if [ "${{ github.event.inputs.package }}" = "php.net" ]; then
            brew install postgresql libpq openssl@1.1 libsodium libzip oniguruma sqlite icu4c \
              freetype libpng webp jpeg curl libxml2 libxslt readline gettext gmp libiconv krb5 \
              mysql-client
          fi

          if [ "${{ github.event.inputs.package }}" = "postgresql.org" ]; then
            brew install openssl readline zlib lz4 libxml2 libxslt icu4c flex perl
          fi

          if [ "${{ github.event.inputs.package }}" = "redis.io" ]; then
            brew install openssl
          fi

      - name: Install build tools (Linux)
        if: contains(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

          if [ "${{ github.event.inputs.package }}" = "php.net" ]; then
            sudo apt-get install -y \
              bison re2c \
              libssl-dev libsodium-dev libzip-dev libonig-dev \
              libsqlite3-dev libicu-dev libfreetype6-dev libpng-dev \
              libwebp-dev libjpeg-dev libcurl4-openssl-dev libxml2-dev \
              libxslt1-dev libedit-dev libffi-dev libpq-dev \
              libreadline-dev libgmp-dev libkrb5-dev libbz2-dev \
              default-libmysqlclient-dev liblz4-dev
          fi

          if [ "${{ github.event.inputs.package }}" = "postgresql.org" ]; then
            sudo apt-get install -y \
              libssl-dev libreadline-dev zlib1g-dev liblz4-dev \
              libxml2-dev libxslt1-dev libicu-dev flex bison perl
          fi

          if [ "${{ github.event.inputs.package }}" = "redis.io" ]; then
            sudo apt-get install -y libssl-dev
          fi

      - name: Build package
        id: build
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          BUILD_DIR="${{ runner.temp }}/build-${PACKAGE}-${VERSION}"
          INSTALL_PREFIX="${{ runner.temp }}/install-${PACKAGE}-${VERSION}"
          mkdir -p "$BUILD_DIR" "$INSTALL_PREFIX"

          echo "Building $PACKAGE $VERSION for $PLATFORM"

          cd packages/ts-pantry
          bun scripts/build-package.ts \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --build-dir "$BUILD_DIR" \
            --prefix "$INSTALL_PREFIX"

          echo "install_prefix=$INSTALL_PREFIX" >> $GITHUB_OUTPUT

      - name: Package artifacts
        id: package
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          INSTALL_PREFIX="${{ steps.build.outputs.install_prefix }}"

          SAFE_NAME="${PACKAGE//./-}"
          ARTIFACT_NAME="${SAFE_NAME}-${VERSION}-${PLATFORM}"
          ARTIFACT_PATH="${{ runner.temp }}/${ARTIFACT_NAME}.tar.gz"

          cd "$INSTALL_PREFIX"
          tar -czvf "$ARTIFACT_PATH" .

          if [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            shasum -a 256 "$ARTIFACT_PATH" > "${ARTIFACT_PATH}.sha256"
          else
            sha256sum "$ARTIFACT_PATH" > "${ARTIFACT_PATH}.sha256"
          fi

          echo "artifact_path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.artifact_path }}.sha256
          retention-days: 7

  upload-to-s3:
    name: Upload to S3
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install


      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "Uploading $PACKAGE $VERSION to S3"

          cd packages/ts-pantry
          bun scripts/upload-to-s3.ts \
            --package "$PACKAGE" \
            --version "$VERSION" \
            --artifacts-dir "${{ github.workspace }}/artifacts" \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION"

      - name: Summary
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** $PACKAGE" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded to S3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for artifact_dir in artifacts/*/; do
            artifact_name=$(basename "$artifact_dir")
            echo "- \`$artifact_name\`" >> $GITHUB_STEP_SUMMARY
          done
