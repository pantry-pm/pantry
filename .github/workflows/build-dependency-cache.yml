name: Verify Shared Build Dependency Cache

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./packages/action
        with:
          install: 'false'
          packages: bun.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun install --frozen-lockfile
      - name: Verify reuse across independent build directories
        run: bun .github/scripts/probe-build-dependency-cache.ts

  restore:
    needs: populate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./packages/action
        with:
          install: 'false'
          packages: bun.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun install --frozen-lockfile
      - name: Require cache hits on a fresh runner with origin archive downloads disabled
        env:
          REQUIRE_SHARED_CACHE_HIT: 'true'
        run: bun .github/scripts/probe-build-dependency-cache.ts
