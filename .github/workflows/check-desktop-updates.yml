name: Check Desktop App & Font Updates

# Detect updates, publish each package on its native build host, then record the
# registry state only after every publication succeeds and is externally visible.

on:
  schedule:
    # Daily. Runs cannot overlap, so a slow desktop upload never races a second
    # updater or its manifest commit.
    #
    # This was `*/2` hours, which is 12 runs a day, and every one of them
    # allocated a macos-latest runner unconditionally — ~360 Macs a month at 10x
    # billing to discover, almost always, that no .dmg app had shipped anything.
    # The macOS leg is now gated on the discovery pass actually finding work
    # (see publish-macos), so a scheduled run costs one cheap ubuntu job unless
    # a disk-image app genuinely released.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build + upload out-of-date packages (needs storage creds)'
        required: false
        type: boolean
        default: true
      force:
        description: 'Comma-separated domains to republish even if already current'
        required: false
        type: string
        default: ''

concurrency:
  group: check-desktop-updates
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

permissions:
  contents: write

jobs:
  # Always run a credential-free discovery pass. A manual run with publish=false
  # is therefore a genuine check and cannot create a misleading manifest commit.
  check:
    runs-on: ubuntu-latest
    outputs:
      # The exact set of .dmg/macOS-tool packages that are out of date. Empty on
      # almost every run, and publish-macos is gated on it being non-empty.
      macos_pending: ${{ steps.scan.outputs.macos_pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check desktop app and font versions
        id: scan
        working-directory: packages/ts-pantry
        env:
          # `--force` has to reach the discovery pass too, or forcing a .dmg
          # domain that is already current would compute an empty macOS slice
          # and skip the very runner the operator asked for.
          FORCE_DOMAINS: ${{ inputs.force }}
        run: |
          args=(--platform=macos --print-selected)
          if [[ -n "$FORCE_DOMAINS" ]]; then
            args+=("--force=$FORCE_DOMAINS")
          fi
          # The human-readable report goes to stderr and still shows in the log;
          # only the selected-domain list comes back on stdout.
          macos_pending="$(bun scripts/check-desktop-updates.ts "${args[@]}")"
          echo "macos pending: ${macos_pending:-<none>}"
          echo "macos_pending=$macos_pending" >> "$GITHUB_OUTPUT"

  # ZIP/archive recipes are portable and stay on the fast Linux runner.
  publish-ubuntu:
    needs: check
    if: github.event_name == 'schedule' || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Publish portable desktop updates
        working-directory: packages/ts-pantry
        env:
          FORCE_DOMAINS: ${{ inputs.force }}
        run: |
          args=(--platform=ubuntu --publish)
          if [[ -n "$FORCE_DOMAINS" ]]; then
            args+=("--force=$FORCE_DOMAINS")
          fi
          bun scripts/check-desktop-updates.ts "${args[@]}"

  # DMG/pkg recipes use Apple's native tools. Unsupported Linux extraction was
  # the reason Karabiner and LibreOffice repeatedly failed without surfacing it.
  #
  # Gated, and this is the point of the gate: a Mac bills ~10x, and the check
  # job above has already worked out exactly which disk-image packages are
  # behind. When that list is empty — which is most runs — no macOS runner is
  # allocated at all. This is the same shape as publish-changed-packages'
  # `publish-darwin-native` job: compute the needed set, run only if non-empty.
  publish-macos:
    needs: check
    if: >-
      (github.event_name == 'schedule' || inputs.publish == true) &&
      needs.check.outputs.macos_pending != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Publish native macOS desktop updates
        working-directory: packages/ts-pantry
        env:
          FORCE_DOMAINS: ${{ inputs.force }}
        run: |
          args=(--platform=macos --publish)
          if [[ -n "$FORCE_DOMAINS" ]]; then
            args+=("--force=$FORCE_DOMAINS")
          fi
          bun scripts/check-desktop-updates.ts "${args[@]}"

  # This is the only writer. It gets a fresh checkout and re-reads the public
  # registry after both publish jobs finish. --require-current makes the step
  # fail before commit if even one upstream version lacks a published artifact.
  #
  # A SKIPPED macOS leg has to count as success or the gate above would wedge
  # this job permanently: skipped means the check pass found no out-of-date
  # disk-image package, which is precisely the state in which there is nothing
  # for that runner to do. `--require-current` re-checks against the live
  # registry anyway, so a package that went stale in the meantime still blocks
  # the commit — the gate cannot let a stale manifest through.
  record:
    needs: [publish-ubuntu, publish-macos]
    if: >-
      always() &&
      needs.publish-ubuntu.result == 'success' &&
      (needs.publish-macos.result == 'success' || needs.publish-macos.result == 'skipped') &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record verified registry state
        working-directory: packages/ts-pantry
        run: bun scripts/check-desktop-updates.ts --require-current --commit
      - name: Push verified manifest commit
        working-directory: packages/ts-pantry
        run: |
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok (attempt $attempt)"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done
          echo "ERROR: could not push manifest after 5 attempts" >&2
          exit 1
