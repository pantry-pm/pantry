name: Check Desktop App & Font Updates

# Keeps the desktop-app and font recipes fresh: checks each one's latest
# upstream release against what's published in the registry, publishes the
# out-of-date ones, and commits the updated desktop-versions.json manifest.

on:
  schedule:
    # Daily at 5am UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build + upload out-of-date packages (needs storage creds)'
        required: false
        type: boolean
        default: true
      force:
        description: 'Comma-separated domains to (re)publish even if already current (e.g. roboto,pearcleaner.app)'
        required: false
        type: string
        default: ''

concurrency:
  group: check-desktop-updates
  cancel-in-progress: false

env:
  # Avoid the 60-req/h unauthenticated GitHub API rate limit when resolving
  # upstream versions across ~50 packages.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Object storage provider — set repo var STORAGE_PROVIDER=hetzner plus the S3_*
  # vars and S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY secrets to publish to Hetzner
  # Object Storage. Defaults to AWS S3 (unchanged) when unset.
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

permissions:
  contents: write

jobs:
  # Every desktop app + font now publishes on the fast, ~10x-cheaper ubuntu
  # runner — including the 40 DMG apps, which build via the darling-dmg /
  # apfs-fuse hdiutil shim installed below (the extracted .app keeps its code
  # signature). Only a recipe using a macOS-only tool with no Linux equivalent
  # (ditto/sips/pkgutil/installer — none currently do) would still need macOS;
  # MACOS_BUILD in check-desktop-updates.ts is the gate. Single committer of
  # desktop-versions.json.
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install DMG tooling (darling-dmg + apfs-fuse + hdiutil shim)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -y || true
          sudo -E apt-get install -y --no-install-recommends cmake g++ git dmg2img fuse libfuse-dev libfuse3-dev libicu-dev libattr1-dev libbz2-dev zlib1g-dev libssl-dev libxml2-dev liblzma-dev || true
          if ! command -v darling-dmg >/dev/null 2>&1; then
            git clone -q --depth 1 https://github.com/darlinghq/darling-dmg.git /tmp/ddmg \
              && cmake -S /tmp/ddmg -B /tmp/ddmg/build >/dev/null 2>&1 \
              && make -C /tmp/ddmg/build -j"$(nproc)" >/dev/null 2>&1 \
              && sudo make -C /tmp/ddmg/build install >/dev/null 2>&1 || echo "warn: darling-dmg build failed"
          fi
          if ! command -v apfs-fuse >/dev/null 2>&1; then
            git clone -q --recursive https://github.com/sgan81/apfs-fuse.git /tmp/afuse \
              && cmake -S /tmp/afuse -B /tmp/afuse/build >/dev/null 2>&1 \
              && make -C /tmp/afuse/build -j"$(nproc)" >/dev/null 2>&1 \
              && sudo cp /tmp/afuse/build/apfs-fuse /tmp/afuse/build/apfsutil /usr/local/bin/ || echo "warn: apfs-fuse build failed"
          fi
          sudo ldconfig || true
          # hdiutil shim (base64 of the verified script; HFS+ via darling-dmg,
          # APFS via dmg2img+apfs-fuse). Avoids YAML heredoc pitfalls.
          echo '' \
            | base64 -d | sudo tee /usr/local/bin/hdiutil >/dev/null
          sudo chmod +x /usr/local/bin/hdiutil
          echo "DMG tooling: darling-dmg=$(command -v darling-dmg || echo MISSING) apfs-fuse=$(command -v apfs-fuse || echo MISSING) dmg2img=$(command -v dmg2img || echo MISSING)"

      # Author automated commits as the standard github-actions bot.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish desktop updates & commit manifest
        working-directory: packages/ts-pantry
        run: |
          PUBLISH_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUBLISH_FLAG="--publish"
          fi
          FORCE_FLAG=""
          if [ -n "${{ inputs.force }}" ]; then
            FORCE_FLAG="--force=${{ inputs.force }}"
          fi
          bun scripts/check-desktop-updates.ts --platform=ubuntu $PUBLISH_FLAG $FORCE_FLAG --commit

      - name: Push manifest commit
        working-directory: packages/ts-pantry
        # Retry with rebase: other workflows (e.g. CLI build-versions) commit to
        # main frequently, so a plain `git push` can be rejected as non-fast-
        # forward. The old `|| echo "nothing to push"` swallowed that rejection,
        # silently dropping the manifest commit. Rebase onto the latest main and
        # retry so the commit reliably lands; a genuine no-op push exits 0 on the
        # first try ("Everything up-to-date").
        # A no-op push (nothing committed this run) exits 0 immediately with
        # "Everything up-to-date", so the loop ends on attempt 1. Only a real
        # new commit that loses the fast-forward race triggers a rebase + retry.
        run: |
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push ok (attempt $attempt)"; exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto latest main…"
            git fetch origin main && git rebase origin/main || { echo "rebase failed"; exit 1; }
          done
          echo "ERROR: could not push manifest after 5 attempts" >&2
          exit 1
