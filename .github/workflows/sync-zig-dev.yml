name: Sync Zig Dev

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact Zig development version to restore (empty archives the current build)
        type: string

concurrency:
  group: sync-zig-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    name: Archive signed Zig development builds
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action
        with:
          install: 'false'

      - name: Install archive and signature tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools minisign

      - name: Publish missing compiler archives
        env:
          ZIG_VERSION: ${{ inputs.version }}
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: bun packages/ts-pantry/scripts/sync-zig-dev.ts "$ZIG_VERSION"
