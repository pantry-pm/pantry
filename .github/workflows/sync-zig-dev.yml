name: Sync Zig Dev

# Hourly dispatch of build-versions.yml targeted at ziglang.org so the latest
# 0.17-dev master build from ziglang.org/download/index.json is mirrored into
# Pantry before framework and application workflows request the rolling channel.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-zig-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Dispatch build-versions for ziglang.org
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trigger build-versions.yml
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-versions.yml \
            -R ${{ github.repository }} \
            -f packages=ziglang.org \
            -f max-versions=5 \
            -f force=false
