name: Build

on:
  # No `schedule:` — macOS runners bill 10x and must not run unsupervised.
  # Desktop apps/fonts stay fresh via check-desktop-updates.yml every 2 hours,
  # routed to Linux for portable archives and native macOS for DMGs. The old
  # apps-only sweep here is redundant. Run this workflow manually
  # (workflow_dispatch) when you want a supervised full-platform build.
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package domains to build (e.g., "redis.io curl.se"), or leave empty for apps-only'
        required: false
        type: string
      platform:
        description: 'Platform to build on'
        required: false
        type: choice
        options:
          - all
          - unix
          - darwin-arm64
          - linux-x86-64
          - linux-arm64
          - windows-x64
        default: all
      force:
        description: 'Force re-upload even if already in S3'
        required: false
        type: boolean
        default: true
      apps-only:
        description: 'Only build apps / GUI applications (ignores packages input)'
        required: false
        type: boolean
        default: false
      stripe:
        description: 'Build only an even slice of the needs-build set, as "i/n" (e.g. "0/8"). Lets you fan out N parallel runners per platform without computing package lists. Empty = whole set.'
        required: false
        type: string
      parallel:
        description: 'Workers to run concurrently WITHIN this runner (build-all-packages has no in-process parallelism). Each splits the runner stripe into a sub-stripe, so effective concurrency = runners x parallel. Empty/1 = one worker. Use ~3 on Linux, ~2 on macOS (RAM).'
        required: false
        type: string
      multi_version:
        description: 'Build multiple important versions instead of only latest'
        required: false
        type: boolean
        default: false

env:
  # Share verified dependency archives across packages, stripes, and CI runs.
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
  # Build-status dashboard reporting is authenticated; without this token every
  # report-build POST 401s and the build is invisible on pantry.dev/packages.
  PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage provider. Set the repo variable STORAGE_PROVIDER=hetzner (or
  # backblaze) plus the S3_* vars and the S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
  # secrets below to publish binaries there. Defaults to AWS S3 (unchanged).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  # Provider-agnostic S3-compatible credentials (Hetzner Object Storage,
  # Backblaze B2, etc.). Used for any non-AWS provider; unset ⇒ AWS path unaffected.
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  # Decide which runner builds what. darwin-arm64 SOURCE builds (custom
  # recipes in CUSTOM_BUILD_DOMAINS and anything pkgx has no prebuilt for) go
  # to the self-hosted Mac labelled pantry-mac-self-hosted; darwin packages
  # pkgx already covers keep mirroring on a hosted macos-15 runner. Only a
  # targeted dispatch (`packages` set) is split: an apps-only or whole-catalog
  # darwin sweep stays on hosted macos-15, because a laptop with a shared disk
  # is not where a catalog sweep belongs.
  route:
    name: Route builds to runners
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action
        with:
          install: 'false'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Build the runner matrix
        id: matrix
        shell: bash
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
          APPS_ONLY: ${{ github.event.inputs.apps-only || 'false' }}
          PACKAGES: ${{ github.event.inputs.packages }}
          MULTI_VERSION: ${{ github.event.inputs.multi_version }}
        run: |
          set -euo pipefail
          PACKAGES=$(echo "$PACKAGES" | tr -cd 'a-zA-Z0-9._@\-/, ' | tr ', ' '\n\n' | sed '/^$/d' | paste -sd' ' -)
          if [ "$APPS_ONLY" = "true" ]; then
            PLATFORMS="darwin-arm64 windows-x64"
          else
            case "$PLATFORM" in
              all)  PLATFORMS="darwin-arm64 linux-x86-64 linux-arm64 windows-x64" ;;
              unix) PLATFORMS="darwin-arm64 linux-x86-64 linux-arm64" ;;
              *)    PLATFORMS="$PLATFORM" ;;
            esac
          fi

          entries=()
          entry() { # os name label packages self_hosted
            entries+=("$(jq -cn --arg os "$1" --arg name "$2" --arg label "$3" --arg packages "$4" --argjson self_hosted "$5" \
              '{os: $os, name: $name, label: $label, packages: $packages, self_hosted: $self_hosted}')")
          }
          for platform in $PLATFORMS; do
            case "$platform" in
              linux-x86-64) entry ubuntu-24.04 "$platform" "$platform" "$PACKAGES" false ;;
              linux-arm64)  entry ubuntu-24.04-arm "$platform" "$platform" "$PACKAGES" false ;;
              windows-x64)  entry windows-latest "$platform" "$platform" "$PACKAGES" false ;;
              darwin-arm64)
                if [ "$APPS_ONLY" = "true" ] || [ -z "$PACKAGES" ]; then
                  entry macos-15 "$platform" "$platform" "$PACKAGES" false
                  continue
                fi
                VERSION_ARGS=()
                if [ "$MULTI_VERSION" = "true" ]; then VERSION_ARGS=(--multi-version --max-versions 5); fi
                cd packages/ts-pantry
                SELECTED=$(bun scripts/build-all-packages.ts --platform darwin-arm64 -p "${PACKAGES// /,}" --print-selected ${VERSION_ARGS[@]+"${VERSION_ARGS[@]}"})
                SOURCE=""
                if [ -n "$SELECTED" ]; then
                  SOURCE=$(bun scripts/build-all-packages.ts --platform darwin-arm64 -p "${SELECTED// /,}" --print-selected --exclude-pkgx-covered ${VERSION_ARGS[@]+"${VERSION_ARGS[@]}"})
                fi
                cd - >/dev/null
                MIRROR=$(comm -23 <(tr ' ' '\n' <<<"$SELECTED" | sed '/^$/d' | sort -u) <(tr ' ' '\n' <<<"$SOURCE" | sed '/^$/d' | sort -u) | paste -sd' ' -)
                echo "darwin-arm64 source builds (pantry-mac-self-hosted): ${SOURCE:-<none>}"
                echo "darwin-arm64 pkgx mirrors (macos-15): ${MIRROR:-<none>}"
                if [ -n "$SOURCE" ]; then entry pantry-mac-self-hosted "$platform" "$platform source" "$SOURCE" true; fi
                if [ -n "$MIRROR" ]; then entry macos-15 "$platform" "$platform mirror" "$MIRROR" false; fi
                ;;
            esac
          done
          MATRIX=$(printf '%s\n' ${entries[@]+"${entries[@]}"} | jq -cs .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq .

  build:
    name: Build (${{ matrix.platform.label }})
    needs: route
    if: needs.route.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        # "all" = darwin + linux + windows
        # "unix" = darwin + linux (for system packages that don't support Windows)
        # apps-only = darwin + windows (GUI apps)
        platform: ${{ fromJson(needs.route.outputs.matrix) }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    # macOS runners bill 10x — cap them tighter so a hung mac job can't burn money.
    # Latest-only builds never need anywhere near this; the cap is a runaway backstop.
    # The self-hosted Mac costs nothing per minute, and is where long source
    # builds (qemu, llvm-sized trees) land.
    timeout-minutes: ${{ matrix.platform.self_hosted && 300 || (contains(matrix.platform.os, 'macos') && 70 || 120) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The self-hosted Mac is a shared laptop, not a disposable VM. Its
      # job hooks gate the event, guard free space and clean up after the job;
      # here, keep temp files in the runner-owned RUNNER_TEMP, and target the
      # same macOS floor as the hosted macos-15 image rather than this Mac's
      # newer OS (buildkit defaults MACOSX_DEPLOYMENT_TARGET to the host's
      # version). Not lower than that image either: the darwin catalog was
      # built there, and a bundled dependency newer than the declared target
      # fails runtime qualification (qemu: libp11-kit requires 15.7).
      - name: Contain the self-hosted Mac build
        if: matrix.platform.self_hosted
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.8" >> "$GITHUB_ENV"
          echo "BUILDKIT_ROOT: $BUILDKIT_ROOT"
          df -h "$BUILDKIT_ROOT"

      - name: Setup Pantry and Bun (Windows)
        if: runner.os == 'Windows'
        uses: ./packages/action
        with:
          install: 'false'
          packages: bun.com@1.4.4

      - name: Setup Pantry
        if: runner.os != 'Windows'
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Preflight source build
        id: source-preflight
        if: runner.os != 'Windows' && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -o pipefail
          cd packages/ts-pantry

          FORCE="${{ github.event.inputs.force || 'true' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force enabled; build tools are required"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARGS="-b $S3_BUCKET -r $AWS_REGION --platform ${{ matrix.platform.name }}"
          # Latest-only by default to drain the UNBUILT backlog (breadth-first,
          # pre-teardown). Set the 'multi_version' dispatch input to 'true' to
          # build multiple versions per package again.
          if [ "${{ github.event.inputs.multi_version }}" = "true" ]; then
            ARGS="$ARGS --multi-version --max-versions 5"
          fi
          PACKAGES="${{ matrix.platform.packages }}"
          PACKAGES=$(echo "$PACKAGES" | tr -cd 'a-zA-Z0-9._@\-/, ')
          if [ -n "$PACKAGES" ]; then
            PACKAGES="${PACKAGES// /,}"
            ARGS="$ARGS -p $PACKAGES"
          fi
          STRIPE_INPUT="${{ github.event.inputs.stripe || '' }}"
          STRIPE=""
          if [ -n "$STRIPE_INPUT" ]; then
            if [[ "$STRIPE_INPUT" =~ ^[0-9]+/[0-9]+$ ]]; then
              STRIPE="$STRIPE_INPUT"
              stripe_i="${STRIPE%%/*}"
              stripe_n="${STRIPE##*/}"
              if [ "$stripe_n" -le 0 ] || [ "$stripe_i" -ge "$stripe_n" ]; then
                echo "::error::Invalid stripe '$STRIPE_INPUT' (expected i/n with 0<=i<n, e.g. 0/6)"
                exit 1
              fi
            else
              echo "::error::Invalid stripe '$STRIPE_INPUT' (use a numeric i/n like 0/6; dispatch separate runs for 0/6, 1/6, ...)"
              exit 1
            fi
          fi
          if [ -n "$STRIPE" ]; then
            ARGS="$ARGS --stripe $STRIPE"
          fi

          NEEDS_BUILD=$(bun scripts/build-all-packages.ts $ARGS --needs-build | tail -1)
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_BUILD" = "false" ]; then
            echo "All selected source artifacts already exist in S3; skipping toolchain setup"
          fi

      # Native source tools are Pantry-managed; download-only app builds keep the lighter path.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          # Reclaim ~25-30GB of unused preinstalled SDKs and move heavy build
          # trees to the large /mnt volume so source builds don't exhaust the
          # ~20GB root volume ("No space left on device").
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/local/lib/node_modules /usr/share/miniconda \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell || true
          sudo mkdir -p /mnt/buildkit && sudo chown "$(id -u):$(id -g)" /mnt/buildkit
          echo "BUILDKIT_ROOT=/mnt/buildkit" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS' && !matrix.platform.self_hosted && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected Xcode: $XCODE_PATH"
          else
            echo "No Xcode 26.x found, using default"
          fi
          swift --version
          xcodebuild -version

      - name: Select managed native build tools
        if: runner.os != 'Windows' && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true' && steps.source-preflight.outputs.needs_build != 'false'
        id: build-tools
        shell: bash
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"

      - name: Install native build tools through Pantry
        if: runner.os != 'Windows' && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true' && steps.source-preflight.outputs.needs_build != 'false'
        uses: ./packages/action
        with:
          install: 'false'
          packages: ${{ steps.build-tools.outputs.packages }}

      - name: Verify managed native tool identities
        if: runner.os != 'Windows' && github.event_name != 'schedule' && github.event.inputs.apps-only != 'true' && steps.source-preflight.outputs.needs_build != 'false'
        shell: bash
        run: |
          bun packages/ts-pantry/scripts/native-publisher-toolchain.ts
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "LD=ld" >> "$GITHUB_ENV"

      - name: Build packages
        if: runner.os == 'Windows' || github.event_name == 'schedule' || github.event.inputs.apps-only == 'true' || steps.source-preflight.outputs.needs_build != 'false'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/ts-pantry

          FORCE="${{ github.event.inputs.force || 'true' }}"
          # Initialize here: the apps-only/schedule branch below never sets it,
          # and this script runs under set -u ("STRIPE: unbound variable" killed
          # every scheduled apps run otherwise).
          STRIPE=""
          ARGS="-b $S3_BUCKET -r $AWS_REGION --platform ${{ matrix.platform.name }}"
          # Download-first: mirror pkgx's official prebuilt (seconds) instead of
          # compiling; falls back to source build when pkgx lacks it or it's a
          # custom source build. Makes even macOS runs cheap.
          ARGS="$ARGS --pkgx-mirror"
          # Latest-only by default to drain the UNBUILT backlog (breadth-first,
          # pre-teardown). Set the 'multi_version' dispatch input to 'true' to
          # build multiple versions per package again.
          if [ "${{ github.event.inputs.multi_version }}" = "true" ]; then
            ARGS="$ARGS --multi-version --max-versions 5"
          fi

          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          # Desktop-only mode: scheduled runs or explicit flag
          IS_DESKTOP="${{ github.event.inputs.apps-only || '' }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$IS_DESKTOP" = "true" ]; then
            ARGS="$ARGS --apps-only"
            echo "Building apps only"
          else
            # Pass specific packages if provided
            PACKAGES="${{ matrix.platform.packages }}"
            # Validate package input (only allow safe characters)
            PACKAGES=$(echo "$PACKAGES" | tr -cd 'a-zA-Z0-9._@\-/, ')
            if [ -n "$PACKAGES" ]; then
              PACKAGES="${PACKAGES// /,}"
              ARGS="$ARGS -p $PACKAGES"
            fi
            # Even slice of the needs-build set for parallel fan-out (e.g. "0/8").
            # Validate instead of stripping characters: a literal "i/8" would
            # otherwise become "/8" and fail after more runner setup.
            STRIPE_INPUT="${{ github.event.inputs.stripe || '' }}"
            STRIPE=""
            if [ -n "$STRIPE_INPUT" ]; then
              if [[ "$STRIPE_INPUT" =~ ^[0-9]+/[0-9]+$ ]]; then
                STRIPE="$STRIPE_INPUT"
                stripe_i="${STRIPE%%/*}"
                stripe_n="${STRIPE##*/}"
                if [ "$stripe_n" -le 0 ] || [ "$stripe_i" -ge "$stripe_n" ]; then
                  echo "::error::Invalid stripe '$STRIPE_INPUT' (expected i/n with 0<=i<n, e.g. 0/8)"
                  exit 1
                fi
              else
                echo "::error::Invalid stripe '$STRIPE_INPUT' (use a numeric i/n like 0/8; dispatch separate runs for 0/8, 1/8, ...)"
                exit 1
              fi
            fi
          fi

          # Internal parallelism: build-all-packages has no in-process concurrency
          # (the Hetzner fleet runs K separate processes per box to use all cores).
          # Mirror that on a runner — run PAR workers, each on a sub-stripe of this
          # runner's stripe, with its own BUILDKIT_ROOT so they don't clash. So the
          # runner uses all its cores and effective concurrency = runners x PAR.
          PAR=$(echo "${{ github.event.inputs.parallel }}" | tr -cd '0-9'); PAR=${PAR:-1}
          [ "${PAR:-1}" -lt 1 ] && PAR=1
          # One build tree at a time on the shared-disk self-hosted Mac.
          [ "${{ matrix.platform.self_hosted }}" = "true" ] && PAR=1
          if [ -z "${STRIPE:-}" ] && [ "$PAR" -gt 1 ]; then
            STRIPE="0/1"
          fi
          if [ -n "$STRIPE" ] && [ "$PAR" -gt 1 ]; then
            i=${STRIPE%%/*}; n=${STRIPE##*/}; tot=$(( n * PAR ))
            echo "Internal parallelism: $PAR workers, sub-stripes of $STRIPE over $tot total"
            pids=""
            for w in $(seq 0 $((PAR - 1))); do
              sub=$(( i * PAR + w ))
              echo "  worker $w -> --stripe $sub/$tot"
              BUILDKIT_ROOT="/tmp/pb-$w" bun scripts/build-all-packages.ts $ARGS --stripe "$sub/$tot" > "/tmp/worker-$w.log" 2>&1 &
              pids="$pids $!"
            done
            tail -f /tmp/worker-*.log & TAILPID=$!
            rc=0; for p in $pids; do wait "$p" || rc=1; done
            kill "$TAILPID" 2>/dev/null || true
            exit $rc
          fi

          [ -n "$STRIPE" ] && ARGS="$ARGS --stripe $STRIPE"
          echo "Running: bun scripts/build-all-packages.ts $ARGS"
          bun scripts/build-all-packages.ts $ARGS
        timeout-minutes: ${{ matrix.platform.self_hosted && 290 || (contains(matrix.platform.os, 'macos') && 60 || 110) }}

  notify:
    name: discord-notification
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "Build — ${{ needs.build.result == 'success' && 'Success' || needs.build.result == 'cancelled' && 'Cancelled' || 'Failed' }}"
          description: "${{ github.event_name == 'schedule' && 'Daily app sync' || format('Packages: {0}', github.event.inputs.packages || 'apps-only') }}"
          status: ${{ needs.build.result == 'success' && 'success' || needs.build.result == 'cancelled' && 'warning' || 'failure' }}
          fields: |
            [
              {"name": "Platform", "value": "${{ github.event.inputs.platform || 'darwin-arm64' }}", "inline": true},
              {"name": "Mode", "value": "${{ (github.event_name == 'schedule' || github.event.inputs.apps-only == 'true') && 'Apps' || 'System Packages' }}", "inline": true},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
