name: Published native runtime smoke

on:
  workflow_dispatch:
    inputs:
      pantry-version:
        description: 'Exact published Pantry CLI version to verify'
        type: string
        default: 0.11.179
      url:
        description: 'Public HTTPS page to load with the published Chrome and Bun WebView.'
        type: string
        default: https://pantry.dev/
  push:
    branches: [main]
    paths:
      - .github/workflows/native-runtime-smoke.yml
      - .github/scripts/native-runtime-smoke.ts
      - .github/scripts/native-browser-smoke.ts
      - .github/native-runtime-smoke/pantry.json

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install the published Pantry CLI and bootstrap Bun
        uses: pantry-pm/pantry/packages/action@6243f5d8af665b1568fdfdf4a225da3f35b4da29 # v0.11.179
        with:
          version: ${{ inputs.pantry-version || '0.11.179' }}
          install: 'false'
          packages: bun.com@1.4.4
      - name: Verify a fresh production-user installation
        env:
          PANTRY_RUNTIME_SMOKE_URL: ${{ inputs.url || 'https://pantry.dev/' }}
          PANTRY_RUNTIME_SMOKE_PANTRY_VERSION: ${{ inputs.pantry-version || '0.11.179' }}
        # The production API runs as root; retain its normal Chrome backend policy.
        run: sudo -n env PATH="$PATH" PANTRY_RUNTIME_SMOKE_URL="$PANTRY_RUNTIME_SMOKE_URL" PANTRY_RUNTIME_SMOKE_PANTRY_VERSION="$PANTRY_RUNTIME_SMOKE_PANTRY_VERSION" bun .github/scripts/native-runtime-smoke.ts
      - name: Retain exact runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-native-runtime-smoke
          path: artifacts/native-runtime-smoke
          if-no-files-found: error
