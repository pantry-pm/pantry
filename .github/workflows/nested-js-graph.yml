name: Verify Nested JavaScript Graph

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [single, workspace]
    steps:
      - uses: actions/checkout@v6
      - name: Install the qualified published Pantry CLI and managed fixture tools
        id: pantry
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf
        with:
          version: 0.11.101
          install: 'false'
          packages: bun.com@1.4.4 gnu.org/tar@1.35
      - name: Compare actual parent dependency bindings with the normal Bun graph
        run: bun .github/scripts/verify-nested-js-graph.ts '${{ steps.pantry.outputs.pantry-path }}' '${{ matrix.project }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-js-graph-original-proof-${{ matrix.project }}
          path: artifacts/nested-js-graph
          if-no-files-found: error
