name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  source-ci:
    uses: ./.github/workflows/source-ci-gate.yml

  pantry:
    name: pantry
    needs: source-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # No `packages:` input on purpose. Naming explicit packages switches the
      # action to install-only-those and skips the workspace install
      # (shouldInstallWorkspace, deliberately), so the project's OWN zig
      # dependencies - zig-cli, zig-config, zig-test-framework - never landed in
      # pantry/. build.zig resolves them from that directory, so every platform
      # died with
      #
      #   error: failed to check cache: .../pantry/zig-cli/src/root.zig
      #          file_hash FileNotFound
      #
      # which reads like a cache fault and is a missing dependency. Every
      # release build since has failed this way.
      #
      # deps.yaml pins the supported stable compiler. A rolling development
      # series stops resolving when upstream master advances to the next
      # version; release builds must use the same stable pin as the test job.
      - name: Setup Pantry and Zig from the registry
        uses: ./packages/action

      - name: Build for All Platforms
        run: |
          set -e
          cd packages/zig
          echo "→ Compiling pantry for all platforms (ReleaseFast, ~5-15 min)…"
          zig build compile-all --summary all

      - name: Package Binaries
        run: |
          mkdir -p dist
          echo "Built binaries:"
          ls -la packages/zig/zig-out/bin/

          # Verify critical targets exist before packaging
          MISSING=0
          for required in linux-x86_64 macos-aarch64; do
            if [ ! -d "packages/zig/zig-out/bin/$required" ]; then
              echo "::error::Required target $required not found"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            exit 1
          fi

          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 freebsd-x86_64 freebsd-aarch64; do
            dir="packages/zig/zig-out/bin/$target"
            if [ ! -d "$dir" ]; then
              echo "::warning::Optional target $target not found"
              continue
            fi

            case "$target" in
              linux-x86_64)   name="pantry-linux-x64.zip" ; bin="pantry" ;;
              linux-aarch64)  name="pantry-linux-arm64.zip" ; bin="pantry" ;;
              macos-x86_64)   name="pantry-darwin-x64.zip" ; bin="pantry" ;;
              macos-aarch64)  name="pantry-darwin-arm64.zip" ; bin="pantry" ;;
              windows-x86_64)  name="pantry-windows-x64.zip" ; bin="pantry.exe" ;;
              freebsd-x86_64)  name="pantry-freebsd-x64.zip" ; bin="pantry" ;;
              freebsd-aarch64) name="pantry-freebsd-arm64.zip" ; bin="pantry" ;;
            esac

            echo "Packaging $target -> $name"
            (cd "$dir" && zip -r "../../../../../dist/$name" "$bin")
          done

          echo "Packaged files:"
          ls -la dist/

      - name: Create GitHub Release
        uses: ./packages/action
        with:
          install: 'false'
          release: 'true'
          release-files: |
            dist/pantry-linux-x64.zip
            dist/pantry-linux-arm64.zip
            dist/pantry-darwin-x64.zip
            dist/pantry-darwin-arm64.zip
            dist/pantry-windows-x64.zip
            dist/pantry-freebsd-x64.zip
            dist/pantry-freebsd-arm64.zip
          release-changelog: CHANGELOG.md
          release-token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: npm
    needs: pantry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        run: bun install

      - name: Publish once and verify the original public npm archive
        id: npm-readback
        run: |
          mkdir -p artifacts/npm-publication
          set +e
          pantry publish --npm --access public 2>&1 | tee artifacts/npm-publication/publish.log
          publication_statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${publication_statuses[1]}" -ne 0 ]; then
            exit "${publication_statuses[1]}"
          fi
          PANTRY_NPM_PUBLISH_EXIT_CODE="${publication_statuses[0]}" bun .github/scripts/npm-publication-readback.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Retain public npm publication evidence
        if: always() && steps.npm-readback.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-proof
          path: |
            artifacts/npm-publication/proof.json
            artifacts/npm-publication/publish.log
          if-no-files-found: error

  notify:
    name: discord-notification
    needs: [pantry, npm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "Release ${{ github.ref_name }} — ${{ needs.pantry.result == 'success' && needs.npm.result == 'success' && 'Published' || (needs.pantry.result == 'cancelled' || needs.npm.result == 'cancelled') && 'Cancelled' || 'Failed' }}"
          description: "pantry ${{ github.ref_name }} has been released"
          status: ${{ needs.pantry.result == 'success' && needs.npm.result == 'success' && 'success' || (needs.pantry.result == 'cancelled' || needs.npm.result == 'cancelled') && 'warning' || 'failure' }}
          fields: |
            [
              {"name": "Tag", "value": "`${{ github.ref_name }}`", "inline": true},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true},
              {"name": "CLI Binary", "value": "${{ needs.pantry.result == 'success' && '✅ Published' || '❌ Failed' }}", "inline": true},
              {"name": "npm Packages", "value": "${{ needs.npm.result == 'success' && '✅ Published' || '❌ Failed' }}", "inline": true},
              {"name": "Release", "value": "[View on GitHub](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
