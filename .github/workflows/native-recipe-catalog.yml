name: Generate Native Recipe Catalogs
on:
  workflow_dispatch:
    inputs:
      verify-public-chrome:
        description: Verify the revised public Chrome archive with an original published release tag's Action, CLI and SDK
        type: boolean
        default: false
      public-pantry-version:
        description: Exact published version for public compatibility mode
        type: string
        default: 0.11.104
      public-pantry-source:
        description: Exact original release commit for public compatibility mode
        type: string
        default: ''
      generate-native-catalogs:
        description: Generate catalog patches; leave disabled to qualify the exact committed source
        type: boolean
        default: false
      verify-dynamodb:
        description: Build the immutable DynamoDB Local recipe and require its live database health check
        type: boolean
        default: false
      verify-chrome:
        description: Build the revised Chrome package normally and require its sandboxed rendering/NSS origin health check before publication
        type: boolean
        default: false
      verify-native-unit-tests:
        description: Run the complete native suite against this same source and compiler
        type: boolean
        default: false
      generate-workspace-lock:
        description: Generate and freeze the normal source-owned workspace lock for source adoption
        type: boolean
        default: false
env:
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
permissions:
  contents: read
jobs:
  catalog:
    if: ${{ !inputs.verify-public-chrome }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.verify-chrome && 45 || 15 }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up published Pantry and managed workspace tools
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: bun.com@1.4.3
      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Retain the Action generated from the exact committed source
        run: |
          git diff --exit-code -- packages/action/src packages/ts-pantry/src/packages
          bun run --cwd packages/action build
          mkdir -p artifacts/native-catalog/source-action
          cp packages/action/dist/index.js packages/action/dist/post.js artifacts/native-catalog/source-action/
          git rev-parse HEAD > artifacts/native-catalog/source-action/source-commit.txt
          sha256sum packages/action/dist/index.js packages/action/dist/post.js > artifacts/native-catalog/source-action/sha256.txt
      - name: Record the exact source and runtime before recipe validation
        run: |
          mkdir -p artifacts/native-catalog
          git rev-parse HEAD > artifacts/native-catalog/source-commit.txt
          bun --version > artifacts/native-catalog/bun-version.txt
      - name: Verify registration invariants
        run: |
          set -o pipefail
          bun test packages/ts-pantry/test/installer-relative-symlinks.test.ts packages/ts-pantry/test/package-revisions.test.ts packages/ts-pantry/test/chrome-nss-runtime.test.ts packages/ts-pantry/test/native-ci-metadata.test.ts packages/ts-pantry/test/native-ci-tools-recipe.test.ts packages/ts-pantry/test/dynamodb-local-recipe.test.ts packages/ts-pantry/test/generated-package-docs.test.ts packages/ts-pantry/test/fetch.test.ts packages/action/src/services.test.ts packages/action/src/native-dynamodb.test.ts packages/action/src/native-cache.test.ts packages/ts-pantry/test/resolve-build-version.test.ts 2>&1 | tee artifacts/native-catalog/recipe-tests.log
      - name: Verify locked tool selection against the installer contract
        run: bun test packages/action/src/lock-version.test.ts
      - name: Verify real HTTP registry lookup failures and credential scope
        run: bun test packages/ts-pantry/test/installer-registry-availability.test.ts
      - name: Lint installer availability source and real HTTP fixtures
        run: bunx --bun pickier run --mode lint packages/ts-pantry/src/installer.ts packages/ts-pantry/test/installer-registry-availability.test.ts .github/scripts/verify-registry-lookup.ts .github/scripts/verify-npm-publication.ts .github/scripts/verify-js-lifecycle.ts
      - name: Typecheck the normal Pantry source
        run: bun run typecheck
      - name: Lint package documentation generation
        run: bunx --bun pickier run --mode lint packages/ts-pantry/src/fetch.ts packages/ts-pantry/test/generated-package-docs.test.ts packages/ts-pantry/scripts/resolve-build-version.ts packages/ts-pantry/test/resolve-build-version.test.ts packages/action/src/index.ts packages/action/src/services.ts packages/action/src/services.test.ts packages/action/src/native-dynamodb.ts packages/action/src/native-dynamodb.test.ts packages/action/src/native-cache.test.ts
      - name: Lint the native DynamoDB provider and build assets
        if: inputs.verify-dynamodb
        run: bunx --bun pickier run --mode lint packages/ts-pantry/scripts/maven-versions.ts packages/ts-pantry/scripts/copy-recipe-props.ts packages/ts-pantry/src/recipes/aws.amazon.com/dynamodb-local.ts packages/ts-pantry/src/recipes/props/aws.amazon.com/dynamodb-local/health.ts packages/ts-pantry/test/dynamodb-local-recipe.test.ts
      - name: Generate native package metadata and both installer catalogs
        if: inputs.generate-native-catalogs
        run: |
          set -e
          bun .github/scripts/register-native-ci-packages.ts
          bun packages/ts-pantry/scripts/version-fetcher.ts --domain google.com/chrome
          bun packages/ts-pantry/scripts/sync-recipe-dependencies.ts mysql.com mesa3d.org invisible-island.net/ncurses sourceforge.net/e2fsprogs php.net getcomposer.org gnu.org/autoconf gnu.org/automake gnu.org/libtool cmake.org google.com/chrome gnutls.org freedesktop.org/p11-kit tukaani.org/xz openjdk.org aws.amazon.com/dynamodb-local
          git add -N packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --check -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --binary -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig > artifacts/native-catalog/catalogs.patch
          git rev-parse HEAD > artifacts/native-catalog/source-commit.txt
      - name: Record exact committed catalog inputs for source qualification
        if: ${{ !inputs.generate-native-catalogs }}
        run: |
          git diff --exit-code -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          : > artifacts/native-catalog/catalogs.patch
      - name: Produce the normal Action bundles from verified source
        run: |
          bun run --cwd packages/action build
          mkdir -p artifacts/native-catalog/action
          cp packages/action/dist/index.js packages/action/dist/post.js artifacts/native-catalog/action/
          git rev-parse HEAD > artifacts/native-catalog/action/source-commit.txt
      - name: Verify that a stale development lock cannot replace the stable compiler
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: ziglang.org@0.17.0 bun.com@1.4.3
      - name: Verify the actual managed compiler identity
        run: |
          test "$(zig version)" = 0.17.0
          case "$(command -v zig)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          zig version > artifacts/native-catalog/zig-version.txt
      - name: Install every declared native workspace dependency through Pantry
        run: |
          pantry install
          test "$(zig version)" = 0.17.0
          git diff --binary -- pantry.lock bun.lock > artifacts/native-catalog/workspace-locks.patch
      - name: Check native transport formatting and build the source CLI
        run: |
          cd packages/zig
          zig fmt build.zig src/cli/diagnostics.zig src/http_retry.zig src/io_helper.zig src/deps/js_workspace.zig src/deps/js_delegate.zig src/cli/commands/install/workspace.zig src/install/downloader.zig src/install/installer.zig src/install/materialization.zig src/install/verified_staging.zig src/install/native_apps.zig src/install/pipeline.zig src/install/runtime.zig src/auth/registry.zig src/cli/commands/package.zig src/main.zig
          git diff --binary -- build.zig src/cli/diagnostics.zig src/http_retry.zig src/io_helper.zig src/deps/js_workspace.zig src/deps/js_delegate.zig src/cli/commands/install/workspace.zig src/install > ../../artifacts/native-catalog/native-format.patch
          zig test src/http_retry.zig
          # This artifact runs on other hosts. Use the normal portable target,
          # rather than inheriting the producer host's optional CPU features.
          zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline -Doptimize=Debug -j2
          printf '%s\n' 'x86_64-linux-gnu baseline' > ../../artifacts/native-catalog/native-build-target.txt
      - name: Verify exclusive extraction moves, cross-device copies and failed commits
        run: |
          set -o pipefail
          cd packages/zig
          zig build test:materialization -j2 --summary all 2>&1 | tee ../../artifacts/native-catalog/native-materialization-tests.log
          bun -e 'const log = await Bun.file("../../artifacts/native-catalog/native-materialization-tests.log").text(); const counts = log.match(/(\d+)\/(\d+) tests passed/); if (!counts || Number(counts[1]) < 12 || !log.includes("[pantry:materialize:test] exclusive payload=")) throw new Error("The native materialization filesystem regressions did not run")'
      - name: Retain the exact built native CLI for isolated HTTP contracts
        run: |
          cp packages/zig/zig-out/bin/pantry artifacts/native-catalog/lookup-cli
          sha256sum artifacts/native-catalog/lookup-cli > artifacts/native-catalog/lookup-cli-sha256.txt
      - name: Migrate and freeze the native workspace with the built source installer
        run: |
          packages/zig/zig-out/bin/pantry install
          packages/zig/zig-out/bin/pantry install --frozen-lockfile
          cp pantry.lock artifacts/native-catalog/source-workspace-pantry.lock
          sha256sum pantry.lock > artifacts/native-catalog/source-workspace-lock-sha256.txt
          if [ '${{ inputs.generate-workspace-lock }}' != 'true' ]; then
            git diff --exit-code -- pantry.lock bun.lock
          fi
      - name: Install the declared native unit-test fixture tools through Pantry
        if: inputs.verify-native-unit-tests
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: nixos.org/patchelf@0.18.0 llvm.org@23.1.3 gnu.org/binutils@2.46.0
      - name: Verify the managed fixture compiler and complete native suite
        if: inputs.verify-native-unit-tests
        run: |
          case "$(command -v clang)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          clang --version | head -1 | grep -F '23.1.3'
          cd packages/zig
          zig build test -j2 --summary all
      - name: Build the native DynamoDB distribution and require its live health check
        if: inputs.verify-dynamodb
        env:
          PANTRY_REPORTED_BY_PARENT: '1'
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bun packages/ts-pantry/scripts/build-package.ts --package aws.amazon.com/dynamodb-local --version 3.3.0 --platform linux-x86-64 --build-dir "$RUNNER_TEMP/dynamodb-build" --prefix "$RUNNER_TEMP/dynamodb-install" --deps-dir "$RUNNER_TEMP/dynamodb-deps" --bucket "$S3_BUCKET" --region "$S3_REGION" 2>&1 | tee artifacts/native-catalog/native-build.log
      - name: Select the declared Chrome producer tools
        if: inputs.verify-chrome
        id: chrome-tools
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"
      - name: Install the native producer tools through Pantry
        if: inputs.verify-chrome
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: ${{ steps.chrome-tools.outputs.packages }}
      - name: Build Chrome with its required clean-environment sandbox and owned NSS checks
        if: inputs.verify-chrome
        env:
          PANTRY_REPORTED_BY_PARENT: '1'
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bun packages/ts-pantry/scripts/native-publisher-toolchain.ts
          bun packages/ts-pantry/scripts/build-package.ts --package google.com/chrome --version 155.0.8059.84.1 --platform linux-x86-64 --build-dir "$RUNNER_TEMP/chrome-build" --prefix "$RUNNER_TEMP/chrome-install" --deps-dir "$RUNNER_TEMP/chrome-deps" --bucket "$S3_BUCKET" --region "$S3_REGION" 2>&1 | tee artifacts/native-catalog/chrome-native-build.log
      - name: Retain the generated source patch and registration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
          if-no-files-found: error
  public-chrome:
    if: inputs.verify-public-chrome
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Bind the original public tag and committed Action before any install
        env:
          PANTRY_PUBLIC_VERSION: ${{ inputs.public-pantry-version }}
          PANTRY_PUBLIC_SOURCE: ${{ inputs.public-pantry-source }}
        run: |
          test "$GITHUB_REF" = "refs/tags/v$PANTRY_PUBLIC_VERSION"
          test "$(git rev-parse HEAD)" = "$PANTRY_PUBLIC_SOURCE"
      - name: Install the immutable original published Action, CLI and managed Bun
        id: public-pantry
        uses: ./packages/action
        with:
          version: ${{ inputs.public-pantry-version }}
          install: 'false'
          packages: bun.com@1.4.3
      - name: Verify actual public archive bytes and ordinary CLI and SDK installs
        env:
          PANTRY_PUBLIC_CHROME_CLI: ${{ steps.public-pantry.outputs.pantry-path }}
          PANTRY_PUBLIC_VERSION: ${{ inputs.public-pantry-version }}
          PANTRY_PUBLIC_SOURCE: ${{ inputs.public-pantry-source }}
        run: bun .github/scripts/verify-public-chrome-revision.ts
      - name: Preserve original public compatibility and clean-environment rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-chrome-original-release-compatibility
          path: artifacts/public-chrome-revision
          if-no-files-found: error
  registry-lookup:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        segment: [metadata, rate-limit, diagnostics, artifact-stalled-head, artifact-stalled-body]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up published Pantry and its managed test runtime
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: bun.com@1.4.3
      - uses: actions/download-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
      - name: Verify the built CLI source and bytes
        run: |
          test "$(cat artifacts/native-catalog/source-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c artifacts/native-catalog/lookup-cli-sha256.txt
          chmod +x artifacts/native-catalog/lookup-cli
      - name: Verify every real HTTP case in the required segment
        env:
          PANTRY_SOURCE_CLI: artifacts/native-catalog/lookup-cli
          PANTRY_LOOKUP_SEGMENT: ${{ matrix.segment }}
        run: bun .github/scripts/verify-registry-lookup.ts
      - name: Retain HTTP observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-lookup-${{ matrix.segment }}
          path: artifacts/native-catalog/native-registry-lookup.json
          if-no-files-found: error
  workspace-graph:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the immutable migration baseline and managed fixture tools
        id: pantry
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf
        with:
          version: 0.11.101
          install: 'false'
          packages: bun.com@1.4.3 gnu.org/tar@1.35
      - uses: actions/download-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
      - name: Verify the built source and actual cold, warm, frozen, and 101 migration bindings
        run: |
          test "$(cat artifacts/native-catalog/source-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c artifacts/native-catalog/lookup-cli-sha256.txt
          chmod +x artifacts/native-catalog/lookup-cli
          source_cli="$GITHUB_WORKSPACE/artifacts/native-catalog/lookup-cli"
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" single
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" workspace
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" workspace '${{ steps.pantry.outputs.pantry-path }}'
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" members-only
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" mixed
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" dot-name
          bun .github/scripts/verify-js-lifecycle.ts "$source_cli"
      - name: Retain actual dependency bindings and original migration locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-workspace-graph
          path: artifacts/nested-js-graph
          if-no-files-found: error
  publication-contract:
    name: Native publication contract (${{ matrix.segment }})
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        segment: [transport, lookup, availability, encoding]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up published Pantry and its managed test runtime
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: bun.com@1.4.3
      - uses: actions/download-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
      - name: Verify the same integrated source CLI used by the installer contracts
        run: |
          test "$(cat artifacts/native-catalog/source-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c artifacts/native-catalog/lookup-cli-sha256.txt
          chmod +x artifacts/native-catalog/lookup-cli
      - name: Verify every real publication HTTP contract in the required segment
        run: bun .github/scripts/verify-npm-publication.ts "$GITHUB_WORKSPACE/artifacts/native-catalog/lookup-cli" '${{ matrix.segment }}'
