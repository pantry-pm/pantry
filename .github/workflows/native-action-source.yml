name: Verify Native Action Source

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'Exact Pantry source commit to build and verify'
        required: true
        type: string
      pantry-version:
        description: 'Published Pantry CLI version (never a source CLI override)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  services:
    name: Native services (${{ matrix.os }}, MySQL ${{ matrix.mysql }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mysql: ['26.7.0', '8.4.11']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Bootstrap the published workspace runtime through Pantry
        uses: pantry-pm/pantry/packages/action@da17bb9317e8f8c247618fb176fe97269f15bfe4 # v0.11.94
        with:
          version: 0.11.94
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify source types, service contracts and ownership guards
        run: |
          set -e
          git rev-parse HEAD
          bun run typecheck
          bun test packages/action/src/services.test.ts packages/action/src/native-dynamodb.test.ts packages/action/src/native-cache.test.ts packages/action/src/service-ownership.test.ts packages/action/src/bootstrap.test.ts packages/action/src/build-portability.test.ts packages/action/src/release-download.test.ts
      - name: Build this checkout's Action bundles
        run: bun run --cwd packages/action build
      - name: Run the built Action with published native service packages
        id: pantry
        uses: ./packages/action
        with:
          version: ${{ inputs.pantry-version }}
          install: 'false'
          packages: bun.com@1.4.4
          services: postgres@17.11 mysql@${{ matrix.mysql }} redis@8.8.0 typesense@30.2 ${{ runner.os == 'Linux' && 'dynamodb@3.3.0' || '' }}
      - name: Verify Action outputs and real PostgreSQL authentication
        env:
          ACTION_MYSQL_URL: ${{ steps.pantry.outputs.mysql-url }}
          ACTION_MYSQL_VERSION: ${{ steps.pantry.outputs.mysql-version }}
          ACTION_DYNAMODB_URL: ${{ steps.pantry.outputs.dynamodb-url }}
          ACTION_DYNAMODB_VERSION: ${{ steps.pantry.outputs.dynamodb-version }}
        run: |
          set -e
          test "$POSTGRES_SERVICE_VERSION" = 17.11
          test "$(psql -X -A -t -c 'SELECT 42')" = 42
          test "$MYSQL_SERVICE_VERSION" = '${{ matrix.mysql }}'
          test "$ACTION_MYSQL_VERSION" = "$MYSQL_SERVICE_VERSION"
          test "$ACTION_MYSQL_URL" = "$MYSQL_URL"
          test "$MYSQL_HOST" = 127.0.0.1
          test "$MYSQL_PORT" -ne 3306
          test "$REDIS_PORT" -ne 6379
          test "$TYPESENSE_SERVICE_VERSION" = 30.2
          if [ '${{ runner.os }}' = Linux ]; then
            test "$DYNAMODB_SERVICE_VERSION" = 3.3.0
            test "$ACTION_DYNAMODB_VERSION" = "$DYNAMODB_SERVICE_VERSION"
            test "$ACTION_DYNAMODB_URL" = "$DYNAMODB_URL"
            test "$DYNAMODB_HOST" = 127.0.0.1
            test "$DYNAMODB_PORT" -ne 8000
          fi
      - name: Exercise real native isolation, authentication, TLS and cleanup
        env:
          PANTRY_NATIVE_SERVICE_TEST_BIN: ${{ github.workspace }}/pantry/.bin
          PANTRY_NATIVE_MYSQL_TEST_VERSION: ${{ matrix.mysql }}
        run: bun test packages/action/src/native-services.integration.test.ts
      - name: Retain the built bundles and source identity
        if: always()
        run: |
          mkdir -p artifacts/native-action-source
          git rev-parse HEAD > artifacts/native-action-source/source-commit.txt
          cp packages/action/dist/index.js packages/action/dist/post.js artifacts/native-action-source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-action-${{ matrix.os }}-mysql-${{ matrix.mysql }}
          path: artifacts/native-action-source
          if-no-files-found: error

  bootstrap-windows:
    name: Native Node bootstrap (Windows)
    needs: services
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      # Consume this exact source's normal build, before installing any runtime.
      # The bootstrap must run with the Action's Node24 host alone on Windows.
      - uses: actions/download-artifact@v4
        with:
          name: native-action-ubuntu-latest-mysql-26.7.0
          path: packages/action/dist
      - name: Verify the generated bundle source
        run: test "$(cat packages/action/dist/source-commit.txt)" = "$(git rev-parse HEAD)"
      - name: Bootstrap the real native CLI and Bun through the built Action
        uses: ./packages/action
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/pantry-source-bootstrap
        with:
          version: ${{ inputs.pantry-version }}
          install: 'false'
          packages: bun.com@1.4.4
      - name: Verify native bootstrap and portable ZIP/cache contracts
        run: |
          pantry --version | grep -F '${{ inputs.pantry-version }}'
          bun --version | grep -Fx '1.4.4'
          bun test packages/action/src/bootstrap.test.ts

  native-toolchain-pins:
    name: Published CLI and built Action pins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - uses: pantry-pm/pantry/packages/action@da17bb9317e8f8c247618fb176fe97269f15bfe4
        with:
          version: 0.11.94
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/action build
      - uses: ./packages/action
        env:
          JAVA_HOME: ${{ runner.temp }}/unselected-host-jdk
        with:
          version: ${{ inputs.pantry-version }}
          install: 'false'
          packages: openjdk.org@17.0.20.8 android.com/cmdline-tools@14742923.0.0 bun.com@1.4.4
      - run: bun .github/scripts/native-toolchain-pins.ts
        env:
          PANTRY_EXPECT_VERSION: ${{ inputs.pantry-version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-native-pins-${{ matrix.os }}
          path: artifacts/native-toolchain-pins
          if-no-files-found: error
