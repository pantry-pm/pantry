name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default to least-privilege GITHUB_TOKEN; jobs that need more elevate explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        id: install
        run: bun install

      # These three check different things and do not depend on each other, so
      # every one of them runs even when an earlier one fails. As plain
      # sequential steps the first red step skipped the rest, which is why the
      # Zig formatting below went unreported for as long as the TypeScript lint
      # above it was failing.
      - name: Lint TypeScript/JavaScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Check package-manager and registry documentation contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run docs:contracts:check

      - name: Verify the committed Action distribution before any rebuild
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test packages/action/src/build-portability.test.ts

      # Zig is a hard dependency of this repo, so a missing toolchain is a
      # failure rather than a reason to quietly pass. The old `if command -v
      # zig` guard turned "pantry could not install zig" into a silent skip.
      - name: Format Check Zig Code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          command -v zig >/dev/null || { echo "::error::zig not on PATH — cannot verify formatting"; exit 1; }
          find packages/zig/src -name "*.zig" -not -name "generated.zig" -type f -exec zig fmt --check {} +

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    # Source CLI and Bun checks share their prepared compiler. The independent
    # Zig suite below must not spend its budget downloading Android tools.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        id: install
        run: bun install

      - name: Build TypeScript packages
        id: build
        run: bun run build

      - name: Verify the normally packed SDK with strict installed consumers
        id: sdk
        run: bun run test:sdk
        env:
          PANTRY_SDK_EVIDENCE: ${{ runner.temp }}/pantry-sdk

      - name: Retain installed SDK evidence
        if: always() && steps.sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pantry-sdk-source
          path: ${{ runner.temp }}/pantry-sdk
          if-no-files-found: error

      - name: Build pantry GitHub Action
        id: build_action
        run: cd packages/action && bun run build

      - name: Verify consecutive normal releases retain their generated Action bundles
        run: bun test ./packages/action/src/build-release-action.test.ts

      # The source CLI build prepares the pinned compiler before the Bun
      # incremental-metadata test. That regression keeps its short rebuild
      # budget; a cold compiler bootstrap is setup rather than a cache check.
      - name: Test the source CLI workspace lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          command -v zig >/dev/null
          cd packages/zig
          zig build -Doptimize=Debug -j2
          cd ../..
          packages/zig/zig-out/bin/pantry install --ignore-scripts
          bun .github/scripts/verify-workspace-toolchain.ts
          cd packages/zig
          zig build -Doptimize=Debug -j2
          PANTRY_SOURCE_CLI="$PWD/zig-out/bin/pantry" bun test test/workspace-companion-e2e.test.ts

      - name: Verify this source migrates its published bootstrap to the committed workspace lock
        run: |
          packages/zig/zig-out/bin/pantry install
          packages/zig/zig-out/bin/pantry install --frozen-lockfile
          git diff --exit-code -- pantry.lock bun.lock

      # This is the historical broken-layout migration fixture, not the
      # workspace bootstrap. The source installer must migrate its actual 101
      # graph; current versions no longer create that graph.
      - name: Install the historical migration CLI and native graph fixture archiver
        id: migration-baseline
        uses: ./packages/action
        with:
          version: 0.11.101
          install: 'false'
          packages: gnu.org/tar@1.35

      - name: Verify the source JavaScript workspace graph and published-version migration
        run: |
          source_cli="$GITHUB_WORKSPACE/packages/zig/zig-out/bin/pantry"
          migration_baseline="${{ steps.migration-baseline.outputs.pantry-path }}"
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" single
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" workspace
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" workspace "$migration_baseline"
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" members-only
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" mixed
          bun .github/scripts/verify-nested-js-graph.ts "$source_cli" dot-name
          bun .github/scripts/verify-js-lifecycle.ts "$source_cli"
          bun .github/scripts/verify-js-add.ts "$source_cli"

      - name: Retain JavaScript graph and migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-nested-js-graph
          path: artifacts/nested-js-graph
          if-no-files-found: error

      - name: Verify Git installation with the source Linux CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/linux-native-tools.ts

      - name: Verify Android tools installation with the source Linux CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/android-native-tools.ts

      - name: Retain source Android tools verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-android-native-tools
          path: artifacts/android-native-tools
          if-no-files-found: error

      - name: Retain source Linux CLI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-linux-native-tools
          path: artifacts/linux-native-tools
          if-no-files-found: error

      - name: Install native runtime fixture tools through Pantry
        uses: ./packages/action
        with:
          install: 'false'
          packages: nixos.org/patchelf@0.18.0 llvm.org@23.1.3 gnu.org/binutils@2.46.0

      - name: Verify the managed package-build compiler
        run: |
          set -e
          case "$(command -v clang)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          clang --version | head -1 | grep -F '23.1.3'

      # Report Bun and Zig independently even when either suite fails.
      - name: Verify registry test storage is released
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build_action.outcome == 'success' }}
        run: |
          fixture_tmp="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_tmp"' EXIT
          TMPDIR="$fixture_tmp" bun test ./packages/registry/src/tiers.test.ts
          leaked_fixture="$(find "$fixture_tmp" -type d -name 'pantry-registry-*' -print -quit)"
          if [ -n "$leaked_fixture" ]; then
            printf '::error::Registry tests retained owned storage: %s\n' "$leaked_fixture"
            exit 1
          fi

      - name: Unit Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build_action.outcome == 'success' }}
        env:
          PANTRY_TEST_CC: '["clang"]'
        run: |
          bun .github/scripts/verify-workspace-toolchain.ts
          bun test

  zig-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Seed a stale legacy Zig cache beside the selected compiler
        run: |
          mkdir -p "$HOME/.pantry/global/packages/ziglang.org/v0.0.0-stale"
          printf '#!/bin/sh\nprintf "stale-compiler-cache\\n"\n' > "$HOME/.pantry/global/packages/ziglang.org/v0.0.0-stale/zig"
          chmod 755 "$HOME/.pantry/global/packages/ziglang.org/v0.0.0-stale/zig"

      - name: Setup pinned Pantry and workspace dependencies
        uses: ./packages/action
        with:
          version: '0.11.179'

      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install native runtime fixture tools through Pantry
        uses: ./packages/action
        with:
          version: '0.11.179'
          install: 'false'
          packages: nixos.org/patchelf@0.18.0 llvm.org@23.1.3 gnu.org/binutils@2.46.0

      - name: Verify the managed package-build compiler
        run: |
          set -e
          case "$(command -v clang)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          clang --version | head -1 | grep -F '23.1.3'

      - name: Zig Tests
        run: |
          cd packages/zig
          zig build -Doptimize=Debug -j2
          cd ../..
          packages/zig/zig-out/bin/pantry install --ignore-scripts
          bun .github/scripts/verify-workspace-toolchain.ts
          cd packages/zig
          zig build test -j2 --summary all

  action-redis-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry and pinned Redis
        id: pantry
        uses: ./packages/action
        with:
          install: 'false'
          services: redis@8.8.0

      - name: Verify exported runtime and live service contract
        env:
          ACTION_REDIS_URL: ${{ steps.pantry.outputs.redis-url }}
          ACTION_REDIS_VERSION: ${{ steps.pantry.outputs.redis-version }}
        run: |
          test "$REDIS_HOST" = 127.0.0.1
          test "$REDIS_PORT" -ne 6379
          test -n "$REDIS_PASSWORD"
          test -n "$REDIS_URL"
          test "$ACTION_REDIS_URL" = "$REDIS_URL"
          test "$ACTION_REDIS_VERSION" = "8.8.0"
          test "$REDIS_SERVICE_VERSION" = "$ACTION_REDIS_VERSION"
          bun --version
          test "$(redis-cli -u "$REDIS_URL" ping)" = "PONG"
          redis-cli -u "$REDIS_URL" set pantry-action-contract ready
          test "$(redis-cli -u "$REDIS_URL" get pantry-action-contract)" = "ready"

  action-native-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ['26.7.0', '8.4.11']
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap the published workspace runtime through Pantry
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf # v0.11.101
        with:
          install: 'false'
          version: 0.11.179
          packages: bun.com@1.4.2
      - name: Build the current Action from frozen first-party dependencies
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/action build
      - name: Set up native MySQL, PostgreSQL, Redis, Typesense and DynamoDB through Pantry
        id: pantry
        uses: ./packages/action
        with:
          install: 'false'
          version: 0.11.179
          packages: bun.com@1.4.2
          services: postgres@17.11 mysql@${{ matrix.mysql }} typesense@30.2 redis@8.8.0 dynamodb@3.3.0
      - name: Verify authenticated PostgreSQL and action exports
        env:
          ACTION_MYSQL_URL: ${{ steps.pantry.outputs.mysql-url }}
          ACTION_MYSQL_VERSION: ${{ steps.pantry.outputs.mysql-version }}
          ACTION_DYNAMODB_URL: ${{ steps.pantry.outputs.dynamodb-url }}
          ACTION_DYNAMODB_VERSION: ${{ steps.pantry.outputs.dynamodb-version }}
        run: |
          test "$POSTGRES_SERVICE_VERSION" = 17.11
          test "$(psql -X -A -t -c 'SELECT 42')" = 42
          test "$TYPESENSE_SERVICE_VERSION" = 30.2
          test "$MYSQL_SERVICE_VERSION" = "${{ matrix.mysql }}"
          test "$ACTION_MYSQL_VERSION" = "$MYSQL_SERVICE_VERSION"
          test "$ACTION_MYSQL_URL" = "$MYSQL_URL"
          test "$MYSQL_HOST" = 127.0.0.1
          test "$MYSQL_PORT" -ne 3306
          test "$DYNAMODB_SERVICE_VERSION" = 3.3.0
          test "$ACTION_DYNAMODB_VERSION" = "$DYNAMODB_SERVICE_VERSION"
          test "$ACTION_DYNAMODB_URL" = "$DYNAMODB_URL"
          test "$DYNAMODB_HOST" = 127.0.0.1
          test "$DYNAMODB_PORT" -ne 8000
      - name: Verify native isolation, indexing and cleanup
        env:
          PANTRY_NATIVE_SERVICE_TEST_BIN: ${{ github.workspace }}/pantry/.bin
          PANTRY_NATIVE_MYSQL_TEST_VERSION: ${{ matrix.mysql }}
        run: |
          test -x "$PANTRY_NATIVE_SERVICE_TEST_BIN/mysqld"
          test -x "$PANTRY_NATIVE_SERVICE_TEST_BIN/redis-server"
          bun test packages/action/src/native-services.integration.test.ts packages/action/src/services.test.ts

  action-native-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install native tool dependency graphs through Pantry
        uses: ./packages/action
        with:
          install: 'false'
          version: 0.11.179
          packages: bun.sh@1.4.2 git-scm.org@2.53.0 openssh.com@10.2.0
      - name: Exercise executable wrappers and native compression libraries
        run: |
          test "$(git --version)" = 'git version 2.53.0'
          git init "$RUNNER_TEMP/pantry-git-contract"
          test -z "$(git -C "$RUNNER_TEMP/pantry-git-contract" status --porcelain)"
          printf 'Pantry native compression contract\n' > "$RUNNER_TEMP/pantry-compression-input"
          zstdmt -q -f "$RUNNER_TEMP/pantry-compression-input" -o "$RUNNER_TEMP/pantry-compression-input.zst"
          zstd -q -d -f "$RUNNER_TEMP/pantry-compression-input.zst" -o "$RUNNER_TEMP/pantry-compression-output"
          cmp "$RUNNER_TEMP/pantry-compression-input" "$RUNNER_TEMP/pantry-compression-output"
      - name: Verify relocated native SSH clients
        env:
          PANTRY_NATIVE_OPENSSH_TEST_BIN: ${{ github.workspace }}/pantry/.bin
        run: bun test packages/action/src/native-openssh.integration.test.ts

  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cli-sha256: ${{ steps.source-cli.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap the published compiler and Bun runtime
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf # v0.11.101
        with:
          version: 0.11.179
          install: 'false'
          packages: bun.com@1.4.4 ziglang.org@0.17.1
      - name: Bootstrap the compiler dependencies with the previous published installer
        run: pantry install
      - run: bun install --frozen-lockfile
      - name: Build this checkout's native CLI
        run: cd packages/zig && zig build -Doptimize=Debug -j2
      - name: Require the source installer to restore the committed canonical workspace lock
        run: |
          packages/zig/zig-out/bin/pantry install
          packages/zig/zig-out/bin/pantry install --frozen-lockfile
          git diff --exit-code -- pantry.lock bun.lock
          bun .github/scripts/verify-workspace-toolchain.ts
          cd packages/zig && zig build -Doptimize=Debug -j2
      - name: Retain the verified source CLI for independent publication checks
        id: source-cli
        run: |
          mkdir -p artifacts/source-linux-cli
          cp packages/zig/zig-out/bin/pantry artifacts/source-linux-cli/pantry
          pantry_source_cli_sha256=$(sha256sum artifacts/source-linux-cli/pantry | cut -d ' ' -f 1)
          printf 'sha256=%s\n' "$pantry_source_cli_sha256" >> "$GITHUB_OUTPUT"
          printf '{"sourceCommit":"%s","sha256":"%s"}\n' "$GITHUB_SHA" "$pantry_source_cli_sha256" > artifacts/source-linux-cli/identity.json
      - name: Preserve the compiled source CLI
        uses: actions/upload-artifact@v4
        with:
          name: source-linux-publication-cli
          path: artifacts/source-linux-cli
          if-no-files-found: error
      - name: Verify immutable publication retries through the native transport
        env:
          PANTRY_SOURCE_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/verify-publication-retry.ts
      - name: Verify publish lifecycle controls through the native transport
        env:
          PANTRY_SOURCE_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/verify-publication-lifecycle.ts
      - name: Verify gateway recovery and terminal authentication through the native transport
        env:
          PANTRY_SOURCE_CLI: packages/zig/zig-out/bin/pantry
          PANTRY_LOOKUP_SEGMENT: gateway-recovery
        run: bun .github/scripts/verify-registry-lookup.ts
      - name: Verify real Git revision identity through the source installer
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/git-revision-identity.ts
      - name: Verify the real Linux browser package through the source installer
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/linux-native-browser.ts
      - name: Preserve native browser installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-linux-native-browser
          path: |
            artifacts/linux-native-browser
            artifacts/git-revision-identity
            artifacts/native-catalog/native-registry-lookup.json
          if-no-files-found: error

  # The new pack and npm deadline controls must not consume the browser's
  # existing 600-second command budget inside its unchanged 20-minute job.
  native-publication:
    needs: native-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up the qualified published Bun runtime
        uses: pantry-pm/pantry/packages/action@ed77c935472bfe352e1119c8e2c3c6be9d23cf9e # v0.11.201
        with:
          version: 0.11.201
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: source-linux-publication-cli
          path: artifacts/source-linux-cli
      - name: Verify the exact compiled source input
        env:
          PANTRY_SOURCE_CLI_SHA256: ${{ needs.native-browser.outputs.cli-sha256 }}
        run: |
          test -n "$PANTRY_SOURCE_CLI_SHA256"
          printf '%s  artifacts/source-linux-cli/pantry\n' "$PANTRY_SOURCE_CLI_SHA256" | sha256sum --check --strict
          bun -e '
            const assert = (await import("node:assert/strict")).default;
            const identity = await Bun.file("artifacts/source-linux-cli/identity.json").json();
            assert.equal(identity.sourceCommit, process.env.GITHUB_SHA);
            assert.equal(identity.sha256, process.env.PANTRY_SOURCE_CLI_SHA256);
          '
          chmod 755 artifacts/source-linux-cli/pantry
      - name: Verify canonical package archives through the source CLI
        env:
          PANTRY_SOURCE_CLI: artifacts/source-linux-cli/pantry
        run: |
          bun .github/scripts/canonical-pack.ts
          bun .github/scripts/verify-canonical-archive.ts artifacts/canonical-pack/pack-before-hooks.tgz artifacts/canonical-pack/uploaded.tgz
      - name: Verify the canonical SDK archive with strict installed consumers
        env:
          PANTRY_SDK_EVIDENCE: artifacts/canonical-pack/sdk-consumer
        run: |
          bun run --cwd packages/ts-pantry build
          artifacts/source-linux-cli/pantry pack packages/ts-pantry --ignore-scripts --filename artifacts/canonical-pack/sdk.tgz
          bun .github/scripts/verify-ts-sdk.ts artifacts/canonical-pack/sdk.tgz
      - name: Verify npm publication archives and transport deadlines
        run: |
          set -o pipefail
          bun .github/scripts/verify-npm-publication.ts artifacts/source-linux-cli/pantry 2>&1 | tee artifacts/canonical-pack/npm-publication.log
      - name: Preserve canonical publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-linux-native-publication
          path: artifacts/canonical-pack
          if-no-files-found: error

  continuous-release:
    needs: [lint, typecheck, test, action-redis-service, action-native-services, action-native-tools, native-browser, native-publication, windows-native-runtime, windows-git]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Best-effort commit-preview publishing. Don't fail the whole workflow
    # if the registry/S3 is unreachable or secrets are missing — the main
    # pipeline (typecheck/lint/test) is what gates mergeability.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        run: bun install

      - name: Build TypeScript packages
        run: bun run build

      - name: Continuous Releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          # Revert any accidental changes to bun.lock from `bun install` during setup
          if [ -f bun.lock ] && ! git diff --quiet bun.lock; then
            git checkout -- bun.lock
          fi
          pantry publish:commit './packages/*'

  notify:
    name: discord-failure-alert
    needs: [lint, typecheck, test, action-redis-service, continuous-release]
    # continuous-release is best-effort; only alert on gating job failures.
    if: always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.test.result == 'failure' || needs.action-redis-service.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "CI — Failed"
          description: "CI pipeline failure on ${{ github.ref_name }}"
          status: failure
          fields: |
            [
              {"name": "Lint", "value": "${{ needs.lint.result }}", "inline": true},
              {"name": "Typecheck", "value": "${{ needs.typecheck.result }}", "inline": true},
              {"name": "Test", "value": "${{ needs.test.result }}", "inline": true},
              {"name": "Redis service", "value": "${{ needs.action-redis-service.result }}", "inline": true},
              {"name": "Release", "value": "${{ needs.continuous-release.result }}", "inline": true},
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Author", "value": "${{ github.actor }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  windows-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pantry
        uses: ./packages/action
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Build the source Action for Windows runtime qualification
        run: cd packages/action && bun run build

      - name: Cross-compile the source CLI for native Windows qualification
        run: |
          cd packages/zig
          zig build -Doptimize=Debug -j2
          cd ../..
          packages/zig/zig-out/bin/pantry install --ignore-scripts
          bun .github/scripts/verify-workspace-toolchain.ts
          cd packages/zig
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=Debug -j2 --prefix ../../artifacts/windows-source-cli
          zig test src/io_helper.zig -lc -target x86_64-windows-gnu --test-no-exec --test-filter deleteTree -femit-bin=../../artifacts/windows-source-cli/bin/file-tree-tests.exe
          zig test src/io_helper.zig -lc -target x86_64-windows-gnu --test-no-exec --test-filter "access checks" -femit-bin=../../artifacts/windows-source-cli/bin/access-tests.exe

      - name: Retain the source Windows CLI and Action
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-runtime
          path: |
            artifacts/windows-source-cli/bin/pantry.exe
            artifacts/windows-source-cli/bin/file-tree-tests.exe
            artifacts/windows-source-cli/bin/access-tests.exe
            artifacts/windows-source-cli/bin/*.pdb
            packages/action/dist/index.js
            packages/action/dist/post.js
          if-no-files-found: error

  windows-native-runtime:
    needs: windows-source-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the declared Windows Bun runtime through Pantry
        id: pantry
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf # v0.11.101
        with:
          version: 0.11.179
          install: 'false'
          packages: bun.com@1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: windows-source-runtime
          path: artifacts/windows-source-runtime
      - name: Test source preservation through directory and nested links
        run: '& ./artifacts/windows-source-runtime/artifacts/windows-source-cli/bin/file-tree-tests.exe'
      - name: Verify native access semantics
        run: '& ./artifacts/windows-source-runtime/artifacts/windows-source-cli/bin/access-tests.exe'
      - name: Verify the actual source installer and required workspace failures
        env:
          PANTRY_TEST_CLI: artifacts/windows-source-runtime/artifacts/windows-source-cli/bin/pantry.exe
          PANTRY_TEST_ACTION: artifacts/windows-source-runtime/packages/action/dist/index.js
        run: bun .github/scripts/windows-native-runtime.ts
      - name: Verify executable bin metadata in real Windows npm uploads
        shell: bash
        run: bun .github/scripts/verify-npm-publication.ts artifacts/windows-source-runtime/artifacts/windows-source-cli/bin/pantry.exe encoding
      - name: Verify canonical package archives through the native Windows CLI
        env:
          PANTRY_SOURCE_CLI: artifacts/windows-source-runtime/artifacts/windows-source-cli/bin/pantry.exe
        run: bun .github/scripts/canonical-pack.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-canonical-pack
          path: artifacts/canonical-pack
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-runtime-proof
          path: artifacts/windows-native-runtime
          if-no-files-found: error

  windows-git:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the declared Windows Bun runtime
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf # v0.11.101
        with:
          version: 0.11.179
          install: 'false'
          packages: bun.com@1.4.4
      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build the actual source Action
        run: bun run --cwd packages/action build
      - name: Verify native Windows Git, submodules, HTTPS and restored runtime resources
        id: windows_git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PANTRY_TEST_ACTION: packages/action/dist/index.js
        run: bun .github/scripts/windows-git.ts
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.windows_git.outcome != 'skipped' }}
        with:
          name: windows-git-proof
          path: artifacts/windows-git
          if-no-files-found: error

  native-toolchain-pins:
    name: Explicit native toolchain pins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap the published compiler and Bun runtime
        uses: pantry-pm/pantry/packages/action@ae59a7b7fc5f4e6f7b8041a75e6b5772680bebdf # v0.11.101
        with:
          version: 0.11.179
          install: 'false'
          packages: bun.com@1.4.4 ziglang.org@0.17.1
      - name: Bootstrap the compiler dependencies with the previous published installer
        run: pantry install
      - run: bun install --frozen-lockfile
      - name: Verify native service admission and shutdown on this platform
        run: bun test packages/action/src/service-ownership.test.ts packages/action/src/native-dynamodb.test.ts packages/action/src/native-cache.test.ts
      - name: Build the source CLI before release
        run: cd packages/zig && zig build -Doptimize=Debug -j2
      - name: Verify source migration and the committed frozen workspace with this checkout's native CLI
        run: |
          packages/zig/zig-out/bin/pantry install
          packages/zig/zig-out/bin/pantry install --frozen-lockfile
          git diff --exit-code -- pantry.lock bun.lock
          bun .github/scripts/verify-workspace-toolchain.ts
          cd packages/zig && zig build -Doptimize=Debug -j2
      - name: Verify explicit pins through the recursive native installer
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/native-toolchain-pins.ts
      - name: Preserve the source CLI proof
        run: |
          mv artifacts/native-toolchain-pins artifacts/source-native-toolchain-pins
          cp packages/zig/zig-out/bin/pantry artifacts/source-native-toolchain-pins/pantry
          git rev-parse HEAD > artifacts/source-native-toolchain-pins/source-commit.txt
          zig version > artifacts/source-native-toolchain-pins/compiler-version.txt
          bun -p 'process.platform + " " + process.arch' > artifacts/source-native-toolchain-pins/build-platform.txt
      - name: Build this checkout's Action
        run: bun run --cwd packages/action build
      - name: Activate the declared Java toolchain over an inherited host setting
        uses: ./packages/action
        env:
          JAVA_HOME: ${{ runner.temp }}/unselected-host-jdk
        with:
          version: 0.11.179
          install: 'false'
          packages: openjdk.org@17.0.20.8 android.com/cmdline-tools@14742923.0.0 bun.com@1.4.4
      - name: Verify the Action's real Java-dependent commands before release
        env:
          PANTRY_EXPECT_VERSION: 0.11.179
        run: bun .github/scripts/native-toolchain-pins.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-toolchain-pins-${{ matrix.os }}
          path: |
            artifacts/native-toolchain-pins
            artifacts/source-native-toolchain-pins
          if-no-files-found: error
