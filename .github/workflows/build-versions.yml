        if: runner.os == 'macOS' && steps.source-preflight.outputs.needs_build != 'false'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/opt
