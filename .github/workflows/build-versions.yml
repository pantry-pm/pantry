name: Build Multi-Version Packages

on:
  # No `schedule:` — this matrix includes macos-15 (10x billing) and must not run
  # unsupervised. Multi-version backfill is a growth job, not a freshness job:
  # darwin-arm64 downloads are filled on ubuntu by mirror.yml + the Hetzner fleet,
  # and new versions publish immediately via publish-changed-packages (ubuntu).
  # Run manually (workflow_dispatch) for a supervised multi-version macOS sweep.
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package domains (empty = all)'
        required: false
        type: string
      max-versions:
        description: 'Maximum versions to build per package'
        required: false
        type: number
        default: 5
      force:
        description: 'Force re-upload even if already in S3'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-versions
  cancel-in-progress: false

env:
  # Share verified dependency archives across packages, stripes, and CI runs.
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
  # Build-status dashboard reporting is authenticated; without this token every
  # report-build POST 401s and the build is invisible on pantry.dev/packages.
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage provider. Set the repo variable STORAGE_PROVIDER=hetzner (or
  # backblaze) plus the S3_* vars and the S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
  # secrets below to publish binaries there. Defaults to AWS S3 (unchanged).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  # Provider-agnostic S3-compatible credentials (Hetzner Object Storage,
  # Backblaze B2, etc.). Used for any non-AWS provider; unset ⇒ AWS path unaffected.
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  # Discover how many buildable packages exist for batching
  discover:
    name: Discover buildable packages
    if: github.event.inputs.packages == '' || github.event.inputs.packages == null
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.discover.outputs.batches }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Discover packages
        id: discover
        run: |
          set -o pipefail
          cd packages/ts-pantry
          TOTAL=$(bun scripts/build-all-packages.ts --count-only 2>/dev/null | tail -1)
          if [ -z "$TOTAL" ] || ! echo "$TOTAL" | grep -qE '^[0-9]+$'; then
            echo "::error::Failed to discover package count (got: '$TOTAL')"
            exit 1
          fi
          echo "total=$TOTAL"
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Use smaller batches for multi-version (more work per package)
          BATCH_SIZE=25
          LAST_BATCH=$(( (TOTAL - 1) / BATCH_SIZE ))
          BATCHES=$(python3 -c "import json; print(json.dumps(list(range($LAST_BATCH + 1))))")
          echo "batches=$BATCHES"
          echo "batches=$BATCHES" >> $GITHUB_OUTPUT

  # Targeted multi-version build (specific packages)
  build-targeted:
    name: Build targeted (${{ matrix.platform.name }})
    if: github.event.inputs.packages != '' && github.event.inputs.packages != null
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-15
            name: darwin-arm64
          - os: ubuntu-latest
            name: linux-x86-64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install dependencies
        run: bun install

      - name: Preflight source build
        id: source-preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          cd packages/ts-pantry

          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force enabled; build tools are required"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAX_VERSIONS="${{ github.event.inputs.max-versions || '5' }}"
          PACKAGES="${{ github.event.inputs.packages }}"
          PACKAGES="${PACKAGES// /,}"
          ARGS="-b $S3_BUCKET -r $AWS_REGION --platform ${{ matrix.platform.name }} --multi-version --max-versions $MAX_VERSIONS -p $PACKAGES"
          NEEDS_BUILD=$(bun scripts/build-all-packages.ts $ARGS --needs-build | tail -1)
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_BUILD" = "false" ]; then
            echo "All selected source artifacts already exist in S3; skipping toolchain setup"
          fi

      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          # Reclaim ~25-30GB of unused preinstalled SDKs and move heavy build
          # trees to the large /mnt volume so multi-version source builds don't
          # exhaust the ~20GB root volume ("No space left on device").
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/local/lib/node_modules /usr/share/miniconda \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell || true
          sudo mkdir -p /mnt/buildkit && sudo chown "$(id -u):$(id -g)" /mnt/buildkit
          echo "BUILDKIT_ROOT=/mnt/buildkit" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected Xcode: $XCODE_PATH"
          else
            echo "No Xcode 26.x found, using default"
          fi
          swift --version
          xcodebuild -version

      - name: Select managed native build tools
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        id: build-tools
        shell: bash
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"

      - name: Install native build tools through Pantry
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        uses: ./packages/action
        with:
          install: 'false'
          packages: ${{ steps.build-tools.outputs.packages }}

      - name: Verify managed native tool identities
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        shell: bash
        run: |
          bun packages/ts-pantry/scripts/native-publisher-toolchain.ts
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "LD=ld" >> "$GITHUB_ENV"

      - name: Build multi-version packages
        if: steps.source-preflight.outputs.needs_build != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/ts-pantry

          MAX_VERSIONS="${{ github.event.inputs.max-versions || '5' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          ARGS="-b $S3_BUCKET -r $AWS_REGION --platform ${{ matrix.platform.name }} --multi-version --max-versions $MAX_VERSIONS"
          # Download-first: mirror pkgx's official prebuilt instead of compiling.
          # Source build only happens for custom-build domains.
          # or when pkgx has no artifact — keeps macOS runner time minimal.
          ARGS="$ARGS --pkgx-mirror"

          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          PACKAGES="${{ github.event.inputs.packages }}"
          PACKAGES="${PACKAGES// /,}"
          ARGS="$ARGS -p $PACKAGES"

          echo "Running: bun scripts/build-all-packages.ts $ARGS"
          bun scripts/build-all-packages.ts $ARGS
        timeout-minutes: 180

  repair-targeted-metadata:
    name: Repair targeted package metadata
    needs: build-targeted
    if: always() && github.event.inputs.packages != '' && github.event.inputs.packages != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install dependencies
        run: bun install

      - name: Rebuild metadata from registry objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PANTRY_LEGACY_SCAN_ATTESTATION_CUTOFF: ${{ vars.PANTRY_LEGACY_SCAN_ATTESTATION_CUTOFF }}
          PANTRY_REQUIRE_BINARY_SCAN_ATTESTATION: ${{ vars.PANTRY_REQUIRE_BINARY_SCAN_ATTESTATION }}
        run: |
          packages="${{ github.event.inputs.packages }}"
          packages="${packages// /,}"
          cd packages/ts-pantry
          bun scripts/verify-binary-metadata.ts \
            --bucket "$S3_BUCKET" \
            --region "$AWS_REGION" \
            --package "$packages" \
            --repair

  # Batch multi-version builds (full run)
  build:
    name: Build batch ${{ matrix.batch }} (${{ matrix.platform.name }})
    needs: discover
    if: (github.event.inputs.packages == '' || github.event.inputs.packages == null) && needs.discover.outputs.total != '0'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        batch: ${{ fromJson(needs.discover.outputs.batches) }}
        platform:
          - os: macos-15
            name: darwin-arm64
          - os: ubuntu-latest
            name: linux-x86-64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install dependencies
        run: bun install

      - name: Preflight source build
        id: source-preflight
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          cd packages/ts-pantry

          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force enabled; build tools are required"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAX_VERSIONS="${{ github.event.inputs.max-versions || '5' }}"
          ARGS="-b $S3_BUCKET -r $AWS_REGION --batch ${{ matrix.batch }} --batch-size 25 --platform ${{ matrix.platform.name }} --multi-version --max-versions $MAX_VERSIONS"
          NEEDS_BUILD=$(bun scripts/build-all-packages.ts $ARGS --needs-build | tail -1)
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          if [ "$NEEDS_BUILD" = "false" ]; then
            echo "All selected source artifacts already exist in S3; skipping toolchain setup"
          fi

      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          # Reclaim ~25-30GB of unused preinstalled SDKs and move heavy build
          # trees to the large /mnt volume so multi-version source builds don't
          # exhaust the ~20GB root volume ("No space left on device").
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/local/lib/node_modules /usr/share/miniconda \
            /usr/local/graalvm /usr/local/share/chromium /usr/local/share/powershell || true
          sudo mkdir -p /mnt/buildkit && sudo chown "$(id -u):$(id -g)" /mnt/buildkit
          echo "BUILDKIT_ROOT=/mnt/buildkit" >> "$GITHUB_ENV"
          df -h / /mnt

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS' && steps.source-preflight.outputs.needs_build != 'false'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected Xcode: $XCODE_PATH"
          else
            echo "No Xcode 26.x found, using default"
          fi
          swift --version
          xcodebuild -version

      - name: Select managed native build tools
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        id: build-tools
        shell: bash
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"

      - name: Install native build tools through Pantry
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        uses: ./packages/action
        with:
          install: 'false'
          packages: ${{ steps.build-tools.outputs.packages }}

      - name: Verify managed native tool identities
        if: runner.os != 'Windows' && steps.source-preflight.outputs.needs_build != 'false'
        shell: bash
        run: |
          bun packages/ts-pantry/scripts/native-publisher-toolchain.ts
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "LD=ld" >> "$GITHUB_ENV"

      - name: Build batch ${{ matrix.batch }} (multi-version)
        if: steps.source-preflight.outputs.needs_build != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/ts-pantry

          MAX_VERSIONS="${{ github.event.inputs.max-versions || '5' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          ARGS="-b $S3_BUCKET -r $AWS_REGION --batch ${{ matrix.batch }} --batch-size 25 --platform ${{ matrix.platform.name }} --multi-version --max-versions $MAX_VERSIONS"
          # Download-first: mirror pkgx's official prebuilt instead of compiling.
          # Source build only happens for custom-build domains.
          # or when pkgx has no artifact — keeps macOS runner time minimal.
          ARGS="$ARGS --pkgx-mirror"

          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: bun scripts/build-all-packages.ts $ARGS"
          bun scripts/build-all-packages.ts $ARGS
        timeout-minutes: 170

  notify:
    name: discord-failure-alert
    needs: [build-targeted, build]
    if: always() && (needs.build-targeted.result == 'failure' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build fields
        id: fields
        run: |
          FIELDS="["
          FIRST=true
          for pair in "Build Targeted:${{ needs.build-targeted.result }}" "Build Batches:${{ needs.build.result }}"; do
            NAME="${pair%%:*}"
            VAL="${pair##*:}"
            [ "$VAL" = "skipped" ] && continue
            [ "$FIRST" = "true" ] && FIRST=false || FIELDS="$FIELDS,"
            FIELDS="$FIELDS{\"name\":\"$NAME\",\"value\":\"$VAL\",\"inline\":true}"
          done
          FIELDS="$FIELDS,{\"name\":\"Max Versions\",\"value\":\"${{ github.event.inputs.max-versions || '5' }}\",\"inline\":true}]"
          echo "json=$FIELDS" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/discord-notify
        with:
          title: Build Versions — Failed
          description: Multi-version build failed
          status: failure
          fields: ${{ steps.fields.outputs.json }}
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
