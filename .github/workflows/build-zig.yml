name: Build Zig (All Platforms)

on:
  push:
    branches: [main]
    paths:
      - 'packages/zig/**'
      - '.github/workflows/build-zig.yml'
  pull_request:
    paths:
      - 'packages/zig/**'
      - '.github/workflows/build-zig.yml'
  workflow_dispatch:

concurrency:
  group: build-zig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-all:
    name: compile-all
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry and Zig from the registry
        uses: ./packages/action
        with:
          packages: ziglang.org@0.17.0-dev

      - name: Install Zig package dependencies
        working-directory: packages/zig
        run: pantry install --no-save

      - name: Build for All Platforms
        run: |
          set -e
          cd packages/zig
          echo "→ Compiling pantry for all platforms (ReleaseFast, ~5-15 min)…"
          zig build compile-all --summary all

      - name: Verify critical targets
        run: |
          set -e
          cd packages/zig/zig-out/bin
          echo "Built binaries:"
          ls -la
          for required in linux-x86_64 macos-aarch64; do
            if [ ! -d "$required" ]; then
              echo "::error::Required target $required not found"
              exit 1
            fi
          done
