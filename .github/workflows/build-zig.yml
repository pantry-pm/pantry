name: Build Zig (All Platforms)

on:
  push:
    branches: [main]
    paths:
      - 'packages/zig/**'
      - '.github/workflows/build-zig.yml'
  pull_request:
    paths:
      - 'packages/zig/**'
      - '.github/workflows/build-zig.yml'
  workflow_dispatch:

concurrency:
  group: build-zig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-all:
    name: compile-all
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # Let the action install the complete workspace. Passing only Zig switches
      # the action into explicit-package mode and omits zig-cli, zig-config, and
      # zig-test-framework, which build.zig imports from the Pantry directory.
      # The workspace manifest declares the supported stable compiler.
      - name: Setup Pantry and workspace dependencies
        uses: ./packages/action

      - name: Restore and verify the declared Git compiler inputs
        run: |
          cd packages/zig
          zig build -Doptimize=Debug -j2
          cd ../..
          packages/zig/zig-out/bin/pantry install --ignore-scripts
          bun .github/scripts/verify-workspace-toolchain.ts
          git diff --exit-code -- pantry.lock bun.lock

      - name: Verify native copy modes and Windows argument parsing
        working-directory: packages/zig
        run: |
          zig test src/io_helper.zig -lc --test-filter 'buffered copies'
          zig test src/io_helper.zig -lc --test-filter 'Windows arguments'
          zig test src/packages/semver.zig -lc --test-filter 'conjunctive'
          zig build test:executables

      - name: Build for All Platforms
        run: |
          set -e
          cd packages/zig
          echo "→ Compiling pantry for all platforms (ReleaseFast, ~5-15 min)…"
          zig build compile-all --summary all

      - name: Verify critical targets
        run: |
          set -e
          cd packages/zig/zig-out/bin
          echo "Built binaries:"
          ls -la
          for required in linux-x86_64 macos-aarch64; do
            if [ ! -d "$required" ]; then
              echo "::error::Required target $required not found"
              exit 1
            fi
          done

      - name: Verify the compiled Linux CLI and platform-specific Git programs
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/linux-x86_64/pantry
        run: bun .github/scripts/linux-native-tools.ts

      - name: Retain native Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-tools
          path: artifacts/linux-native-tools
          if-no-files-found: error

      - name: Retain the compiled Windows CLI for native verification
        uses: actions/upload-artifact@v4
        with:
          name: compiled-windows-cli
          path: packages/zig/zig-out/bin/windows-x86_64/pantry.exe
          if-no-files-found: error

  windows-native:
    name: Native Windows CLI and compiler links
    needs: compile-all
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap published Bun through Pantry
        uses: pantry-pm/pantry/packages/action@41c32f5ecb58b5494e63f8606be787d93b01a18a # v0.11.89
        with:
          version: 0.11.89
          install: 'false'
          packages: bun.com@1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: compiled-windows-cli
          path: ${{ runner.temp }}/pantry-compiled-cli
      - name: Verify source SDK links and the compiled native CLI
        env:
          PANTRY_TEST_CLI: ${{ runner.temp }}/pantry-compiled-cli/pantry.exe
        run: bun .github/scripts/windows-native-tools.ts
      - name: Retain native Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-tools
          path: artifacts/windows-native-tools
          if-no-files-found: error
