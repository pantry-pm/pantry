name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/registry/src/**'
      - 'packages/registry/dashboard/**'
      - 'packages/registry/site/**'
      - 'public/install.sh'
      - 'docs/**'
      - 'infrastructure/rpx/**'
      - '.config/bunpress.ts'
      # Re-deploy when the deploy workflow itself changes.
      - '.github/workflows/deploy-registry.yml'
      # Root deps: stx + crosswind transitively render the site, so any
      # dependency bump can change what gets served. Re-deploy on lockfile
      # changes too — see CLAUDE.md "Site CSS pinning" for the v0.2.0 incident.
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to registry server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGISTRY_SSH_KEY }}
          # Repository variables, so a fork deploys to its own box by setting
          # them rather than editing this file (see docs/self-hosting.md). The
          # host is public DNS, not a secret — it belongs in a variable.
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry.pantry.dev' }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || 'root' }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH || '/opt/pantry-registry/repo' }}
          REGISTRY_SERVICE: ${{ vars.REGISTRY_SERVICE || 'pantry-registry' }}
          REGISTRY_PORT: ${{ vars.REGISTRY_PORT || '3001' }}
        run: |
          # Create the key file with a 0600 umask before writing so it is
          # never readable by other users for any window of time, and use
          # stdin + heredoc rather than passing the secret as an argument.
          mkdir -p ~/.ssh
          (umask 077 && cat > ~/.ssh/id_rsa <<< "$SSH_PRIVATE_KEY")
          ssh-keyscan -H "$REGISTRY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy user defaults to root: minimal cloud images log in as root
          # and don't ship sudo. The remote script takes its paths as arguments
          # so the heredoc can stay quoted — an unquoted one would expand the
          # remote script's own variables here on the runner.
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectionAttempts=5 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${REGISTRY_USER}@${REGISTRY_HOST}" \
            "bash -s -- '${REGISTRY_PATH}' '${REGISTRY_SERVICE}' '${REGISTRY_PORT}'" << 'EOF'
            set -e
            REPO_PATH="$1"
            SERVICE="$2"
            PORT="$3"

            BUN=$(command -v bun || echo /root/.bun/bin/bun)

            cd "$REPO_PATH"

            git config --global --add safe.directory "$REPO_PATH"
            git checkout -- bun.lock 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            "$BUN" install

            # Build bunpress docs (served at /docs). Project-local bunpress finds
            # crosswind from the root node_modules.
            "$BUN" ./node_modules/@stacksjs/bunpress/dist/bin/cli.js build docs || echo "::warning::Docs build failed — check bunpress/crosswind"

            # Stop the old standalone site service if it lingers (merged into registry).
            systemctl stop pantry-site 2>/dev/null || true
            systemctl disable pantry-site 2>/dev/null || true

            systemctl restart "$SERVICE"
            sleep 2
            curl -sf "http://localhost:${PORT}/health" || echo "Health check failed"

            # Publish route ownership through ts-cloud's additive gateway-fragment
            # boundary, so each app updates only its own file and a co-hosted
            # deploy can't erase this one. Only applies where the rpx gateway is
            # the proxy — a deployment fronted by Caddy/nginx skips it.
            if [ -d /etc/rpx ]; then
              install -d -m 0755 /etc/rpx/sites.d
              RPX_FRAGMENT_TMP=$(mktemp /etc/rpx/sites.d/pantry.json.XXXXXX)
              install -m 0600 infrastructure/rpx/pantry.json "$RPX_FRAGMENT_TMP"
              mv -f "$RPX_FRAGMENT_TMP" /etc/rpx/sites.d/pantry.json
              systemctl restart rpx-gateway
            fi
          EOF

      - name: Verify deployment
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL || format('https://{0}', vars.REGISTRY_HOST || 'registry.pantry.dev') }}
        run: |
          # Poll /health for up to ~60s instead of a single shot: `systemctl
          # restart pantry-registry` returns before the new process is accepting
          # connections, so a single curl races the restart and 404s/000s even
          # though the deploy is fine (this failed the v0.10.4 deploy at 04:54).
          HTTP_CODE=000
          for attempt in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${REGISTRY_URL}/health" \
              --max-time 15 2>/dev/null) || true
            [ "$HTTP_CODE" = "200" ] && break
            echo "Health check attempt $attempt: HTTP $HTTP_CODE — retrying in 5s…"
            sleep 5
          done
          echo "Health check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check returned $HTTP_CODE after retries — deployment may have failed"
            exit 1
          fi

          ACTIONS_STATUS=$(curl -fsSL \
            "${REGISTRY_URL}/api/github-actions-status" \
            --max-time 15)
          ACTIONS_ERROR=$(echo "$ACTIONS_STATUS" | jq -r '.error // ""')
          ACTIONS_RECENT=$(echo "$ACTIONS_STATUS" | jq -r '.recent | length')
          ACTIONS_RUNNING=$(echo "$ACTIONS_STATUS" | jq -r '.running')
          ACTIONS_QUEUED=$(echo "$ACTIONS_STATUS" | jq -r '.queued')
          echo "GitHub Actions status: running=$ACTIONS_RUNNING queued=$ACTIONS_QUEUED recent=$ACTIONS_RECENT"
          if [ -n "$ACTIONS_ERROR" ]; then
            echo "::error::GitHub Actions status endpoint returned error: $ACTIONS_ERROR"
            exit 1
          fi
          if [ "$ACTIONS_RECENT" -eq 0 ]; then
            echo "::error::GitHub Actions status endpoint returned no recent runs"
            exit 1
          fi

  notify:
    name: discord-notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "Registry Deploy — ${{ needs.deploy.result == 'success' && 'Deployed' || needs.deploy.result == 'cancelled' && 'Cancelled' || 'Failed' }}"
          description: "Registry server updated"
          status: ${{ needs.deploy.result == 'success' && 'success' || needs.deploy.result == 'cancelled' && 'warning' || 'failure' }}
          fields: |
            [
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
