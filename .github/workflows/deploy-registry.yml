name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/registry/src/**'
      - 'packages/registry/dashboard/**'
      - 'packages/registry/site/**'
      - 'public/install.sh'
      - 'docs/**'
      - 'infrastructure/rpx/**'
      - '.config/bunpress.ts'
      # Re-deploy when the deploy workflow itself changes.
      - '.github/workflows/deploy-registry.yml'
      # Root deps: stx + crosswind transitively render the site, so any
      # dependency bump can change what gets served. Re-deploy on lockfile
      # changes too — see CLAUDE.md "Site CSS pinning" for the v0.2.0 incident.
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to registry server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGISTRY_SSH_KEY }}
          # Repository variables, so a fork deploys to its own box by setting
          # them rather than editing this file (see docs/self-hosting.md). The
          # host is public DNS, not a secret — it belongs in a variable.
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST || 'registry.pantry.dev' }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER || 'root' }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH || '/opt/pantry-registry/repo' }}
          REGISTRY_SERVICE: ${{ vars.REGISTRY_SERVICE || 'pantry-registry' }}
          REGISTRY_PORT: ${{ vars.REGISTRY_PORT || '3001' }}
          REGISTRY_ENV_FILE: ${{ vars.REGISTRY_ENV_FILE || '/opt/pantry-registry/registry.env' }}
          # Existing artifacts predate scan attestations. Keep reads compatible
          # until the controlled backfill finishes, then set this repository
          # variable to true and dispatch one final deployment.
          BINARY_SCAN_ATTESTATION: ${{ vars.PANTRY_REQUIRE_BINARY_SCAN_ATTESTATION || 'false' }}
        run: |
          # Create the key file with a 0600 umask before writing so it is
          # never readable by other users for any window of time, and use
          # stdin + heredoc rather than passing the secret as an argument.
          mkdir -p ~/.ssh
          (umask 077 && cat > ~/.ssh/id_rsa <<< "$SSH_PRIVATE_KEY")
          ssh-keyscan -H "$REGISTRY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy user defaults to root: minimal cloud images log in as root
          # and don't ship sudo. The remote script takes its paths as arguments
          # so the heredoc can stay quoted — an unquoted one would expand the
          # remote script's own variables here on the runner.
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectionAttempts=5 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${REGISTRY_USER}@${REGISTRY_HOST}" \
            "bash -s -- '${REGISTRY_PATH}' '${REGISTRY_SERVICE}' '${REGISTRY_PORT}' '${REGISTRY_ENV_FILE}' '${GITHUB_SHA}' '${BINARY_SCAN_ATTESTATION}'" << 'EOF'
            set -euo pipefail
            REPO_PATH="$1"
            SERVICE="$2"
            PORT="$3"
            ENV_FILE="$4"
            EXPECTED_SHA="$5"
            BINARY_SCAN_ATTESTATION="$6"
            case "$BINARY_SCAN_ATTESTATION" in
              true|false) ;;
              *)
                echo "PANTRY_REQUIRE_BINARY_SCAN_ATTESTATION must be true or false" >&2
                exit 1
                ;;
            esac

            BUN=$(command -v bun || echo /root/.bun/bin/bun)

            cd "$REPO_PATH"

            git config --global --add safe.directory "$REPO_PATH"
            git checkout -- bun.lock 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            DEPLOYED_SHA=$(git rev-parse HEAD)
            if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
              echo "Expected commit $EXPECTED_SHA but checkout is $DEPLOYED_SHA" >&2
              exit 1
            fi
            "$BUN" install
            (cd packages/registry && NODE_ENV=production "$BUN" run build:server)

            # Publish-time scanning is part of Registry readiness. Provision
            # clamd on existing hosts as well as fresh registry setups.
            if ! command -v clamdscan >/dev/null 2>&1 ||
              ! command -v jq >/dev/null 2>&1; then
              command -v apt-get >/dev/null 2>&1 || {
                echo "clamav-daemon and jq are required and this host has no apt-get" >&2
                exit 1
              }
              DEBIAN_FRONTEND=noninteractive apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                clamav-daemon clamav-freshclam jq >/dev/null
            fi

            CLAM_CONF=/etc/clamav/clamd.conf
            [ -f "$CLAM_CONF" ] || {
              echo "$CLAM_CONF was not installed" >&2
              exit 1
            }
            set_clam() {
              key="$1"
              value="$2"
              if grep -Eq "^[#[:space:]]*${key}[[:space:]]+" "$CLAM_CONF"; then
                sed -Ei "s|^[#[:space:]]*${key}[[:space:]]+.*|${key} ${value}|" "$CLAM_CONF"
              else
                printf '%s %s\n' "$key" "$value" >> "$CLAM_CONF"
              fi
            }
            set_clam TCPAddr 127.0.0.1
            set_clam TCPSocket 3310
            set_clam StreamMaxLength 1G
            set_clam MaxScanSize 1G
            set_clam MaxFileSize 1G
            set_clam MaxRecursion 30
            set_clam MaxFiles 100000
            set_clam MaxThreads 2
            set_clam MaxQueue 4
            set_clam ConcurrentDatabaseReload no

            install -d -m 0755 "$(dirname "$ENV_FILE")"
            [ -f "$ENV_FILE" ] || install -m 0600 /dev/null "$ENV_FILE"
            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                awk -v k="$key" -v v="$value" \
                  '$0 ~ "^"k"=" { print k"="v; next } { print }' \
                  "$ENV_FILE" > "$ENV_FILE.tmp"
                mv "$ENV_FILE.tmp" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
              fi
            }
            set_env PANTRY_MALWARE_SCANNING required
            set_env PANTRY_REQUIRE_MALWARE_SCAN_ATTESTATION true
            set_env PANTRY_REQUIRE_BINARY_SCAN_ATTESTATION "$BINARY_SCAN_ATTESTATION"
            set_env CLAMD_SOCKET /run/clamav/clamd.ctl
            set_env CLAMD_HOST 127.0.0.1
            set_env CLAMD_PORT 3310
            set_env CLAMD_TIMEOUT_MS 120000
            set_env CLAMD_MAX_BYTES 1073741824
            set_env PANTRY_HTTP_IDLE_TIMEOUT_SECONDS 255
            if ! grep -q '^PANTRY_BINARY_STAGING_SECRET=' "$ENV_FILE"; then
              command -v openssl >/dev/null 2>&1 || {
                echo "openssl is required to generate the binary staging secret" >&2
                exit 1
              }
              set_env PANTRY_BINARY_STAGING_SECRET "$(openssl rand -hex 32)"
            fi
            chmod 600 "$ENV_FILE"

            # Ensure legacy units also consume the managed environment file.
            install -d -m 0755 "/etc/systemd/system/${SERVICE}.service.d"
            printf '%s\n' \
              '[Unit]' \
              'Requires=clamav-daemon.service' \
              'After=clamav-daemon.service' \
              '' \
              '[Service]' \
              "EnvironmentFile=$ENV_FILE" \
              > "/etc/systemd/system/${SERVICE}.service.d/malware-scanning.conf"

            # Debian package maintenance explicitly stops clamd while replacing
            # it. An explicit stop also suppresses Restart=always on dependent
            # services, so recover both services after maintenance completes.
            printf '%s\n' \
              '[Unit]' \
              'Description=Recover Pantry Registry malware scanning services' \
              'After=apt-daily-upgrade.service' \
              '' \
              '[Service]' \
              'Type=oneshot' \
              "ExecCondition=/bin/sh -c '! systemctl is-active --quiet apt-daily-upgrade.service'" \
              "ExecStart=/bin/systemctl start clamav-daemon.service ${SERVICE}.service" \
              > "/etc/systemd/system/${SERVICE}-recovery.service"
            printf '%s\n' \
              '[Unit]' \
              'Description=Periodically recover Pantry Registry malware scanning services' \
              '' \
              '[Timer]' \
              'OnBootSec=1min' \
              'OnUnitActiveSec=1min' \
              'Persistent=true' \
              "Unit=${SERVICE}-recovery.service" \
              '' \
              '[Install]' \
              'WantedBy=timers.target' \
              > "/etc/systemd/system/${SERVICE}-recovery.timer"
            systemctl daemon-reload
            systemctl enable --quiet clamav-freshclam clamav-daemon
            systemctl enable --now --quiet "${SERVICE}-recovery.timer"
            systemctl restart clamav-freshclam || true
            systemctl restart clamav-daemon
            systemctl is-active --quiet clamav-daemon

            # Build bunpress docs (served at /docs). Project-local bunpress finds
            # crosswind from the root node_modules.
            "$BUN" ./node_modules/@stacksjs/bunpress/dist/bin/cli.js build docs || echo "::warning::Docs build failed — check bunpress/crosswind"

            # Stop the old standalone site service if it lingers (merged into registry).
            systemctl stop pantry-site 2>/dev/null || true
            systemctl disable pantry-site 2>/dev/null || true

            systemctl restart "$SERVICE"
            READY=false
            for attempt in $(seq 1 20); do
              READY_STATUS=$(curl -sS "http://localhost:${PORT}/ready" || true)
              if echo "$READY_STATUS" | jq -e '.status == "ready"
                  and .malwareScanning.required == true
                  and .malwareScanning.ready == true' >/dev/null; then
                READY=true
                break
              fi
              echo "Readiness attempt $attempt: ${READY_STATUS:-no response}"
              sleep 3
            done
            if [ "$READY" != true ]; then
              systemctl status "$SERVICE" --no-pager || true
              journalctl -u "$SERVICE" -n 100 --no-pager || true
              systemctl status clamav-daemon --no-pager || true
              journalctl -u clamav-daemon -n 100 --no-pager || true
              ss -ltnp || true
              exit 1
            fi

            # End-to-end production rehearsal: clamd must detect EICAR through
            # the Registry publish route, and the API must reject it before any
            # package metadata or installable artifact can be written.
            REGISTRY_TOKEN=$(sed -n 's/^PANTRY_REGISTRY_TOKEN=//p' "$ENV_FILE" | tail -n 1)
            [ -n "$REGISTRY_TOKEN" ] || {
              echo "PANTRY_REGISTRY_TOKEN is required for the malware rehearsal" >&2
              exit 1
            }
            REHEARSAL_DIR=$(mktemp -d)
            trap 'rm -rf "$REHEARSAL_DIR"' EXIT
            mkdir -p "$REHEARSAL_DIR/package"
            printf '%s\n' \
              '{"name":"pantry-malware-rehearsal","version":"0.0.0"}' \
              > "$REHEARSAL_DIR/package/package.json"
            printf '%s' \
              'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-' \
              'STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' \
              > "$REHEARSAL_DIR/package/eicar.com"
            tar -C "$REHEARSAL_DIR" -czf "$REHEARSAL_DIR/eicar.tgz" package
            REHEARSAL_METADATA=$(printf \
              '{"name":"pantry-malware-rehearsal","version":"0.0.0","publishedAt":"%s"}' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            REHEARSAL_RESPONSE="$REHEARSAL_DIR/response.json"
            REHEARSAL_STATUS=$(curl -sS \
              -o "$REHEARSAL_RESPONSE" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $REGISTRY_TOKEN" \
              -F "metadata=$REHEARSAL_METADATA" \
              -F "tarball=@$REHEARSAL_DIR/eicar.tgz;type=application/gzip" \
              "http://localhost:${PORT}/publish")
            if [ "$REHEARSAL_STATUS" != 422 ] ||
              ! jq -e '.code == "MALWARE_DETECTED"
                and .scan.verdict == "blocked"' "$REHEARSAL_RESPONSE" >/dev/null; then
              echo "EICAR publish rehearsal failed with HTTP $REHEARSAL_STATUS" >&2
              jq '{code, retryable, scan}' "$REHEARSAL_RESPONSE" >&2 || true
              exit 1
            fi
            rm -rf "$REHEARSAL_DIR"
            trap - EXIT

            # Publish route ownership through ts-cloud's additive gateway-fragment
            # boundary, so each app updates only its own file and a co-hosted
            # deploy can't erase this one. Only applies where the rpx gateway is
            # the proxy — a deployment fronted by Caddy/nginx skips it.
            if [ -d /etc/rpx ]; then
              install -d -m 0755 /etc/rpx/sites.d
              RPX_ROUTES_CHANGED=0
              if ! cmp -s infrastructure/rpx/pantry.json /etc/rpx/sites.d/pantry.json; then
                RPX_FRAGMENT_TMP=$(mktemp /etc/rpx/sites.d/pantry.json.XXXXXX)
                install -m 0600 infrastructure/rpx/pantry.json "$RPX_FRAGMENT_TMP"
                mv -f "$RPX_FRAGMENT_TMP" /etc/rpx/sites.d/pantry.json
                RPX_ROUTES_CHANGED=1
              fi
              # pantry.json is the canonical owner of all Pantry routes. Remove
              # the pre-fragment-migration file so registry.pantry.dev cannot be
              # declared twice after an upgrade.
              if [ -e /etc/rpx/sites.d/pantry-registry.json ]; then
                rm -f /etc/rpx/sites.d/pantry-registry.json
                RPX_ROUTES_CHANGED=1
              fi
              if [ "$RPX_ROUTES_CHANGED" -eq 1 ]; then
                systemctl restart rpx-gateway
              fi
            fi
          EOF

      - name: Verify deployment
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL || format('https://{0}', vars.REGISTRY_HOST || 'registry.pantry.dev') }}
        run: |
          # Poll /ready for up to ~60s instead of a single shot: `systemctl
          # restart pantry-registry` returns before the new process is accepting
          # connections, so a single curl races the restart and 404s/000s even
          # though the deploy is fine (this failed the v0.10.4 deploy at 04:54).
          HTTP_CODE=000
          for attempt in $(seq 1 12); do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${REGISTRY_URL}/ready" \
              --max-time 15 2>/dev/null) || true
            [ "$HTTP_CODE" = "200" ] && break
            echo "Readiness attempt $attempt: HTTP $HTTP_CODE — retrying in 5s…"
            sleep 5
          done
          echo "Readiness check: HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Readiness check returned $HTTP_CODE after retries — deployment failed"
            exit 1
          fi

          READY_STATUS=$(curl -fsSL "${REGISTRY_URL}/ready" --max-time 15)
          echo "$READY_STATUS" | jq -e '.status == "ready"
            and .malwareScanning.required == true
            and .malwareScanning.ready == true'

          ACTIONS_STATUS=$(curl -fsSL \
            "${REGISTRY_URL}/api/github-actions-status" \
            --max-time 15)
          ACTIONS_ERROR=$(echo "$ACTIONS_STATUS" | jq -r '.error // ""')
          ACTIONS_RECENT=$(echo "$ACTIONS_STATUS" | jq -r '.recent | length')
          ACTIONS_RUNNING=$(echo "$ACTIONS_STATUS" | jq -r '.running')
          ACTIONS_QUEUED=$(echo "$ACTIONS_STATUS" | jq -r '.queued')
          echo "GitHub Actions status: running=$ACTIONS_RUNNING queued=$ACTIONS_QUEUED recent=$ACTIONS_RECENT"
          if [ -n "$ACTIONS_ERROR" ]; then
            echo "::error::GitHub Actions status endpoint returned error: $ACTIONS_ERROR"
            exit 1
          fi
          if [ "$ACTIONS_RECENT" -eq 0 ]; then
            echo "::error::GitHub Actions status endpoint returned no recent runs"
            exit 1
          fi

  notify:
    name: discord-notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "Registry Deploy — ${{ needs.deploy.result == 'success' && 'Deployed' || needs.deploy.result == 'cancelled' && 'Cancelled' || 'Failed' }}"
          description: "Registry server updated"
          status: ${{ needs.deploy.result == 'success' && 'success' || needs.deploy.result == 'cancelled' && 'warning' || 'failure' }}
          fields: |
            [
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
