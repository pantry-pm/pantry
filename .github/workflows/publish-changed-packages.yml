name: Publish Changed Packages

# Auto-publish to the pantry registry whenever a commit changes a package's
# recipe or metadata — including the automated version bumps pushed by
# `update-packages.yml`. Builds FROM SOURCE (no --pkgx-mirror) so the published
# binaries are linked against current libraries and actually run on modern
# distros, rather than re-mirroring stale pkgx prebuilts.
on:
  push:
    branches: [main]
    paths:
      - 'packages/ts-pantry/src/recipes/**'
      - 'packages/ts-pantry/src/packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Domains to build (space/comma separated). Empty = autodetect from the push diff.'
        required: false
        type: string
      max-versions:
        description: 'Max versions per package to (re)build.'
        required: false
        default: '3'
        type: string

concurrency:
  group: publish-changed-${{ github.ref }}
  cancel-in-progress: false

env:
  # Authenticated build-status reporting (same ptry_ registry token).
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage (defaults to AWS S3; repo vars point it at Hetzner).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.detect.outputs.domains }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed package domains
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          MANUAL="${{ github.event.inputs.packages }}"
          if [ -n "$MANUAL" ]; then
            DOMAINS=$(echo "$MANUAL" | tr ', ' '\n' | sed '/^$/d')
          else
            BEFORE="${{ github.event.before }}"
            # New branch / unknown base ⇒ fall back to the last commit.
            case "$BEFORE" in ''|0000000000000000000000000000000000000000) BEFORE="${{ github.sha }}~1" ;; esac
            FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- \
              'packages/ts-pantry/src/recipes/**' 'packages/ts-pantry/src/packages/**' || true)
            DOMAINS=""
            for f in $FILES; do
              case "$f" in
                # Recipe path under recipes/ IS the domain — including nested
                # ones (recipes/redis.io.ts → redis.io;
                # recipes/mariadb.com/server.ts → mariadb.com/server;
                # recipes/gnu.org/readline.ts → gnu.org/readline).
                */recipes/*.ts) d=$(echo "$f" | sed -E 's#.*/recipes/##; s#\.ts$##') ;;
                # Metadata files (e.g. redisio.ts) carry an explicit `domain:` field.
                */packages/*.ts) d=$(grep -oE "domain: '[^']+'" "$f" | head -1 | sed "s/domain: '//; s/'//") ;;
                *) d="" ;;
              esac
              [ -n "$d" ] && DOMAINS="$DOMAINS"$'\n'"$d"
            done
          fi
          DOMAINS=$(echo "$DOMAINS" | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "Detected changed packages: ${DOMAINS:-<none>}"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

  build:
    name: Source-build + publish (${{ matrix.platform.name }})
    needs: detect
    if: needs.detect.outputs.domains != ''
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86-64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libreadline-dev zlib1g-dev libssl-dev \
            cmake meson ninja-build patchelf pkg-config \
            autoconf automake libtool gettext intltool \
            libffi-dev libexpat1-dev libbz2-dev liblzma-dev \
            libncurses5-dev libsqlite3-dev \
            python3-venv python3-pip python3-dev \
            libcurl4-openssl-dev libxml2-dev libonig-dev \
            ruby ruby-dev scons \
            gperf bison flex texinfo nasm yasm \
            libgmp-dev libmpfr-dev libmpc-dev \
            libuv1-dev libpcre2-dev libevent-dev \
            libglib2.0-dev libpixman-1-dev \
            libgit2-dev libssh2-1-dev libhttp-parser-dev \
            libasound2-dev libdbus-1-dev libsystemd-dev \
            protobuf-compiler libprotobuf-dev \
            nettle-dev libp11-kit-dev \
            libboost-all-dev libsndfile1-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libfreetype-dev libharfbuzz-dev \
            libltdl-dev libacl1-dev libattr1-dev \
            liblz4-dev libzstd-dev libxxhash-dev \
            libyaml-dev libjansson-dev \
            libedit-dev libelf-dev \
            tcl-dev tk-dev \
            libunwind-dev libdw-dev \
            libzip-dev liblapack-dev gfortran \
            python3-lxml python3-libxml2 \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxinerama-dev libxcomposite-dev libxdamage-dev \
            libxcursor-dev libxi-dev libxtst-dev \
            libxmu-dev libxt-dev libxaw7-dev libxres-dev \
            libsm-dev libice-dev libxpm-dev \
            libxxf86vm-dev libxshmfence-dev libxv-dev libxss-dev \
            x11proto-dev xtrans-dev xutils-dev xauth \
            libxkbcommon-dev libxkbfile-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-image0-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libwayland-dev libfontconfig1-dev \
            gobject-introspection libgirepository1.0-dev \
            libatk1.0-dev libcairo2-dev libcairo-gobject2 \
            libpango1.0-dev libgtk-3-dev \
            librsvg2-dev libsecret-1-dev libjson-glib-dev \
            libsoup2.4-dev libgdk-pixbuf-2.0-dev \
            libva-dev libegl-dev libgbm-dev libdrm-dev \
            libgl-dev libglu1-mesa-dev \
            clang llvm-dev libclang-dev \
            libgnutls28-dev liblua5.4-dev \
            libcap-dev libcap-ng-dev libslirp-dev libssh-dev \
            libspeexdsp-dev libmaxminddb-dev libsmi2-dev \
            libc-ares-dev libre2-dev libpcap-dev \
            libnl-3-dev libnl-genl-3-dev \
            libpam0g-dev libudev-dev \
            libarchive-dev libusb-1.0-0-dev \
            libjemalloc-dev libvterm-dev \
            libxslt1-dev \
            libsdl2-dev libplist-dev \
            libassuan-dev libgpg-error-dev \
            libfido2-dev \
            libdouble-conversion-dev libgoogle-glog-dev libgflags-dev \
            libsodium-dev liblzo2-dev libsnappy-dev libbrotli-dev \
            doxygen xsltproc docbook-xsl xmlto

      - name: Source-build + publish changed packages
        working-directory: packages/ts-pantry
        shell: bash
        run: |
          set -o pipefail
          DOMAINS="${{ needs.detect.outputs.domains }}"
          PKGS=$(echo "$DOMAINS" | tr ' ' ',')
          MAXV="${{ github.event.inputs.max-versions || '3' }}"
          echo "Source-building (NO pkgx-mirror) and publishing: $PKGS"
          # No --pkgx-mirror ⇒ compile from the recipe so binaries link current
          # libs. --force re-uploads even if a (stale, mirrored) artifact exists.
          bun scripts/build-all-packages.ts \
            -b "$S3_BUCKET" -r "$S3_REGION" \
            --platform "${{ matrix.platform.name }}" \
            -p "$PKGS" --multi-version --max-versions "$MAXV" --force
