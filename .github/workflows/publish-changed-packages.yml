name: Publish Changed Packages

# Auto-publish to the pantry registry whenever a commit changes a package's
# recipe or metadata — including the automated version bumps pushed by
# `update-packages.yml` (which dispatches this workflow explicitly). Runs
# UBUNTU-ONLY and DOWNLOAD-FIRST: --pkgx-mirror mirrors pkgx's official prebuilt
# and only source-builds packages pkgx lacks or that we deliberately customize
# (such as php/postgres/curl, on the native linux legs). macOS runners are never spun up
# here — darwin-arm64 is produced from ubuntu via --mirror-only.
on:
  push:
    branches: [main]
    paths:
      - 'packages/ts-pantry/src/recipes/**'
      - 'packages/ts-pantry/src/packages/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Domains to build (space/comma separated). Empty = autodetect from the push diff.'
        required: false
        type: string
      max-versions:
        description: 'Max versions per package to (re)build.'
        required: false
        default: '3'
        type: string
      popular-max-versions:
        description: 'Max versions for popular packages. Set explicitly for targeted rebuilds.'
        required: false
        default: '20'
        type: string
      rebuild-existing:
        description: 'Re-upload versions already in S3 (--force). Needed after a recipe change; wasteful for a pure version bump.'
        required: false
        default: true
        type: boolean

concurrency:
  # Per-RUN group (not per-ref): update-packages.yml dispatches this once per
  # version-bump commit — often several times an hour. A shared `github.ref`
  # group collapses them all into ONE queue slot, and each new dispatch cancels
  # the previously-pending one, so intermediate updates get silently dropped and
  # never publish. Giving every run its own group lets each version bump publish
  # independently (each targets a specific, small package set). Re-uploads are
  # idempotent (--force, last-write-wins), so concurrent runs are safe.
  group: publish-changed-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Authenticated build-status reporting (same ptry_ registry token).
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage (defaults to AWS S3; repo vars point it at Hetzner).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  # Per-package build-script timeout (ms). Default is 60 min; the full mysql
  # server compile needs ~90 min, so raise it to 180 min for the heavy builds.
  BUILD_SCRIPT_TIMEOUT_MS: '10800000'

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.detect.outputs.domains }}
      darwin_native: ${{ steps.darwin.outputs.domains }}
      # 'true' unless we positively established that this push touched no
      # recipe file. Drives whether the publish legs pass --force.
      rebuild_existing: ${{ steps.detect.outputs.rebuild_existing }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: ./packages/action
        with:
          install: 'false'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Determine changed package domains
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          MANUAL="${{ github.event.inputs.packages }}"
          if [ -n "$MANUAL" ]; then
            DOMAINS=$(echo "$MANUAL" | tr ', ' '\n' | sed '/^$/d')
          else
            BEFORE="${{ github.event.before }}"
            # New branch / unknown base ⇒ fall back to the last commit.
            case "$BEFORE" in ''|0000000000000000000000000000000000000000) BEFORE="${{ github.sha }}~1" ;; esac
            # Compare parsed version arrays rather than the declaration line.
            # Version lists are multiline, so line-based detection misses the
            # normal case where the updater inserts a new array item.
            DOMAINS=$(bun packages/ts-pantry/scripts/changed-package-domains.ts \
              "$BEFORE" "${{ github.sha }}")
          fi
          DOMAINS=$(echo "$DOMAINS" | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "Detected changed packages: ${DOMAINS:-<none>}"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

          # Should the legs re-upload versions that are ALREADY in S3?
          #
          # For a plain version bump: no. The new version is missing from S3 and
          # gets built either way; --force only re-does the whole back catalogue.
          # A single cmake.org bump had each of the three legs upload 20 versions
          # when 3 were missing, turning a few minutes of work into 21-29.
          #
          # For a RECIPE change: yes, and this is why the flag exists. When
          # curl.se moved from OpenSSL ^1.1 to ^3, every already-published curl
          # needed rebuilding against the new recipe; skipping them would leave
          # the registry serving artifacts built from a recipe that no longer
          # exists.
          #
          # Fail-safe: default to forcing. We only drop --force when the diff
          # positively shows no recipe file was touched — an unknown base, a
          # manual dispatch, or any git failure keeps the rebuild. Guessing
          # "no rebuild" wrongly is a silent staleness bug; guessing "rebuild"
          # wrongly just costs runner minutes.
          REBUILD=true
          if [ "${{ github.event.inputs.rebuild-existing }}" = "false" ]; then
            # A caller that knows it only bumped versions says so outright.
            # update-packages.yml does exactly that: it commits src/packages/
            # and nothing else, then dispatches this workflow.
            REBUILD=false
          elif [ -z "$MANUAL" ] && [ -n "${BEFORE:-}" ]; then
            if RECIPE_DIFF=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- packages/ts-pantry/src/recipes/ 2>/dev/null); then
              if [ -z "$RECIPE_DIFF" ]; then
                REBUILD=false
              fi
            fi
          fi
          echo "Re-upload versions already in S3 (--force): $REBUILD"
          echo "rebuild_existing=$REBUILD" >> "$GITHUB_OUTPUT"

      # Which changed domains genuinely need a NATIVE macOS build: source recipes
      # (not zig-style download recipes) that support darwin and aren't apps. The
      # ubuntu legs cover pkgx-prebuilt + download-recipe darwin artifacts; only
      # these source recipes require a real Mac (they can't cross-compile on
      # linux). Empty ⇒ the darwin-native macOS job is skipped, so no Mac runner
      # is allocated for the common case (pure pkgx/download updates).
      - name: Determine darwin-native domains
        id: darwin
        working-directory: packages/ts-pantry
        shell: bash
        run: |
          DOMAINS="${{ steps.detect.outputs.domains }}"
          if [ -z "$DOMAINS" ]; then echo "domains=" >> "$GITHUB_OUTPUT"; exit 0; fi
          PKGS=$(echo "$DOMAINS" | tr ' ' ',')
          # --exclude-pkgx-covered drops any domain whose every selected
          # version pkgx already ships for darwin — the ubuntu mirror leg
          # publishes those, so a Mac would only duplicate it. (cmake.org did
          # exactly that: both legs uploaded the identical 4.4.3, 4.3.5 and
          # 4.2.8 artifacts, and the Mac added nothing.) The probe fails
          # CLOSED, so an unreachable dist.pkgx.dev costs a redundant runner
          # rather than a silently missing darwin artifact.
          NATIVE=$(bun scripts/build-all-packages.ts \
            --platform darwin-arm64 -p "$PKGS" --source-only --print-selected --exclude-pkgx-covered 2>/dev/null | tr -s ' ' | sed 's/^ *//; s/ *$//')
          echo "darwin-native (need a real Mac): ${NATIVE:-<none>}"
          echo "domains=$NATIVE" >> "$GITHUB_OUTPUT"

  build:
    name: Publish (${{ matrix.platform.name }})
    needs: detect
    if: needs.detect.outputs.domains != ''
    runs-on: ${{ matrix.platform.os }}
    # Download-first (--pkgx-mirror) is seconds per package; the headroom is for
    # the CUSTOM source fallbacks (php/mysql/postgres) that DO compile on the
    # native linux legs (mysql 8.0.43 reached 64% in ~60 min of compile).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # Download-first, ubuntu-only (this job never spins up a macOS runner):
        #  - linux legs: --pkgx-mirror ⇒ mirror pkgx's official prebuilt, and
        #    fall back to a SOURCE build only for packages pkgx lacks or that we
        #    deliberately customize. Those compile natively here,
        #    so the legs need the build toolchain.
        #  - darwin-arm64 FROM UBUNTU: two download passes (pkgx --mirror-only,
        #    then --download-only for zig-style recipes) — see the build step.
        #    No source-build, no cross-compile, no Mac. Genuine darwin SOURCE
        #    recipes go to the gated publish-darwin-native job below.
        platform:
          - { name: linux-x86-64, os: ubuntu-latest, needs_toolchain: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, needs_toolchain: true }
          - { name: darwin-arm64, os: ubuntu-latest, needs_toolchain: false }
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Install build tools (Linux)
        # Only the linux legs need the toolchain (for the custom source fallbacks
        # under --pkgx-mirror). The darwin-arm64 --mirror-only leg just downloads
        # the pkgx prebuilt, so skip the ~5-min apt install there.
        if: runner.os == 'Linux' && matrix.platform.needs_toolchain
        env:
          # Without this a transitively-pulled package (tzdata, x11, …) opens an
          # interactive debconf prompt and apt hangs forever — which is what
          # stalled the x86-64 runner for an hour until the 120-min job timeout.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Retry the index refresh — GitHub's apt mirrors occasionally stall.
          for i in 1 2 3; do sudo -E apt-get update -y && break; sleep 5; done
          # `-E` keeps DEBIAN_FRONTEND across sudo; --no-install-recommends keeps
          # the (already huge) install lean and avoids prompt-triggering extras.
          sudo -E apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confnew \
            build-essential libreadline-dev zlib1g-dev libssl-dev \
            cmake meson ninja-build patchelf pkg-config \
            autoconf automake libtool gettext intltool \
            libffi-dev libexpat1-dev libbz2-dev liblzma-dev \
            libncurses5-dev libsqlite3-dev \
            python3-venv python3-pip python3-dev \
            libcurl4-openssl-dev libxml2-dev libonig-dev \
            ruby ruby-dev scons \
            gperf bison flex texinfo nasm yasm \
            libgmp-dev libmpfr-dev libmpc-dev \
            libuv1-dev libpcre2-dev libevent-dev \
            libglib2.0-dev libpixman-1-dev \
            libgit2-dev libssh2-1-dev libhttp-parser-dev \
            libasound2-dev libdbus-1-dev libsystemd-dev \
            protobuf-compiler libprotobuf-dev \
            nettle-dev libp11-kit-dev \
            libboost-all-dev libsndfile1-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libfreetype-dev libharfbuzz-dev \
            libltdl-dev libacl1-dev libattr1-dev \
            liblz4-dev libzstd-dev libxxhash-dev \
            libyaml-dev libjansson-dev \
            libedit-dev libelf-dev \
            tcl-dev tk-dev \
            libunwind-dev libdw-dev \
            libzip-dev liblapack-dev gfortran \
            python3-lxml python3-libxml2 \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxinerama-dev libxcomposite-dev libxdamage-dev \
            libxcursor-dev libxi-dev libxtst-dev \
            libxmu-dev libxt-dev libxaw7-dev libxres-dev \
            libsm-dev libice-dev libxpm-dev \
            libxxf86vm-dev libxshmfence-dev libxv-dev libxss-dev \
            x11proto-dev xtrans-dev xutils-dev xauth \
            libxkbcommon-dev libxkbfile-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-image0-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libwayland-dev libfontconfig1-dev \
            gobject-introspection libgirepository1.0-dev \
            libatk1.0-dev libcairo2-dev libcairo-gobject2 \
            libpango1.0-dev libgtk-3-dev \
            librsvg2-dev libsecret-1-dev libjson-glib-dev \
            libsoup2.4-dev libgdk-pixbuf-2.0-dev \
            libva-dev libegl-dev libgbm-dev libdrm-dev \
            libgl-dev libglu1-mesa-dev \
            clang llvm-dev libclang-dev \
            libgnutls28-dev liblua5.4-dev \
            libcap-dev libcap-ng-dev libslirp-dev libssh-dev \
            libspeexdsp-dev libmaxminddb-dev libsmi2-dev \
            libc-ares-dev libre2-dev libpcap-dev \
            libnl-3-dev libnl-genl-3-dev \
            libpam0g-dev libudev-dev \
            libarchive-dev libusb-1.0-0-dev \
            libjemalloc-dev libvterm-dev \
            libxslt1-dev \
            libsdl2-dev libplist-dev \
            libassuan-dev libgpg-error-dev \
            libfido2-dev \
            libdouble-conversion-dev libgoogle-glog-dev libgflags-dev \
            libsodium-dev liblzo2-dev libsnappy-dev libbrotli-dev \
            libtirpc-dev \
            doxygen xsltproc docbook-xsl xmlto

      - name: Publish changed packages (download-first)
        working-directory: packages/ts-pantry
        shell: bash
        run: |
          set -o pipefail
          DOMAINS="${{ needs.detect.outputs.domains }}"
          PKGS=$(echo "$DOMAINS" | tr ' ' ',')
          MAXV="${{ github.event.inputs.max-versions || '3' }}"
          POPULAR_MAXV="${{ github.event.inputs.popular-max-versions || '20' }}"
          # --force only when a recipe actually changed (see the detect job).
          FORCE=""
          if [ "${{ needs.detect.outputs.rebuild_existing }}" != "false" ]; then
            FORCE="--force"
            echo "Recipe change (or manual run): re-building versions already in S3."
          else
            echo "Version bump only: leaving versions already in S3 alone."
          fi
          COMMON="-b $S3_BUCKET -r $S3_REGION --platform ${{ matrix.platform.name }} -p $PKGS --multi-version --max-versions $MAXV --popular-max-versions $POPULAR_MAXV $FORCE"
          if [ "${{ matrix.platform.name }}" = "darwin-arm64" ]; then
            # darwin FROM UBUNTU — two safe download passes, no cross-compile:
            #  1) --pkgx-mirror --mirror-only: download pkgx's darwin prebuilt (skip
            #     on a miss, never source-build).
            #  2) --download-only: run the zig-style download recipes (curl the
            #     official darwin asset + verify Mach-O/arm64 magic).
            # Together these cover every darwin artifact producible without a Mac.
            # Source recipes are handled by the gated publish-darwin-native job.
            echo "Publishing darwin-arm64 from ubuntu (pkgx mirror-only): $PKGS"
            bun scripts/build-all-packages.ts $COMMON --pkgx-mirror --mirror-only
            echo "Publishing darwin-arm64 from ubuntu (download recipes): $PKGS"
            bun scripts/build-all-packages.ts $COMMON --download-only
          else
            # linux legs: --pkgx-mirror mirrors pkgx's prebuilt and source-builds
            # (natively) only what pkgx lacks or we customize.
            echo "Publishing (download-first) $PKGS -> ${{ matrix.platform.name }}"
            bun scripts/build-all-packages.ts $COMMON --pkgx-mirror
          fi

  # Genuine darwin SOURCE recipes (pkgx has no prebuilt, not a download recipe)
  # can ONLY be produced on real Mac hardware — this ensures a darwin update is
  # published PROPERLY rather than silently skipped by the ubuntu legs. It is
  # TIGHTLY GATED: it runs only when `detect` finds such domains (so pure
  # pkgx/download updates — the common case — allocate NO macOS runner at all),
  # and it builds ONLY those domains, download-first (--pkgx-mirror, no --force),
  # so anything the ubuntu legs already published is skipped and only true
  # pkgx-misses actually compile. This is the one narrow, necessary macOS path.
  publish-darwin-native:
    name: Publish darwin-arm64 source (native macOS)
    needs: detect
    if: needs.detect.outputs.darwin_native != ''
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE_PATH" ] && sudo xcode-select -s "$XCODE_PATH" || echo "using default Xcode"
          clang --version || true

      - name: Install build tools (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install cmake meson ninja pkg-config autoconf automake libtool gettext gnu-sed \
            pcre2 libyaml openssl@3 readline sqlite xz zlib || true
          brew link --force libtool autoconf automake meson gnu-sed 2>/dev/null || true

      - name: Setup Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Source-build + publish darwin-arm64 (native)
        working-directory: packages/ts-pantry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          PKGS=$(echo "${{ needs.detect.outputs.darwin_native }}" | tr ' ' ',')
          MAXV="${{ github.event.inputs.max-versions || '3' }}"
          POPULAR_MAXV="${{ github.event.inputs.popular-max-versions || '20' }}"
          # --source-only (download recipes are the fleet's job) + --pkgx-mirror
          # (download-first: grab pkgx's darwin prebuilt when it exists, else
          # compile natively). NO --force ⇒ skip what the ubuntu legs already
          # published; only genuine pkgx-misses actually compile here.
          echo "Native darwin-arm64 source build + publish: $PKGS"
          bun scripts/build-all-packages.ts \
            -b "$S3_BUCKET" -r "$S3_REGION" \
            --platform darwin-arm64 \
            -p "$PKGS" --source-only --pkgx-mirror --multi-version --max-versions "$MAXV" --popular-max-versions "$POPULAR_MAXV"
