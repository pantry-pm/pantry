name: Publish Changed Packages
run-name: ${{ inputs.request-id && format('catalog:{0}:{1}:{2}:{3}', inputs.request-id, inputs.source-sha, inputs.platform, inputs.verify-tools-only) || 'Publish Changed Packages' }}

# Auto-publish to the pantry registry whenever a commit changes a package's
# recipe or metadata — including the automated version bumps pushed by
# `update-packages.yml` (via its durable publication recovery workflow).
# Download recipes run on Linux; customized source recipes run on native Linux
# and, when selected, native macOS. Pantry supplies the build tools and each
# recipe's declared dependency graph. macOS supplies its licensed Apple SDK.
on:
  push:
    branches: [main]
    paths:
      - 'packages/ts-pantry/src/recipes/**'
      - 'packages/ts-pantry/src/packages/**'
  workflow_dispatch:
    inputs:
      request-id:
        description: Durable catalog publication request ID (set by recovery)
        required: false
        type: string
      source-sha:
        description: Exact landed catalog commit to publish (set by recovery)
        required: false
        type: string
      platform:
        description: 'Native platforms to publish. Select Linux to repair Linux-only dependencies without starting a macOS source build.'
        required: false
        default: all
        type: choice
        options: [all, linux, darwin-arm64]
      packages:
        description: 'Domains to build (space/comma separated). domain@version builds exactly that version, e.g. abseil.io@20250127.2. Empty = autodetect from the push diff.'
        required: false
        type: string
      max-versions:
        description: 'Max versions per package to (re)build.'
        required: false
        default: '3'
        type: string
      popular-max-versions:
        description: 'Max versions for popular packages. Set explicitly for targeted rebuilds.'
        required: false
        default: '20'
        type: string
      verify-tools-only:
        description: 'Verify native managed toolchains only; no package builds or registry writes.'
        required: false
        default: false
        type: boolean
      rebuild-existing:
        description: 'Explicitly rebuild accepted versions to validate reproduction. Packaging repairs must publish new recipe revisions.'
        required: false
        default: false
        type: boolean

concurrency:
  # Different catalog requests publish independently. Duplicate dispatches of
  # one request serialize, and accepted artifact identities are skipped. Manual
  # publications without a request ID keep their own independent run group.
  group: publish-changed-${{ inputs.request-id || github.run_id }}
  cancel-in-progress: false

env:
  # Share verified dependency archives across packages, stripes, and CI runs.
  PANTRY_CACHE_BUILD_DEPENDENCIES: 'true'
  # Authenticated build-status reporting (same ptry_ registry token).
  PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
  # Object storage (defaults to AWS S3; repo vars point it at Hetzner).
  STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
  S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  AWS_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  # Per-package build-script timeout (ms). Default is 60 min; the full mysql
  # server compile needs ~90 min, so raise it to 180 min for the heavy builds.
  BUILD_SCRIPT_TIMEOUT_MS: '10800000'

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.owners.outputs.domains }}
      desktop: ${{ steps.owners.outputs.desktop }}
      darwin_native: ${{ steps.darwin.outputs.domains }}
      # Forced rebuilding requires an explicit manual input, never a recipe diff.
      rebuild_existing: ${{ steps.detect.outputs.rebuild_existing }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 0

      - name: Setup Pantry
        uses: ./packages/action
        with:
          install: 'false'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Determine changed package domains
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # PAT-backed updater pushes can fire this trigger. Their durable
          # requests belong to recovery; avoid a second untracked publication.
          if [ "${{ github.event_name }}" = "push" ] && \
            git diff --name-only --diff-filter=A "${{ github.event.before }}" HEAD -- .github/catalog-publications/ | grep -q '\.json$'; then
            echo "domains=" >> "$GITHUB_OUTPUT"
            echo "rebuild_existing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MANUAL="${{ github.event.inputs.packages }}"
          if [ -n "$MANUAL" ]; then
            DOMAINS=$(echo "$MANUAL" | tr ', ' '\n' | sed '/^$/d')
          else
            SOURCE="$(git rev-parse HEAD)"
            BEFORE="${{ github.event.before }}"
            # New branch / unknown base ⇒ fall back to the last commit.
            case "$BEFORE" in ''|0000000000000000000000000000000000000000) BEFORE="${SOURCE}~1" ;; esac
            # Compare parsed version arrays rather than the declaration line.
            # Version lists are multiline, so line-based detection misses the
            # normal case where the updater inserts a new array item.
            DOMAINS=$(bun packages/ts-pantry/scripts/changed-package-domains.ts \
              "$BEFORE" "$SOURCE")
          fi
          DOMAINS=$(echo "$DOMAINS" | sed '/^$/d' | sort -u | paste -sd' ' -)
          echo "Detected changed packages: ${DOMAINS:-<none>}"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"

          # A changed recipe describes new packaging, not permission to replace
          # an accepted artifact. Revision-aware discovery selects the new
          # identity; already-published identities remain no-op skips.
          REBUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.rebuild-existing }}" = "true" ]; then
            REBUILD=true
          fi
          echo "Explicitly rebuild accepted versions: $REBUILD"
          echo "rebuild_existing=$REBUILD" >> "$GITHUB_OUTPUT"

      - name: Select the native publication owner
        id: owners
        env:
          DOMAINS: ${{ steps.detect.outputs.domains }}
          PLATFORM: ${{ inputs.platform }}
          VERIFY_ONLY: ${{ inputs.verify-tools-only }}
          REQUEST_ID: ${{ inputs.request-id }}
        run: |
          if [ "$PLATFORM" = linux ] || [ "$VERIFY_ONLY" = true ] || [ -n "$REQUEST_ID" ]; then
            echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"
            echo "desktop=" >> "$GITHUB_OUTPUT"
          else
            bun packages/ts-pantry/scripts/publication-owners.ts "$DOMAINS" >> "$GITHUB_OUTPUT"
          fi

      # Darwin artifacts require native Mach-O inspection, loader normalization,
      # and health checks, including packages that download a vendor archive.
      - name: Determine darwin-native domains
        if: inputs.platform != 'linux'
        id: darwin
        working-directory: packages/ts-pantry
        shell: bash
        env:
          DOMAINS: ${{ steps.owners.outputs.domains }}
        run: |
          if [ -z "$DOMAINS" ]; then echo "domains=" >> "$GITHUB_OUTPUT"; exit 0; fi
          PKGS=$(echo "$DOMAINS" | tr ' ' ',')
          # Native library normalization needs Mach-O tooling even when an
          # upstream prebuilt exists. Preserve exact versions in this handoff.
          NATIVE=$(bun scripts/build-all-packages.ts \
            --platform darwin-arm64 -p "$PKGS" --print-selected | tr -s ' ' | sed 's/^ *//; s/ *$//')
          echo "darwin-native (need a real Mac): ${NATIVE:-<none>}"
          echo "domains=$NATIVE" >> "$GITHUB_OUTPUT"

  desktop-updates:
    name: Publish desktop changes through the vendor planner
    needs: detect
    if: github.ref == 'refs/heads/main' && needs.detect.outputs.desktop != '' && inputs.verify-tools-only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wake the native desktop update workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run check-desktop-updates.yml --repo "$REPOSITORY" --ref main -f publish=true

  build:
    name: Publish (${{ matrix.platform.name }})
    needs: detect
    if: needs.detect.outputs.domains != '' && inputs.platform != 'darwin-arm64'
    runs-on: ${{ matrix.platform.os }}
    # Download-first (--pkgx-mirror) is seconds per package; the headroom is for
    # the CUSTOM source fallbacks (php/mysql/postgres) that DO compile on the
    # native linux legs (mysql 8.0.43 reached 64% in ~60 min of compile).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # Linux publications execute on matching native CPU architectures.
        # Darwin publication is handled by the native macOS job below.
        platform:
          - { name: linux-x86-64, os: ubuntu-latest, needs_toolchain: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, needs_toolchain: true }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha || github.sha }}

      - name: Setup Pantry
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Select managed native build tools
        if: matrix.platform.needs_toolchain
        id: build-tools
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"

      - name: Install native build tools through Pantry
        if: matrix.platform.needs_toolchain
        uses: ./packages/action
        with:
          install: 'false'
          packages: ${{ steps.build-tools.outputs.packages }}

      - name: Verify managed native tool identities
        if: matrix.platform.needs_toolchain
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts

      - name: Publish changed packages (download-first)
        if: inputs.verify-tools-only != true
        env:
          CC: clang
          CXX: clang++
          LD: ld
          PANTRY_BUILD_DIAGNOSTICS_DIR: ${{ runner.temp }}/pantry-build-diagnostics
        working-directory: packages/ts-pantry
        shell: bash
        run: |
          set -o pipefail
          DOMAINS="${{ needs.detect.outputs.domains }}"
          PKGS=$(echo "$DOMAINS" | tr ' ' ',')
          MAXV="${{ github.event.inputs.max-versions || '3' }}"
          POPULAR_MAXV="${{ github.event.inputs.popular-max-versions || '20' }}"
          # --force only when a recipe actually changed (see the detect job).
          FORCE=""
          if [ "${{ needs.detect.outputs.rebuild_existing }}" != "false" ]; then
            FORCE="--force"
            echo "Recipe change (or manual run): re-building versions already in S3."
          else
            echo "Version bump only: leaving versions already in S3 alone."
          fi
          COMMON="-b $S3_BUCKET -r $S3_REGION --platform ${{ matrix.platform.name }} -p $PKGS --multi-version --max-versions $MAXV --popular-max-versions $POPULAR_MAXV $FORCE"
          echo "Publishing (download-first) $PKGS -> ${{ matrix.platform.name }}"
          bun scripts/build-all-packages.ts $COMMON --pkgx-mirror

      - name: Retain toolchain provenance and failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-diagnostics-${{ matrix.platform.name }}
          path: ${{ runner.temp }}/pantry-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # Every Darwin publication runs natively so downloaded and compiled binaries
  # receive the same loader checks and required runtime health checks.
  publish-darwin-native:
    name: Publish darwin-arm64 (native macOS)
    needs: detect
    if: needs.detect.outputs.darwin_native != '' && inputs.platform != 'linux'
    # Current dependency binaries use APIs supplied by macOS 15 (for example
    # gettext's strchrnul). The native host must satisfy their runtime floor.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha || github.sha }}

      - name: Setup Pantry
        uses: ./packages/action
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Select managed native build tools
        id: build-tools
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts --packages >> "$GITHUB_OUTPUT"

      - name: Install native build tools through Pantry
        uses: ./packages/action
        with:
          install: 'false'
          packages: ${{ steps.build-tools.outputs.packages }}

      - name: Verify managed tools and the native Apple SDK
        run: bun packages/ts-pantry/scripts/native-publisher-toolchain.ts

      - name: Build and publish darwin-arm64 (native)
        if: inputs.verify-tools-only != true
        working-directory: packages/ts-pantry
        env:
          CC: clang
          CXX: clang++
          LD: ld
          PANTRY_BUILD_DIAGNOSTICS_DIR: ${{ runner.temp }}/pantry-build-diagnostics
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          PKGS=$(echo "${{ needs.detect.outputs.darwin_native }}" | tr ' ' ',')
          MAXV="${{ github.event.inputs.max-versions || '3' }}"
          POPULAR_MAXV="${{ github.event.inputs.popular-max-versions || '20' }}"
          # Recipe changes must replace existing native artifacts too. Custom
          # builds keep their source patches even when pkgx has a prebuilt.
          FORCE_ARGS=()
          if [ "${{ needs.detect.outputs.rebuild_existing }}" != "false" ]; then
            FORCE_ARGS+=(--force)
          fi
          echo "Native darwin-arm64 build + publish: $PKGS"
          bun scripts/build-all-packages.ts \
            -b "$S3_BUCKET" -r "$S3_REGION" \
            --platform darwin-arm64 \
            -p "$PKGS" --pkgx-mirror --multi-version --max-versions "$MAXV" --popular-max-versions "$POPULAR_MAXV" "${FORCE_ARGS[@]}"

      - name: Retain toolchain provenance and failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-diagnostics-darwin-native
          path: ${{ runner.temp }}/pantry-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  request-recovery:
    name: Request publication recovery
    needs: [detect, build, publish-darwin-native]
    if: >-
      always() && !cancelled() && inputs.request-id != '' &&
      inputs.platform == 'all' && inputs.verify-tools-only != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      # Explicit workflow_dispatch survives suppression of events caused by
      # GITHUB_TOKEN. Recovery awaits this run's final state before inspecting
      # native job verdicts, so dispatching from its final job cannot race ACK.
      - name: Wake publication recovery after the native jobs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run recover-catalog-publications.yml \
            --repo "$REPOSITORY" --ref main \
            -f publisher-run="$GITHUB_RUN_ID"
