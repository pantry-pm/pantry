name: Full source CI gate

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: verify exact full source CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up the qualified managed runtime
        uses: ./packages/action
        with:
          version: 0.11.120
          install: 'false'
          packages: bun.com@1.4.3
      - name: Require every acceptance job for this exact main commit
        run: bun .github/scripts/source-ci-gate.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain exact source CI read-back
        uses: actions/upload-artifact@v4
        with:
          name: source-ci-gate
          path: artifacts/source-ci-gate.json
          if-no-files-found: error
