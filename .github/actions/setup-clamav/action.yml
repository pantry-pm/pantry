name: Set up isolated ClamAV
description: Install and start a bounded local clamd for malware-scanning workflows

runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: /var/lib/clamav
        # The first completed matrix job seeds an immutable cache for the
        # remaining jobs in this run. Every run still refreshes signatures.
        key: pantry-clamav-${{ runner.os }}-${{ github.run_id }}
    - shell: bash
      run: |
        set -euo pipefail
        sudo systemctl stop clamav-freshclam clamav-daemon 2>/dev/null || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          clamav clamav-daemon clamav-freshclam >/dev/null
        sudo systemctl stop clamav-freshclam clamav-daemon 2>/dev/null || true
        sudo freshclam --stdout || {
          test -s /var/lib/clamav/main.cvd -o -s /var/lib/clamav/main.cld
        }
        set_clam() {
          key="$1"
          value="$2"
          if sudo grep -Eq "^[#[:space:]]*${key}[[:space:]]+" /etc/clamav/clamd.conf; then
            sudo sed -Ei "s|^[#[:space:]]*${key}[[:space:]]+.*|${key} ${value}|" /etc/clamav/clamd.conf
          else
            printf '%s %s\n' "$key" "$value" | sudo tee -a /etc/clamav/clamd.conf >/dev/null
          fi
        }
        set_clam LocalSocket /run/clamav/clamd.ctl
        set_clam StreamMaxLength 2G
        set_clam MaxScanSize 8G
        set_clam MaxFileSize 2G
        set_clam AlertExceedsMax yes
        set_clam MaxRecursion 30
        # Historical package archives can legitimately contain vendored trees
        # above production's 100k-file ceiling. Hosted reconciliation runners
        # are ephemeral and remain bounded by MaxScanSize and MaxScanTime.
        set_clam MaxFiles 1000000
        set_clam MaxScanTime 1800000
        set_clam MaxThreads 2
        set_clam MaxQueue 4
        sudo systemctl restart clamav-daemon.socket
        sudo systemctl restart clamav-daemon
        probe_file=$(mktemp)
        trap 'rm -f "$probe_file"' EXIT
        timeout 90 clamdscan \
          --config-file=/etc/clamav/clamd.conf \
          --ping 30:2 \
          --wait \
          --stream \
          "$probe_file"
        scanner_version=$(clamscan --version)
        case "$scanner_version" in
          */*) echo "PANTRY_BACKFILL_CLAMAV_VERSION=$scanner_version" >> "$GITHUB_ENV" ;;
          *) echo "ClamAV did not report engine and database versions" >&2; exit 1 ;;
        esac
