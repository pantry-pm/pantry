name: Merge via PR
description: >-
  Land an already-committed change on the default branch through a pull request
  that actually runs the required checks.

inputs:
  token:
    description: "GitHub token with contents, pull-requests and actions write."
    required: true
  branch-prefix:
    description: "Branch namespace for the pull request's head."
    required: false
    default: 'chore/automated'
  title:
    description: "Pull request title. Defaults to the commit subject."
    required: false
    default: ''
  body:
    description: "Pull request body."
    required: false
    default: ''
  checks:
    description: "Comma-separated required check names to wait for."
    required: false
    default: 'lint,typecheck,test,zig-tests'
  workflow:
    description: "Workflow dispatched to produce those checks."
    required: false
    default: 'ci.yml'
  timeout-minutes:
    description: "How long to wait for the checks before giving up."
    required: false
    default: '40'

outputs:
  merged:
    description: "true when the pull request was merged."
    value: ${{ steps.land.outputs.merged }}
  pr-number:
    description: "Number of the pull request that was opened."
    value: ${{ steps.land.outputs.pr-number }}
  pr-url:
    description: "URL of the pull request that was opened."
    value: ${{ steps.land.outputs.pr-url }}

runs:
  using: composite
  steps:
    # A bot cannot push to the default branch: the branch ruleset requires the
    # CI contexts, and `github-actions[bot]` holds no repository role, so its
    # push is refused with GH013. Going through a pull request is the honest
    # answer — the generated catalog gets checked like anything else — but it
    # needs one piece of care. GitHub suppresses events caused by GITHUB_TOKEN,
    # which covers a pull request opened with it just as it covers a push, so
    # the `pull_request` trigger never fires and nothing would ever report
    # against the required contexts. Dispatching CI at the head branch does
    # report: a check run is attached to a commit, and that commit is the one
    # the pull request is gated on.
    - name: Land the commit through a pull request
      id: land
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.event.repository.default_branch || 'main' }}
        PREFIX: ${{ inputs.branch-prefix }}
        TITLE_IN: ${{ inputs.title }}
        BODY_IN: ${{ inputs.body }}
        CHECKS: ${{ inputs.checks }}
        WORKFLOW: ${{ inputs.workflow }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -uo pipefail

        BRANCH="${PREFIX}/${RUN_ID}-${RUN_ATTEMPT}"
        SHA="$(git rev-parse HEAD)"
        TITLE="${TITLE_IN:-$(git log -1 --pretty=%s)}"
        echo "merged=false" >> "$GITHUB_OUTPUT"

        # Each run's commit regenerates the whole of what the last one wrote, so
        # an older open pull request from this same prefix is superseded rather
        # than merely stale. Closing it keeps a red or slow run from piling up a
        # queue of pull requests that all say the same thing.
        gh pr list --repo "$REPO" --state open --json number,headRefName \
          --jq ".[] | select(.headRefName | startswith(\"${PREFIX}/\")) | .number" 2>/dev/null \
          | while read -r stale; do
              [ -n "$stale" ] || continue
              echo "Superseding #${stale}"
              gh pr close "$stale" --repo "$REPO" --delete-branch \
                --comment "Superseded by a newer automated run." || true
            done

        if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
          echo "::error::could not push ${BRANCH}"
          exit 1
        fi

        PR_URL="$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
          --title "$TITLE" --body "${BODY_IN:-Opened automatically so the required checks run on generated output.}")"
        if [ -z "$PR_URL" ]; then
          echo "::error::could not open a pull request for ${BRANCH}"
          git push origin --delete "$BRANCH" || true
          exit 1
        fi
        PR_NUMBER="${PR_URL##*/}"
        echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
        echo "Opened ${PR_URL}"

        if ! gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"; then
          echo "::error::could not dispatch ${WORKFLOW} at ${BRANCH}; nothing would report on ${SHA}"
          exit 1
        fi

        IFS=',' read -ra WANTED <<< "$CHECKS"
        DEADLINE=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
        while :; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::error::${CHECKS} did not all report on ${SHA} within ${TIMEOUT_MIN}m; ${PR_URL} is left open"
            exit 1
          fi

          RUNS="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "")"' 2>/dev/null)"

          PASSED=0
          FAILED=''
          for want in "${WANTED[@]}"; do
            line="$(printf '%s\n' "$RUNS" | awk -F'\t' -v n="$want" '$1 == n { print; exit }')"
            [ -n "$line" ] || continue
            status="$(printf '%s' "$line" | cut -f2)"
            [ "$status" = "completed" ] || continue
            case "$(printf '%s' "$line" | cut -f3)" in
              success|skipped|neutral) PASSED=$((PASSED + 1)) ;;
              *) FAILED="${FAILED:+$FAILED, }${want}" ;;
            esac
          done

          if [ -n "$FAILED" ]; then
            echo "::error::required checks failed on generated output: ${FAILED}. ${PR_URL} is left open to show why."
            exit 1
          fi
          [ "$PASSED" -eq "${#WANTED[@]}" ] && break
          sleep 20
        done

        if ! gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch; then
          echo "::error::checks passed but ${PR_URL} would not merge; it is left open"
          exit 1
        fi
        echo "merged=true" >> "$GITHUB_OUTPUT"
        echo "Merged ${PR_URL}"
