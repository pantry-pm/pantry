name: Report Failure
description: Open (or update) a GitHub issue when a build/publish job fails, so failures are never silent.

inputs:
  token:
    description: "GitHub token with issues-write permission."
    required: true
  name:
    description: "Name of the workflow that failed."
    required: false
    default: ''
  run-url:
    description: "URL of the failed run."
    required: false
    default: ''
  context:
    description: "Short extra context (e.g. the packages/platform being built)."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: File or update CI-failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CTX: ${{ inputs.context }}
        WF: ${{ inputs.name }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ inputs.run-url }}
        SHA: ${{ github.sha }}
        REF: ${{ github.ref_name }}
        FALLBACK_WF: ${{ github.workflow }}
        FALLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        WF="${WF:-$FALLBACK_WF}"
        RUN_URL="${RUN_URL:-$FALLBACK_URL}"
        TITLE="[ci-failure] ${WF}"
        BODY=$(printf 'Workflow **%s** failed.\n\n- Run: %s\n- Commit: %s\n- Ref: %s\n- Context: %s\n\n_Auto-filed by the report-failure action; re-runs comment here instead of opening duplicates._' \
          "$WF" "$RUN_URL" "$SHA" "$REF" "${CTX:-n/a}")

        # Dedupe: if an open issue with this exact title exists, comment on it;
        # otherwise open a new one. Never fail the run because reporting failed.
        EXISTING=$(gh issue list --repo "$REPO" --state open --label ci-failure --search "$TITLE in:title" \
          --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" 2>/dev/null || true)

        if [ -n "${EXISTING:-}" ]; then
          gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" || true
          echo "Commented on existing issue #$EXISTING"
        else
          # Ensure the label exists (ignore if it already does), then create.
          gh label create ci-failure --repo "$REPO" --color B60205 --description "Automated CI build/publish failure" >/dev/null 2>&1 || true
          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label ci-failure \
            || gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || true
        fi
