name: Setup Pantry
description: Install pantry package manager from pre-built binaries
author: home-lang

branding:
  icon: package
  color: blue

inputs:
  version:
    description: Pantry version to install (e.g. "0.8.3"). Defaults to "latest".
    required: false
    default: latest
  packages:
    description: Space-separated list of packages to install after setup
    required: false
    default: ''
  services:
    description: Space-separated native CI services (redis@X.Y.Z, postgres@17.11, mysql@26.7.0, typesense@30.2, dynamodb@3.3.0); each is health-checked and stopped after the job. DynamoDB Local currently requires Linux x86-64.
    required: false
    default: ''
  config-path:
    description: Path to pantry config file
    required: false
    default: pantry.config.ts
  install:
    description: Run pantry install after setup (reads pantry.jsonc/package.json)
    required: false
    default: 'true'
  publish:
    description: Publish package to pantry registry. Set to "zig" for Zig packages (reads build.zig.zon) or "npm" for JS/TS packages.
    required: false
    default: ''
  package-dir:
    description: Directory to publish from. Useful for monorepos where build.zig.zon or package.json lives below the repository root.
    required: false
    default: ''
  registry-url:
    description: Pantry registry URL for publishing
    required: false
    default: 'https://registry.pantry.dev'
  token:
    description: Pantry registry token for publishing (e.g. from secrets.PANTRY_TOKEN). Exported as PANTRY_TOKEN and PANTRY_REGISTRY_TOKEN for subsequent steps.
    required: false
    default: ''
  github-token:
    description: GitHub token used to authenticate upstream version lookups (api.github.com). Unauthenticated reads share a 60 req/hr quota across the runner pool's IP range, which is routinely exhausted and makes a valid version pin look unsatisfiable. Set to '' to opt out.
    required: false
    default: ${{ github.token }}
  discord-webhook:
    description: Discord webhook URL for release notifications. Sends a rich embed after successful publish.
    required: false
    default: ''
  slack-webhook:
    description: Slack webhook URL for release notifications. Sends a rich message after successful publish.
    required: false
    default: ''
  notification-title:
    description: Custom title for release notifications. Defaults to "{name}@{version} — Published".
    required: false
    default: ''
  notification-mentions:
    description: 'Discord role/user mentions or Slack user IDs to ping (e.g. "<@&ROLE_ID>" for Discord, "<@U12345>" for Slack)'
    required: false
    default: ''
  release:
    description: Create a GitHub release. Attaches files and extracts changelog.
    required: false
    default: 'false'
  release-files:
    description: 'Newline-separated glob patterns of files to attach. Use "auto" to package build output or "none" for a notes-only release.'
    required: false
    default: ''
  release-tag:
    description: Tag name for the release. Defaults to github.ref_name.
    required: false
    default: ''
  release-make-latest:
    description: 'Whether GitHub marks this release as latest: auto uses the highest stable semantic-version tag; true, false, and legacy map directly to GitHub.'
    required: false
    default: auto
  release-draft:
    description: Create a draft release
    required: false
    default: 'false'
  release-prerelease:
    description: Mark release as prerelease
    required: false
    default: 'false'
  release-notes:
    description: Custom release notes (used if changelog extraction finds nothing)
    required: false
    default: ''
  release-changelog:
    description: 'Release notes source. A file path extracts the tag''s section from it (default CHANGELOG.md); "auto" generates the notes from git history with logsmith (previous tag → this tag).'
    required: false
    default: CHANGELOG.md
  release-checksums:
    description: Generate a checksums.txt manifest over the release files and attach it. Set to "true" (sha256) or a named algorithm (e.g. "sha512").
    required: false
    default: ''
  release-token:
    description: GitHub token for creating releases. Defaults to GITHUB_TOKEN.
    required: false
    default: ''
  release-dry-run:
    description: Plan configured release targets without uploading to the App Store or object storage
    required: false
    default: 'false'
  apple-signing:
    description: Import Apple signing certificates into a temporary keychain before the build, and remove it when the job ends. Requires a macOS runner.
    required: false
    default: 'false'
  apple-signing-application-certificate:
    description: Base64-encoded .p12 holding the application signing certificate. Defaults to APPLE_APPLICATION_CERTIFICATE.
    required: false
    default: ''
  apple-signing-installer-certificate:
    description: Base64-encoded .p12 holding the installer signing certificate, needed to build an App Store .pkg. Defaults to APPLE_INSTALLER_CERTIFICATE.
    required: false
    default: ''
  apple-signing-certificate-password:
    description: Password protecting the .p12 certificates. Defaults to APPLE_CERTIFICATE_PASSWORD.
    required: false
    default: ''
  apple-signing-provisioning-profile:
    description: Base64-encoded .provisionprofile written to disk for embedding in the app bundle. Defaults to APPLE_PROVISIONING_PROFILE.
    required: false
    default: ''
  release-app-store:
    description: Validate and upload a signed macOS .pkg to App Store Connect before publishing the GitHub release
    required: false
    default: 'false'
  release-app-store-package:
    description: Path to the signed .pkg. Defaults to the only .pkg in release-files.
    required: false
    default: ''
  release-app-store-bundle-id:
    description: Bundle identifier recorded in the App Store delivery receipt
    required: false
    default: ''
  release-app-store-version:
    description: Marketing version recorded in the App Store delivery receipt
    required: false
    default: ''
  release-app-store-build-number:
    description: Build number recorded in the App Store delivery receipt
    required: false
    default: ''
  release-app-store-api-key-id:
    description: App Store Connect API key ID. Defaults to APP_STORE_CONNECT_API_KEY_ID.
    required: false
    default: ''
  release-app-store-issuer-id:
    description: App Store Connect API issuer ID. Defaults to APP_STORE_CONNECT_ISSUER_ID.
    required: false
    default: ''
  release-app-store-private-key:
    description: App Store Connect .p8 private key contents. Defaults to APP_STORE_CONNECT_PRIVATE_KEY.
    required: false
    default: ''
  release-app-store-validate-only:
    description: Validate the package without uploading it
    required: false
    default: 'false'
  release-app-store-retry-existing:
    description: Treat an already-uploaded bundle version as a successful repeat run
    required: false
    default: 'true'
  release-s3:
    description: Mirror release artifacts, changelog, manifest, and latest pointer to S3-compatible storage
    required: false
    default: 'false'
  release-s3-provider:
    description: Object storage provider (aws, backblaze, or hetzner)
    required: false
    default: aws
  release-s3-bucket:
    description: Object storage bucket
    required: false
    default: ''
  release-s3-region:
    description: Object storage region or location
    required: false
    default: ''
  release-s3-endpoint:
    description: Optional S3-compatible endpoint host or URL
    required: false
    default: ''
  release-s3-prefix:
    description: Object key prefix. Defaults to releases/{owner}/{repo}.
    required: false
    default: ''
  release-s3-public-url:
    description: Optional public base URL used in release receipts and latest.json
    required: false
    default: ''
  release-s3-force-path-style:
    description: Force path-style S3 addressing
    required: false
    default: 'false'
  release-s3-cache-control:
    description: Cache-Control value reserved for mirrored release objects
    required: false
    default: 'public, max-age=31536000, immutable'
  release-s3-access-key-id:
    description: Object storage access key ID. Defaults to AWS_ACCESS_KEY_ID.
    required: false
    default: ''
  release-s3-secret-access-key:
    description: Object storage secret access key. Defaults to AWS_SECRET_ACCESS_KEY.
    required: false
    default: ''
  release-s3-session-token:
    description: Optional object storage session token. Defaults to AWS_SESSION_TOKEN.
    required: false
    default: ''

outputs:
  pantry-path:
    description: Path to the installed pantry binary
  version:
    description: The version of pantry that was installed
  release-url:
    description: URL of the created GitHub release (when release is enabled)
  release-manifest:
    description: Path to the generated release-manifest.json
  apple-signing-identity:
    description: Application signing identity imported from the certificates. Also exported as APPLE_SIGNING_IDENTITY.
  apple-signing-installer-identity:
    description: Installer signing identity imported from the certificates. Also exported as APPLE_INSTALLER_SIGNING_IDENTITY.
  apple-signing-provisioning-profile:
    description: Path to the written provisioning profile. Also exported as APPLE_PROVISIONING_PROFILE_PATH.
  release-app-store-receipt:
    description: Path to the generated App Store delivery receipt
  release-s3-receipt:
    description: Path to the generated S3 mirror receipt
  redis-url:
    description: Loopback Redis URL when the redis service is requested
  redis-version:
    description: Running Redis version when the redis service is requested
  postgres-url:
    description: Authenticated loopback PostgreSQL URL for this job's private database
  postgres-version:
    description: Running PostgreSQL version
  mysql-url:
    description: Authenticated loopback MySQL URL with mandatory TLS for this job
  mysql-version:
    description: Running MySQL version
  typesense-url:
    description: Loopback Typesense URL for this job's private search node
  typesense-version:
    description: Running Typesense version
  dynamodb-url:
    description: Local DynamoDB endpoint for this job's private test database, without AWS cloud authentication
  dynamodb-version:
    description: Running DynamoDB Local version

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: always()
